      Crash entre os 2 steps deixava saldo evaporando (saiu da origem mas
      não chegou no destino).
    fix: >
      Migration `20260527_p3_rpc_wms_replenishment_atomico.sql` cria
      RPC `wms_replenishment_intra_galpao` que faz S+E na mesma transação.
      `replenishmentIntraGalpao()` no TS agora delega tudo pra RPC.
    files:
