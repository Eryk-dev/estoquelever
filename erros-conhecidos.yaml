      código é: quando origem_tipo ∈ {reserva_pedido, liberacao_reserva},
      origem_id carrega o siso_pedidos.id (Tiny ID). A validação foi
      adicionada sem considerar essa convenção.
      Efeito visível: operador clica checkbox no marcar-item, o try/catch
      externo em route.ts:170 engole o throw com warn "Mov WMS skipped",
      mas marca separacao_marcado=true sem criar mov S/L. Resultado:
      reserva R fica órfã na loc (estoque não foi deduzido), pedido segue
      como "separado". Afetou 49 pedidos entre o cutover WMS_AS_SOURCE
      (25/05 19:18) e a fix (26/05).
