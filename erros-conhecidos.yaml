      de mov compartilhada). Backend: helper resetarEstadoSeparacaoItens
      compartilhado entre encaminhar/reiniciar/voltar-etapa/produto-esgotado,
      lock pessimista pós-mov com batch claim 2-pass, cascade multi-empresa em
      parcial, auth nos endpoints destrutivos, concluir-oc bloqueia realocs
      pendentes. Frontend: array de realocacao_ids, distinguir 409 errors,
