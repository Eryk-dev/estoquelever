  - id: guarda-cross-dock-destino-sugerido-nao-preenche-tablet
    date: "2026-05-29"
    source: wms.guarda (detalhe + rota)
    category: business_logic
    message: "Pendência cross-dock não pré-preenche a loc PACKING sugerida ao abrir a guarda no tablet"
    cause: >
      O destino cross-dock (ex.: PACKING-CWB) é gravado na coluna
      siso_wms_pendencias_guarda.destino_sugerido_id (localizacao_destino_id fica
      NULL). A feature foi entregue pela metade: só a tela de FILA (/wms/guarda,
      via listarPendencias + PendenciaRow) foi ligada pra ler esse campo — mostrava
      "PACKING-CWB · sugerido". As telas de DETALHE (/wms/guarda/[id]) e ROTA
      (/wms/guarda/rota) nunca foram:
      (1) obterPendencia() e listarRotaPendencias() NÃO faziam o JOIN destino_sugerido,
          então pendencia.destino_sugerido.codigo vinha undefined no client.
      (2) o prefill destinoEscolhido das duas páginas só olhava localizacao_destino_id
          (null) e a sugestão GENÉRICA de putaway (sugerirLocalizacaoPutaway) — nunca
          destino_sugerido_id. No detalhe caía pra DEFAULT-PICKING; na rota pra
          "— sem destino".
      O JSDoc do criarPendencia já dizia que destino_sugerido_id "pré-preenche o form
      do tablet" — a intenção existia, faltou consumir.
