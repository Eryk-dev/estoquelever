      cleanup. Verificação revelou 17 arquivos prod (12 routes + 5 lib)
      tocando a tabela em hot paths (webhook, separação, compras).
      Importante: siso_pedido_item_estoques é SNAPSHOT congelado no
      momento do webhook (`disponivel` naquele instante), não estado
      live. execution-worker usa esse snapshot pra decidir compras
      (semântica diferente de ler de siso_estoque, que reflete estado
      atual e pode ter mudado desde o pedido).
