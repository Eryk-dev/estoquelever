  - id: wms-recebimento-mov-orfa-sem-pendencia-2026-05-19
    date: "2026-05-19"
    source: wms.receber / src/lib/wms/movimentacoes.ts + src/lib/wms/putaway.ts
    category: business_logic
    message: "loc destino não pode ser igual à loc de recebimento (mov fica órfã, sem pendência de guarda)"
    cause: >
      Combinação de 2 bugs:
      (1) sugerirLocalizacaoPutaway tinha fallback que retornava a própria
          loc tipo='recebimento' como destino sugerido quando o SKU era novo
          no galpão. O frontend pré-preenchia destino=RECEBIMENTO e enviava
          ao POST /api/wms/receber.
      (2) receberEstoque chamava inserirMovimentacao (entrada em RECEBIMENTO)
          e só DEPOIS chamava criarPendencia, que então validava
          destino != origem. Sem transação. Quando a validação falhava, a
          mov de entrada já estava gravada, ficando órfã (saldo em
          RECEBIMENTO sem pendência associada na fila /wms/guarda).
      Caso real: SKU 000001 NetAir/CWB, mov dfe144a3 (10 unidades) ficou
      órfã em 2026-05-19 11:55:35.
