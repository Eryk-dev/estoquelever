- id: MOBILE-PWA-ORIENTATION-TABELA-CLIP
  date: 2026-06-11
  source: wms
  category: business_logic
  message: "PWA instalado do Chrome ficava travado de lado no tablet em landscape; tabelas largas eram cortadas sem pan horizontal no mobile; rodapé sumia atrás da barra de URL"
  cause: >
    Três causas independentes: (1) manifest.webmanifest com
    orientation: portrait trava a orientação do app instalado — tablet
    usado em landscape renderiza a tela rotacionada; (2) .wms-tbl com
    overflow: hidden (pra clipar border-radius) cortava tabelas mais
    largas que a viewport sem criar scroll — o conteúdo ficava
    inalcançável e arrastar não fazia nada; (3) .wms-app com
    height: 100vh — no Chrome mobile 100vh inclui a barra de URL
    recolhida, então o rodapé fica atrás dela.
  fix: >
    orientation: any no manifest (segue o sensor; reinstalar o PWA pra
    pegar); .wms-tbl ganha overflow-x: auto (+ -webkit-overflow-scrolling)
    mantendo o hidden vertical pro radius; .wms-app usa height: 100dvh
    com fallback 100vh.
  files:
    - public/manifest.webmanifest
    - src/app/wms/wms.css
  tags: [mobile, pwa, manifest, orientation, overflow, dvh, tabela]

- id: WEBHOOK-FIRE-FORGET-VENDA-PERDIDA
  date: 2026-06-12
  source: webhook
  category: infrastructure
  message: "22 vendas EasyPeasy aprovadas no Tiny nunca entraram no SISO; webhook logs presos em 'processando' sem erro; polling não recuperava"
  cause: >
    Duas pernas. (1) A rota /api/wms/webhook/tiny respondia 200 e deixava
    processWebhook como promise solta — a função Vercel congela ao
    responder, então quando a fila Tiny rate-limited segurava o fetch
    (picos de 125-204s na queda de conexão da EasyPeasy em 2026-06-11
    21:35), o processamento morria sem rodar o catch: log preso em
    'processando' pra sempre, sem registro de erro. (2)
    logBloqueiaReprocesso no tiny-polling bloqueava reprocesso de
    QUALQUER log de webhook real, mesmo erro/processando morto — por
    design o recovery era só o /webhook/reprocessar manual, então o
    polling via os pedidos no Tiny mas considerava todos "já tratados".
  fix: >
    (1) Rota webhook envolve processWebhook/handleNfWebhook/devolução em
    after() do next/server + maxDuration=300 — função fica viva até o
    processamento terminar. (2) logBloqueiaReprocesso relaxado: 'erro' e
    'processando'/'recebido' presos >1h re-tentam no próximo poll
    independente do tipo; só 'concluido'/'ignorado' e logs frescos em
    voo bloqueiam. O polling vira backstop de verdade — recuperou os 22
    pedidos sozinho no poll seguinte ao deploy.
  files:
    - src/app/api/wms/webhook/tiny/route.ts
    - src/lib/tiny-polling.ts
  tags: [webhook, polling, vercel, fire-and-forget, after, serverless, tiny, easypeasy, venda-perdida]

