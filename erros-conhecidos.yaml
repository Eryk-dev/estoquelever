  - id: separacao-realtime-querykey-mismatch-poll-10s
    date: "2026-05-31"
    source: wms.separacao (lista)
    category: business_logic
    message: "Realtime da lista de separação não atualizava — pedido só aparecia no próximo poll de 10s"
    cause: >
      useRealtimeSeparacao() em modo no-arg (usado pela /wms/separacao) invalidava a
      queryKey ["separacao"], mas a query da lista é registrada sob
      ["wms-separacao", galpao, tab, ...]. invalidateQueries do React Query faz
      prefix-match: ["wms-separacao", ...] NÃO começa com ["separacao"], então o
      evento realtime não invalidava nada. O push instantâneo estava morto; a lista
      só atualizava pelo refetchInterval:10_000 — ao transitar o status de um pedido,
      o operador esperava até ~10s (o próximo tick do poll) pra ver. Os handlers de
      mutação no mesmo arquivo já usavam ["wms-separacao"] correto — a key do hook era
      a única desalinhada.
    fix: >
      use-realtime-separacao.ts:116 passa a invalidar ["wms-separacao"] (prefix que
      casa todas as variações de filtro). Com o realtime funcionando, o UPDATE em
      siso_pedidos (já na publication supabase_realtime) refaz a lista dentro da
      janela de debounce de 500ms.
    files:
      - src/hooks/use-realtime-separacao.ts
    tags: [separacao, realtime, react-query, querykey, prefix-match, poll, latencia, performance]
    notes: >
      Descoberto na auditoria de performance 2026-05-31. Sintoma: "leva 10s pra um
      pedido aprovado aparecer na separação". Lição: a queryKey de invalidação
      realtime deve casar (por prefixo) a key da query — um mismatch desliga o push
      silenciosamente e cai pro poll.

  - id: parcial-qty0-loczerou-ejeta-operador-do-checklist
    date: "2026-06-01"
    source: wms.separacao (checklist — parcial)
    category: business_logic
    message: "Parcial com qty=0 + loc zerou tirava o operador da lista de separação (navegava pra /wms/separacao)"
    cause: >
      No fluxo de Parcial (qty_pega=0 + loc_zerou=true), quando o cascade não acha
      cobertura em nenhuma loc do galpão nem em outro galpão, o backend
      (/api/wms/separacao/parcial) manda o item pra Compras automaticamente
      (mandarItensParaCompras) e retorna status="mandado_pra_compras". O handler
      handleParcialConfirm em checklist/page.tsx tratava esse status com
      router.push("/wms/separacao") — ejetando o operador do checklist de volta pra
      fila, mesmo quando ainda havia outros itens do wave pra pickar. O branch irmão
      "realocado" não navega (só fecha o modal e refetcha), então a UX era
      inconsistente: item realocado = fica na lista; item sem cobertura = sai da tela.
    fix: >
      Removido o router.push("/wms/separacao")+return do branch mandado_pra_compras.
      Agora ele só dá o toast e cai no setParcialModal(null)+invalidateQueries
      compartilhado (igual ao branch realocado): modal fecha, operador fica no
      checklist, o item sem cobertura some da lista no refetch (checklist-items filtra
      compra_status!=null em pedido aguardando_compra) e os demais itens do wave
      seguem pickáveis (marcar-item e bipar-checklist permitem status
      aguardando_compra).
    files:
      - src/app/wms/separacao/checklist/page.tsx
    tags: [separacao, parcial, loc-zerou, checklist, navegacao, router-push, mandado-pra-compras, ux, wave-picking]
    notes: >
      Escopo cirúrgico: só o branch mandado_pra_compras. parcial_reenfileirado (que
      também navega) é outro cenário (qty>0 + !loc_zerou, prateleira ainda com saldo →
      pedido inteiro pro fim da fila) e fica intacto — com loc_zerou=true o backend
      nunca retorna parcial_reenfileirado.

  - id: separacao-oc-pendente-renderizado-como-item-pickavel
    date: "2026-06-01"
    source: wms.separacao.checklist
    category: business_logic
    message: "Itens OC (compra_status=oc_pendente) aparecem em 'Itens a separar' e dão erro mudo ao marcar (checkbox desselecciona, sem mensagem)"
    cause: >
      isOcStatus() em src/app/wms/separacao/checklist/page.tsx classificava só
      'comprado' | 'aguardando_compra' | 'recebido' como OC — OMITIA 'oc_pendente'
      (status setado pelo execution-worker quando o pedido vira OC, fase
      validacao_oc). Existe desde a criação do arquivo (commit 46dc797). Resultado:
      consolidar() jogava os itens oc_pendente no bucket de pick NORMAL (checkbox +
      Parcial) em vez do bucket OC (Encontrei/Esgotado). Esses itens não têm saldo
      disponível pro próprio pedido (disponivel=0 — sem estoque, reservado por OUTRO
      pedido, ou sub-reservado), então marcar-item/parcial recusavam corretamente
      (anti-oversell → 409 sem_saldo_para_baixa / posicao_reservada). Mas o
      toggleMutation engolia a mensagem do 409 num throw genérico "erro_marcar" e o
      handleToggle mostrava "Erro ao salvar marcação" + invalidate (revertia o
      checkbox otimista). Daí o sintoma "dá erro, não fala nada, desseleciona o
      checkbox". Os pedidos chegaram em em_separacao porque eram pure-OC em
      validacao_oc e a wave os puxou (iniciar permite validacao_oc; a BLINDAGEM de
      iniciar só bloqueia compra_status aguardando_compra|comprado, não oc_pendente —
      isso é intencional: oc_pendente é validado inline na wave).
    fix: >
      (1) isOcStatus() agora inclui 'oc_pendente' → os itens caem no bucket OC e
      renderizam como ItemRowOC (Encontrei = achou no físico / Esgotado = manda pra
      Compras). validar-oc-item funciona de em_separacao: 'esgotado' num pedido
      100% OC transita pra aguardando_compra (FR-8). (2) Toasts de erro do checklist
      unificados num helper toastErroApi(): mostram o erro REAL do sistema
      (erroApiTexto junta `error`+`message`), duram 5s e copiam o texto completo pro
      clipboard ao clicar no toast — corrige o "não fala mais nada". (3) Rastreio
      Supabase: logger.logError() passou a gerar id+timestamp, inseri-los
      explicitamente em siso_erros e RETORNÁ-LOS; os catch 500 de
      marcar-item/parcial/validar-oc-item devolvem {erro_id, erro_em} no body e o
      toast mostra/copia "hora · erro <uuid>" → operador acha o log exato (stack
      trace) direto no Supabase.
    files:
      - src/app/wms/separacao/checklist/page.tsx
      - src/lib/logger.ts
      - src/app/api/wms/separacao/marcar-item/route.ts
      - src/app/api/wms/separacao/parcial/route.ts
      - src/app/api/wms/separacao/validar-oc-item/route.ts
    tags: [separacao, checklist, oc, oc_pendente, validacao_oc, isOcStatus, marcar-item, parcial, toggleMutation, erro-mudo, toast-copiavel, siso_erros, erro_id, logError, anti-oversell, wave-picking]
    notes: >
      Dados (staging) que reproduziram: pedidos 938028727/FRM012, 937871815/ACD003,
      938028590/ESC002-P, 938019361/ESC009, 938001164/TEN001-4, 9084419679/TEST-70 —
      todos 1 item oc_pendente, compra_quantidade_recebida=0, em_separacao.
      FOLLOW-UP (não corrigido, bug separado): /api/wms/separacao/parcial linha ~250
      checa `disponivel < quantidade_pega` ANTES de liberar a R do próprio pedido —
      pra item normal/própria que pica do próprio reserve numa loc "justa"
      (saldo=reservado, disponivel=0) isso vira falso "posicao_reservada (reservado
      por outro pedido)". marcar-item já trata certo (acha a R + pickItemAtomico);
      o /parcial deveria somar de volta a R própria da loc antes do gate.

  - id: parcial-ajuste-loc-zerou-viola-reservado-excede-saldo
    date: "2026-06-01"
    source: separacao-parcial (/api/wms/separacao/parcial)
    category: business_logic
    message: "reservado (1) excederia saldo (0) — 500 erro interno no Parcial com loc zerou"
    cause: >
      No Parcial com loc_zerou=true, o mov de ajuste 'ajuste_pick_zerou' zerava o saldo
      da loc com delta = saldoWms - quantidade_pega, IGNORANDO o reservado. Quando a loc
      tinha reservado de OUTRO pedido (R que este fluxo não libera no passo 7a), a saída
      derrubava saldo abaixo do reservado → validarCoerencia em inserirMovimentacao
      estourava (CHECK reservado<=saldo) → catch devolvia {error:"erro interno"} 500.
      Caso real: item 1475 (FRM012, pedido 50064), loc DEFAULT-PICKING saldo=1 reservado=1
      onde o reservado=1 pertencia ao pedido 938012283 (não ao da separação). Operador
      pegou 0 + loc zerou → delta=1 → saldo 1→0 com reservado=1 → violação.
    fix: >
      Capa o delta do ajuste pelo reservado que SOBRA na loc após as liberações deste
      wave: deltaAjuste = max(0, saldoWms - quantidade_pega - reservadoRestanteLoc), onde
      reservadoRestanteLoc = max(0, reservadoWms - liberadoNaLoc) e liberadoNaLoc = soma
      das R deste wave já liberadas no passo 7a (liberacoesPorPedido /
      liberacoesRealocPorPedido). Hoisted num único const deltaAjuste por função, reusado
      no mov, no link da tabela ponte e no evento de auditoria. Aplicado nos DOIS modos
      (processarParcialItem + processarParcialRealocacao). Semântica: operador do pedido A
      não zera estoque reservado pro pedido B — esse reservado só é zerado quando B
      processar a própria loc_zerou (aí o passo 7a libera a R de B e o ajuste fecha a loc).
      Complementa o fix pré-existente do check posicao_reservada (disponivelParaMim /
      reservadoDeOutros) que já tratava o caso qty>0.
    files:
      - src/app/api/wms/separacao/parcial/route.ts
    tags: [separacao, parcial, loc-zerou, ajuste-pick-zerou, reservado, reserva, validarCoerencia, check-constraint, 500, ledger, wms]
    notes: >
      Erro de origem cliente "erro interno" (toast). O fix da navegação
      (parcial-qty0-loczerou-ejeta-operador-do-checklist) só fez o 500 ficar mais
      visível — o operador para na tela e vê o toast em vez de ser levado embora. O 500
      é independente e pré-existente. Verificado contra estado vivo em staging.

  - id: parcial-sem-loczerou-reenfileira-e-pede-qty-cheia
    date: 2026-06-01
    source: separacao-parcial
    category: business_logic
    message: "Parcial sem 'loc zerou' fechava a separação e ao reabrir pedia a qty inteira"
    cause: >
      Dois problemas + um bug latente no Parcial item com loc_zerou=false e residual.
      (1) Comportamento ("Fase 3 #3"): o branch !loc_zerou reenfileirava o pedido INTEIRO
      pro fim da fila (status_separacao='aguardando_separacao' + zera separacao_operador_id
      e separacao_iniciada_em) e o frontend fazia router.push('/wms/separacao') — tirando
      o operador da separação. O esperado é manter o item ABERTO no mesmo checklist com só
      a quantidade restante. (2) Display: o ItemRow mostrava produto.quantidade_total (a
      qty cheia) como alvo, só com um badge pequeno "Parcial X/Y" — o operador via "pegar
      10" mesmo já tendo pego 6 (a baixa em si estava correta: marcar-item descontava só
      quantidade_pedida - quantidade_pega). (3) Bug latente: qty_para_este/qty_residual em
      parcial/route.ts eram calculados sobre quantidade_pedida, IGNORANDO o quantidade_pega
      já existente — refazer Parcial num item já parcial nunca fechava o item (residual
      sempre >0) e reenfileirava em loop. Ficava escondido porque o reenfileiramento
      expulsava o operador antes do 2º Parcial; some assim que o item passa a ficar no
      checklist.
    fix: >
      (1) Branch !loc_zerou não reenfileira mais: pedido continua em_separacao com o mesmo
      operador, item fica aberto (separacao_parcial=false, separacao_marcado=false,
      quantidade_pega acumulada), retorna status 'parcial_em_progresso'. Frontend só dá
      toast + invalidate, sem router.push. concluir já trata item inacabado (fica pendente,
      não conclui errado). (2) Extraído helper puro distribuirQtyPega() que desconta o
      quantidade_pega já pego ao calcular qty_para_este/qty_residual (qty_residual=0 fecha
      o item) — 6 testes unitários (TDD). Guard do teto trocado de quantidade_pedida pra
      "o que falta" (totalFaltante). (3) Display: ConsolidatedProduct ganhou
      quantidade_restante (total − quantidade_pega); ItemRow mostra o restante quando
      parcial-em-progresso e o modal Parcial sugere/limita ao restante.
    files:
      - src/lib/separacao/distribuir-qty-pega.ts
      - src/lib/separacao/distribuir-qty-pega.test.ts
      - src/app/api/wms/separacao/parcial/route.ts
      - src/app/wms/separacao/checklist/page.tsx
      - scripts/wms/cenarios/catalogo/69-parcial-fila-prateleira.ts
      - docs/api-reference-complete.md
    tags: [separacao, parcial, loc-zerou, em-progresso, quantidade-pega, qty-residual, reenfileirar, checklist, wms, distribuirQtyPega]
    notes: >
      Reverte o design "Fase 3 #3" (reenfileirar pro fim da fila) a pedido do user em
      2026-06-01 — confirmado via AskUserQuestion. Cenário 69 reescrito pro novo
      comportamento (era o teste do comportamento antigo). Reserva: o passo 7a continua
      liberando 100% da R original (comportamento pré-existente); marcar-item completa o
      restante via saldo vivo quando não há R. Verificado por unit (distribuir-qty-pega
