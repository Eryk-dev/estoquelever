      Aplicada apenas a migration que adiciona a coluna:
      supabase/migrations/20260528_pendencias_tracking_origem_ids.sql
      (ALTER TABLE ... ADD COLUMN IF NOT EXISTS tracking_origem_ids text[] NULL).

