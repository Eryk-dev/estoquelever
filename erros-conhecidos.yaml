  - id: reserva-falhou-produto-id-zero-resolucao-sku-first
    date: "2026-06-18"
    source: wms (resolução item→produto WMS — webhook/aprovar/worker/pick/receber/trocas/compras)
    category: business_logic
    message: >
      venda no ML com item produto_id=0 (Tiny não vinculou o anúncio a um produto)
      ou empresa vendendo SKU cadastrado só em OUTRA empresa (cross-catálogo, ex.
      NetParts vendendo SKU da NetAir) → pedido parqueado pendente/oc e Aprovar
      retornava 409 reserva_falhou motivo=mapeamento_ausente, MESMO com saldo
      físico na prateleira (ex. #84206 MK0244 com 5 em CWB).
    cause: >
      Toda resolução item→produto WMS passava SÓ por resolverProdutoWms(empresa,
      tiny_produto_id) contra siso_produto_empresas. Com produto_id=0 (ou empresa
      sem bridge) a ponte Tiny falhava e NÃO havia fallback por SKU — embora
      siso_produtos.sku seja UNIQUE global e o estoque seja fungível por (produto,
      galpão, loc) no 3D (empresa é só TAG fiscal). webhook-processor-wms parqueava
      o pedido (requerSku) quando tinyProdutoId===0.
    fix: >
      Resolução SKU-first centralizada em wms-mapping: resolverProdutoWmsFlex
      (substituto → tiny bridge → SKU em siso_produtos) + resolverProdutoWmsPorSku
      + dep buscarProdutoIdPorSku. resolverProdutoWms e resolverProdutoEfetivoDoItem
      delegam pro flex (este SKU-aware via item.sku). Migrados TODOS os callers:
      webhook (resolverItensWms resolve id=0 por SKU; requerSku virou !produtoIdWms),
      aprovar (reservas + cobertura OC + roteamento transferência, keyed por item.id),
      execution-worker (cobertura OC poolada por uuid WMS), receber-oc,
      trocas-equivalencia, produto-esgotado, compras equivalente/cancelamento,
      pick-mov (dep SKU-aware). Tiny vem ANTES do SKU → zero regressão no caminho
      normal id>0; SKU só age quando o tiny falha.
    files:
      - src/lib/separacao/wms-mapping.ts
      - src/lib/webhook-processor-wms.ts
      - src/app/api/wms/pedidos/aprovar/route.ts
      - src/lib/execution-worker.ts
      - src/lib/wms/receber-oc.ts
      - src/lib/wms/trocas-equivalencia.ts
      - src/app/api/wms/separacao/produto-esgotado/route.ts
      - src/app/api/wms/compras/itens/[itemId]/equivalente/confirmar/route.ts
      - src/app/api/wms/compras/itens/[itemId]/cancelamento/confirmar/route.ts
      - src/lib/wms/separacao/pick-mov.ts
    tags: [wms, reserva, reserva_falhou, mapeamento_ausente, produto_id_zero, sku, sku-first, resolverProdutoWmsFlex, cross-catalogo, ml, tiny, siso_produto_empresas, siso_produtos, 3d, fungivel, webhook, aprovar, roteamento]
    notes: >
      Casos reais staging: #84206 (NetParts/MK0244) e #83420 (NetParts/MK0241) —
      maçanetas Cerato com saldo em CWB, SKU cadastrado só na NetAir. #51704
      (EasyPeasy/"Iphone 6s plus") NÃO resolve — produto inexistente no catálogo WMS
      (segue parqueado, correto: exige cadastro). resolverProdutoEfetivoComAutoSync
      (sync-tiny, path do marcar-item) já era SKU-first; mantido. produto_id do item
      fica intocado (fiscal), físico via SKU — mesmo princípio da troca (D3).

  - id: wms-kit-componente-faltante-pulado
    date: "2026-06-18"
    source: wms.sync.kit
    category: business_logic
    message: "Sync de kit do Tiny pulava componente que não estava no catálogo → kit com composição incompleta (ou eh_kit=false)"
    cause: >
      sincronizarComposicaoKit resolvia cada componente por tiny_produto_id em
      siso_produto_empresas; se o componente ainda não estava no catálogo, logava
      "componente não encontrado no catálogo" e fazia continue (pulava). Kit puxado
      fresco (ex.: via botão "Puxar do Tiny" ou cron de sync) ficava sem os
      componentes faltantes — e como eh_kit só vira true com composição existente,
      às vezes o kit nem era marcado como kit. Exigia cadastrar cada componente à
      mão e re-sincronizar.
    fix: >
      sincronizarComposicaoKit agora auto-cadastra o componente faltante via
      ensureComponenteCatalogo: resolve o SKU pelo payload do kit (ou busca o
      detalhe no Tiny pelo id quando vem nulo) e chama ensureProdutoFromTiny
      (cria + sincroniza + ponte), depois linka. ensureProdutoFromTiny/
      sincronizarProduto ganharam kitDepth (limite MAX_KIT_DEPTH=5) pra barrar
      runaway em kit-de-kit. Idempotente: componente já mapeado retorna o uuid sem
      refazer. Fix na raiz (caminho compartilhado) → beneficia "Puxar do Tiny",
      cron de sync de produtos e sync por-linha.
    files:
      - src/lib/wms/sync-tiny.ts
    tags: [kit, componente, sync-tiny, tiny, puxar-tiny, eh_kit, recursao, siso_produto_kits, siso_produto_empresas]
    notes: >
      Componente sem SKU resolvível (nem no payload nem no detalhe Tiny) segue
      pulado com warn — sem regressão. Estoque não é tocado (3D continua por
      componente). Verificar ao vivo puxando um SKU de kit real.

  - id: wms-venda-direta-sku-duplicado-insert
    date: "2026-06-18"
    source: wms.vendas.criar
    category: database
    message: "Venda direta com mesmo SKU em duas linhas → 'Falha ao inserir itens' (genérico no toast)"
    cause: >
      A página /wms/vendas/nova permite adicionar o mesmo produto em linhas
      separadas (cada ItemForm carrega seu próprio produto). O payload ia com dois
      items de mesmo produto_id; o backend mapeava ambos pro mesmo tiny_produto_id
      e o insert em bloco em siso_pedido_itens violava o índice único
      idx_siso_pedido_itens_pedido_produto (pedido_id, produto_id). Erro do Postgres
      virava 500 com detalhe, mas o toast do front só mostrava "Falha ao inserir
      itens" (genérico). Caso real: UTL001 e FRM006 repetidos.
    fix: >
      Backend (vendas/criar): dedupe dos items por produto_id somando a quantidade
      ANTES de resolver disponibilidade — 1 row por produto, consistente com o
      índice único. Reserva, baixa direta, detecção de falta de saldo e o insert
      passam a ver a qty consolidada. Frontend (vendas/nova): botão "Adicionar item"
      movido pro fim da lista (era fixo no topo) — segue o crescimento, operador não
      sobe a cada SKU.
    files:
      - src/app/api/wms/vendas/criar/route.ts
      - src/app/wms/vendas/nova/page.tsx
    tags: [wms, vendas, venda-direta, sku-duplicado, insert, unique-index, siso_pedido_itens, idx_siso_pedido_itens_pedido_produto, toast-generico, ux]
    notes: >
      Dedupe = soma de qty (semântica correta: o índice só admite 1 linha por
      produto/pedido). Se a qty somada exceder o disponível, degrada pra separação
      como antes. Erros de typecheck restantes são em .test.ts pré-existentes,
      não relacionados.

  - id: separacao-loc-picking-ignorada-maior-saldo
    date: "2026-06-18"
    source: wms.separacao (escolha de localização — aprovar/checklist/buscarLocComMaiorSaldoNoGalpao)
    category: business_logic
    message: "App mandava o separador pra loc overstock (maior saldo) mesmo havendo loc picking marcada que cobria o item"
    cause: >
      buscarLocComMaiorSaldoNoGalpao (separacao/wms-mapping.ts) ordenava SÓ por
      `disponivel` desc, sem prioridade de tipo. Com apenasVendaveis=true (criação
      da reserva R em aprovar) picking e overstock competiam por saldo cru → uma
      loc overstock com mais saldo vencia a loc picking que o usuário marcou. A loc
      exibida no checklist (checklist-items/route.ts) era calculada à parte (maior
      `saldo` individual, sem tipo nem exclusão de locks), divergindo do destino real.
    fix: >
      Regra "picking só se cobre tudo" extraída em escolherLocCobrindo (pura,
      exportada de wms-mapping.ts): com a qty do item, prefere a loc `picking` que
      SOZINHA cobre a qty inteira; senão a de maior `disponivel` entre as vendáveis.
      buscarLocComMaiorSaldoNoGalpao ganhou opts.qty e usa a regra no ramo
      apenasVendaveis; aprovar passa a qty do item. O display do checklist usa a
      MESMA regra (sobre `disponivel`, excluindo locs travadas via locsBloqueadasSet),
      batendo com o destino. Fallback de pick sem reserva (pick-mov, caminho OC)
      mantido SEM filtro de propósito (o OC bipa a loc onde achou, inclusive recebimento).
    files:
      - src/lib/separacao/wms-mapping.ts
      - src/app/api/wms/pedidos/aprovar/route.ts
      - src/app/api/wms/separacao/checklist-items/route.ts
      - src/lib/separacao/wms-mapping.test.ts
    tags: [wms, separacao, localizacao, picking, overstock, roteamento, reserva, escolherLocCobrindo, buscarLocComMaiorSaldoNoGalpao, checklist]
    notes: >
      Decisão do user: "picking só se cobre tudo" (não picking-sempre). Só corrige
      o caminho de item NORMAL (onde a R nasce em aprovar + display); os fallbacks
      sem-R (marcar-item/parcial/pick-mov) ficaram intocados pra não quebrar OC
      (mercadoria recebida em loc não-vendável). Pedidos já aprovados com R em
      overstock seguem lá — corrige via troca de localização no pick
      (POST /api/wms/separacao/trocar-localizacao, RPC wms_trocar_reserva_localizacao_atomico).

  - id: compras-em-transito-somado-global-por-sku
    date: "2026-06-18"
