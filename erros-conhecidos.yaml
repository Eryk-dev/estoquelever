      - src/app/api/wms/separacao/marcar-item/route.ts
      - src/lib/wms/reservas-picking.ts
    tags: [wms, separacao, marcar-item, desmarcar, invariante, p3]

  - id: p3-fix-2.10-reiniciar-embalagem-nao-reverte-cutover
    date: "2026-05-27"
    source: wms.separacao.reiniciar
    category: business_logic
    message: 'reiniciar etapa=embalagem deixava saldo permanentemente saído (estado fantasma)'
    cause: >
      Cutover converte R em L+S quando o pedido entra em separado/embalado.
      `reiniciar` com etapa=embalagem só resetava campos do item — não
      revertia as movs do cutover. Resultado: saldo saía do ledger sem
      caminho de volta. Re-iniciar embalagem ficava sem reserva pra cobrir.
    fix: >
      `resetarEstadoSeparacaoItens` em etapa=embalagem agora chama
      `reverterCutoverDoPedido` em `src/lib/wms/cutover.ts`. Estorna as
      movs L e S do cutover anterior + recria as reservas R com saldo
      ressuscitado. Re-iniciar embalagem voltou a ser paritário.
    files:
      - src/app/api/wms/separacao/reiniciar/route.ts
      - src/lib/wms/cutover.ts
      - src/lib/separacao/reset-state.ts
    tags: [wms, separacao, reiniciar, cutover, estado-fantasma, p3]

