    source: separacao-marcar-item
    category: validation
    message: 'inserirMovimentacao: origem_id esperava uuid mas recebeu "937xxx". Provável causa: passou um ID text (ex: siso_pedidos.id) em campo uuid.'
    cause: >
      assertUuidLike(input.origem_id, "origem_id") em src/lib/wms/ledger.ts:113
      rejeitava pedido_id text (Tiny ID, ex: "937897149") passado por
      liberarReservaPicking → inserirMovimentacao. A coluna
