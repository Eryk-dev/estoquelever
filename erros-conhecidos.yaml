      - src/app/api/wms/replenishment/[id]/reverter/route.ts
      - src/lib/wms/movimentacoes.ts
    tags: [wms, replenishment, reverter, reverse, idempotente, p3]

  - id: p3-fix-8.10-receber-transferencia-race
    date: "2026-05-27"
    source: wms.transferencias.receber
    category: business_logic
    message: '2 operadores recebendo a mesma transferência em paralelo → recebimento duplicado'
    cause: >
      `receberTransferencia` não tinha lock no header. Dois operadores
      conferindo o mesmo header ao mesmo tempo: ambos confirmavam, gerando
      2× mov E por item (saldo dobrado no destino).
    fix: >
      Nova coluna `siso_transferencias_galpao.recebimento_em_andamento_por uuid`
      via migration `20260527_p3_transferencia_recebimento_em_andamento.sql`.
      Endpoint faz UPDATE condicional `WHERE recebimento_em_andamento_por IS NULL`
      antes de processar. 1º ganha; 2º recebe 409 TRANSFERENCIA_OUTRO_RECEBIMENTO
      com `bloqueado_por`. Lock é limpo na conclusão ou em erro (try/finally).
    files:
      - supabase/migrations/20260527_p3_transferencia_recebimento_em_andamento.sql
      - src/app/api/wms/transferencias/[id]/receber/route.ts
      - src/lib/wms/transferencias.ts
    tags: [wms, transferencias, receber, anti-race, claim-lock, p3]

  - id: p3-fix-2.7-marcar-item-desmarcar-ordem
    date: "2026-05-27"
    source: wms.separacao.marcar-item
    category: business_logic
    message: 'desmarcar item violava invariante I2 (saldo_anterior+delta=saldo_posterior)'
    cause: >
      Desmarcar item estornava na ordem (1) leg L (estorno de
      liberação_reserva → recria R) e (2) leg S (estorno de nf_venda).
      Mas a leg L recriava R no saldo que a S ainda ocupava — saldo
      momentaneamente reservava mais do que disponível.
    fix: >
      Inverte ordem: estorna leg S primeiro (sai do estoque), depois leg L
      (recria R agora com saldo livre). Sequência paritária e invariante-safe.
    files:
      - src/app/api/wms/separacao/marcar-item/route.ts
      - src/lib/wms/reservas-picking.ts
    tags: [wms, separacao, marcar-item, desmarcar, invariante, p3]

  - id: p3-fix-2.10-reiniciar-embalagem-nao-reverte-cutover
    date: "2026-05-27"
    source: wms.separacao.reiniciar
    category: business_logic
    message: 'reiniciar etapa=embalagem deixava saldo permanentemente saído (estado fantasma)'
    cause: >
      Cutover converte R em L+S quando o pedido entra em separado/embalado.
      `reiniciar` com etapa=embalagem só resetava campos do item — não
      revertia as movs do cutover. Resultado: saldo saía do ledger sem
      caminho de volta. Re-iniciar embalagem ficava sem reserva pra cobrir.
    fix: >
      `resetarEstadoSeparacaoItens` em etapa=embalagem agora chama
      `reverterCutoverDoPedido` em `src/lib/wms/cutover.ts`. Estorna as
      movs L e S do cutover anterior + recria as reservas R com saldo
      ressuscitado. Re-iniciar embalagem voltou a ser paritário.
    files:
      - src/app/api/wms/separacao/reiniciar/route.ts
      - src/lib/wms/cutover.ts
      - src/lib/separacao/reset-state.ts
    tags: [wms, separacao, reiniciar, cutover, estado-fantasma, p3]

