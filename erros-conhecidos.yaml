    cause: >
      assertUuidLike(input.origem_id, "origem_id") em src/lib/wms/ledger.ts:113
      rejeitava pedido_id text (Tiny ID, ex: "937897149") passado por
      liberarReservaPicking → inserirMovimentacao. A coluna
