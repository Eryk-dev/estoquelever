  - id: p3-fix-8.8-sem-reverter-replenishment
    date: "2026-05-27"
    source: wms.replenishment.reverter
    category: business_logic
    message: 'sem caminho pra desfazer replenishment intra-galpão errado'
    cause: >
      Operador faz replenishment pra loc errada → par S+E no ledger. Reverter
      exigia 2 ajustes manuais. Sem botão.
    fix: >
      Novo endpoint `POST /api/wms/replenishment/[origem_id]/reverter`.
      `[id]` aqui é o `origem_id` (uuid) compartilhado pelas movs S+E (não
      há header próprio). Estorna ambas as legs via `estornarMovimentacao`.
      Idempotente — chamadas repetidas pulam movs já estornadas.
