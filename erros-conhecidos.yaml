    cause: >
      processWebhookWms só pulava reprocesso quando estoque_lancado=true. Para
      pedido propria esse flag só vira true no cutover (pick → separado), então a
      janela aguardando_separacao..pré-pick ficava desprotegida. O Tiny dispara um
      webhook atualizacao_pedido (situacao=aprovado) após emitir a NF / concluir a
      expedição; ele re-roda o pipeline inteiro e o re-upsert grava
      status_separacao='aguardando_nf' (linha 641), regredindo a transição que o
      webhook da NF já tinha feito (aguardando_separacao). Também enfileira um
      lancar_estoque duplicado. A NF (nota_fiscal_id/chave/danfe) é preservada
      (não está no payload do upsert) — só o status regride. A rede de segurança
      recuperarNfsPresas (tiny-polling) destrava, mas só após 30min de grace.
    fix: >
      Ampliada a guarda de idempotência (4b) em processWebhookWms: além de
      estoque_lancado=true, pula o reprocesso quando já existe job lancar_estoque
      pro pedido — sinal de pedido COMPROMETIDO (último passo do intake
      auto-aprovado propria/oc e da aprovação humana de transferência via
      wms_aprovar_e_enfileirar). Pedidos pendente (sem job, aguardando decisão) e
      os que erraram ANTES do enqueue (retry de webhook falho) não têm job → seguem
      reprocessando. Harness trunca siso_fila_execucao + siso_pedidos → seed:cenarios
      reprocessa limpo. Teste de regressão em webhook-processor-wms.test.ts.
    files:
      - src/lib/webhook-processor-wms.ts
      - src/lib/webhook-processor-wms.test.ts
    tags: [webhook, atualizacao_pedido, aguardando_nf, regressao, idempotencia, propria, lancar_estoque, status_separacao, tiny, polling, recuperarNfsPresas]
    notes: >
      A NF já vem por seu próprio webhook (nf-webhook-handler) e a separação por
      suas rotas — o reprocesso via webhook de pedido comprometido não deve tocar
      o pipeline. Tradeoff aceito: updates Tiny-side (forma_envio etc.) em pedido
      comprometido também são pulados, consistente com a guarda estoque_lancado
      pré-existente.

- id: ITEM-PRODUTO-NAO-MAPEADO-SUMIA-DO-PEDIDO
  date: 2026-06-14
  source: processor.wms
  category: business_logic
  message: >
    Item de pedido com tiny_produto_id sem linha em siso_produto_empresas (ou
    produto_id=0) era pulado silenciosamente no roteamento (apenas logger.warn)
    — o pedido roteava com os itens restantes, ou caía em OC sem_cobertura, sem
    nenhum sinal pro operador. Itens sumiam do fulfillment.
  cause: >
    resolverItensWms (webhook-processor-wms.ts) só montava o Map a partir do
    batch-query em siso_produto_empresas; quem não tinha mapeamento ficava com
    produtoIdWms=null e processWebhookWms filtrava esses itens antes de rotear.
    Nenhum fallback buscava o produto no Tiny; produto_id=0 (anúncio sem produto
    Tiny, ex. "VERIFICAR LADO") batia no mesmo caminho silencioso.
  fix: >
    (1) Feature 1 — auto-provisionamento: para tiny_produto_id>0 sem mapeamento,
    resolverItensWms chama ensureProdutoFromTiny(sku, empresa, tinyId) → GET
    /produtos/{id} no Tiny, cria siso_produtos + bridge + sincroniza dados.
    Falha no Tiny não derruba o webhook (segue sem mapeamento, como antes).
    (2) Feature 2 — produto_id=0 não dá pra resolver: o pedido é parqueado como
    pendente com marcador REQUER_SKU (sem auto-OC, sem reserva, sem job). A aba
    de pedidos mostra "Definir SKU"; POST pedidos/[id]/itens/[itemId]/definir-sku
    vincula o produto e reprocessa nativo via processWebhookWms.
  files:
    - src/lib/webhook-processor-wms.ts
    - src/lib/webhook-processor-wms.test.ts
    - src/app/api/wms/pedidos/[id]/itens/[itemId]/definir-sku/route.ts
    - src/app/api/wms/pedidos/[id]/detalhe/route.ts
    - src/app/wms/pedidos/[id]/page.tsx
  tags: [webhook, processor, produto, siso_produto_empresas, tiny, mapeamento, produto_id_zero, REQUER_SKU, auto-provision, ensureProdutoFromTiny, definir-sku, portabilidade]
  notes: >
    Motivado pela portabilidade dos pedidos pré-embalado do SISO antigo: 2 dos
    86 candidatos tinham produto não-resolvível (1 sku fora do bridge, 1 com
    produto_id=0). Auto-provision cobre o 1º; definir-sku cobre o 2º.

  - id: POLLING-NFS-PRESAS-NUNCA-RODA-TIMEOUT
    date: "2026-06-14"
    source: tiny-polling
    category: infrastructure
    message: >
      pedido com NF completa preso em aguardando_nf nunca destravava
      automaticamente — recuperarNfsPresas (rede de segurança) jamais executava
    cause: >
      No loop por-empresa de pollTiny, a varredura "nfs-presas"
      (recuperarNfsPresas) era a ÚLTIMA de 5. As anteriores — "aprovados"
      (janela 30d) e "notas" (janela 7d, loop por-NF chamando o Tiny) — são
      pesadas e estouravam o maxDuration=300s do lambda. O polling morria no
      passo "notas" e nunca chegava no "nfs-presas". Evidência: ausência do log
      "Polling Tiny concluído" e do log de destrava; último log de cada run era
      "NFs autorizadas sem webhook detectadas" (passo notas). Resultado: pedidos
      com status regredido pra aguardando_nf (ver
      ATUALIZACAO-PEDIDO-REGRIDE-AGUARDANDO-NF) ficavam presos pra sempre apesar
      da NF completa.
    fix: >
      Reordenado o array `varreduras` em pollTiny: nfs-presas roda PRIMEIRO. É
      barato (1 query indexada + ≤20 updates) e crítico; rodando antes dos
      sweeps pesados, sempre executa mesmo que o lambda estoure depois. Não há
      dependência de dados das outras varreduras (é backstop de transição
      perdida/regredida). 29 testes de tiny-polling seguem passando.
    files:
      - src/lib/tiny-polling.ts
    tags: [polling, tiny, nfs-presas, recuperarNfsPresas, aguardando_nf, timeout, maxDuration, cron, safety-net, presos]
    notes: >
      Mitiga, não elimina, o timeout do polling: aprovados/notas ainda podem não
      completar numa run. Fix maior (paginar/limitar janelas ou separar crons)
      fica pra depois. nfs-presas garantido é o que destrava os presos.

  - id: TROCA-COMPRAS-NAO-LIBERA-PEDIDO-OC
    date: 2026-06-14
    source: api.wms.trocas.aprovar
    category: business_logic
    message: >
      Troca de equivalência aprovada pela aba Compras não trocava/liberava o
      pedido — pedido ficava preso em OC (status_separacao=aguardando_compra)
      com o substituto reservado. Cobaia: pedido 1046251315 (GE5307 →
      EW004.309), troca origem='compras'.
    cause: >
      A rota POST /api/wms/trocas/[id]/aprovar só transicionava o PEDIDO quando
      `troca.origem_solicitacao === 'roteamento'` (chamava aprovarPedidoPosTroca).
      Pra origens 'compras'/'separacao'/'painel', a RPC wms_aprovar_troca_atomico
      rodava certo (R reserva_troca → L liberacao_troca → R reserva_pedido no
      substituto + produto_wms_substituto_id no item), mas NADA tirava o pedido
      da OC. Reconciliador-oc não pega: só dispara em entrada de estoque (mov E),
      e a troca usa estoque que já existe (sem E). Fio-solto da Fase 3 do plano
      2026-06-12-cross-troca-equivalencia (linha 116: "Aprovada → item sai de
      compras, volta pro fluxo de separação"); só a Fase 4 (roteamento) foi ligada.
    fix: >
      Novo `liberarPedidoPosTrocaOC` em trocas-roteamento.ts (espelha
      reconciliador-oc.transicionarPedidoSeReconciliado): tira o item de compras
      (compra_status=null + limpa campos OC), e se o pedido está em estado OC
      (aguardando_compra/validacao_oc) com TODOS os itens cobertos, transiciona
      OC → propria (aguardando_separacao se NF já emitida — portado —, senão
      aguardando_nf) + enfileira lancar_estoque (idempotente) + kickWorker.
      Self-gate em estado OC: no-op se o pedido já está em separação. A rota
      aprovar chama esse helper pras origens não-roteamento. Pedido 1046251315
      destravado rodando o próprio helper (end-to-end). lancar_estoque é seguro
      pro portado: gerarNotaFiscalPedido retorna a NF existente sem reemitir.
    files:
      - src/lib/wms/trocas-roteamento.ts
      - src/app/api/wms/trocas/[id]/aprovar/route.ts
      - src/lib/wms/trocas-roteamento.test.ts
    tags: [troca, equivalencia, compras, OC, aguardando_compra, reserva_pedido, liberarPedidoPosTrocaOC, reconciliador-oc, origem_solicitacao]
    notes: >
      Marcador "OC" stale fica no pedido após OC → propria (igual reconciliador-oc,
      que também não limpa marcadores) — cosmético no Tiny, fora de escopo.

