  - id: guarda-a-guardar-derivado-min-saldo-livre
    date: "2026-06-08"
    source: wms.guarda
    category: business_logic
    message: >
      guarda exibia qty_pendente (40) como "a guardar" mesmo quando o pick já consumiu
      o saldo da loc de recebimento (saldo real 10) — operador ia procurar 40 peças
      que não existem mais
    cause: >
      A loc de RECEBIMENTO é pickable — um pedido pode separar diretamente dela antes
      do put-away ser concluído. Nesse caso o operador veria qty_pendente=40 mas
      fisicamente só restam 10 unidades. O campo GENERATED qty_pendente não pode ser
      alterado (invariante I5 + CHECK dependem dele). Sem a_guardar, o operador tenta
      guardar quantidade inexistente e leva erro de saldo insuficiente no RPC.
    fix: >
      Campo a_guardar computado na camada de serviço em listarPendencias e
      listarRotaPendencias via 1 query batch (sem N+1): a_guardar = calcularAGuardar(
      qty_pendente, saldo_loc_origem, reservado_alheio). Reservas da própria guarda
      (origem_tipo='reserva_guarda') são excluídas do reservado_alheio —
      forward-compatible com Fase 6.
    files:
      - src/lib/wms/guarda.ts
      - src/lib/wms/guarda-a-guardar.test.ts
    tags: [guarda, recebimento, a_guardar, putaway]
    notes: >
      qty_pendente (GENERATED) e o schema do banco ficam INALTERADOS. Nenhuma migration
      necessária. Validado por cenário 91-guarda-dinamica-reflete-pick.

  - id: solicitar-contagem-saldo-subcontado
    date: "2026-06-08"
    source: validar-oc-item
    category: business_logic
    message: "solicitar_contagem=true: pega qty do pedido + enfileira loc pra contagem futura — saldo da loc fica temporariamente subcontado de propósito"
    cause: >
      Quando o operador usa "Solicitar contagem depois" no modal OcEncontrei, o sistema
      gera par E+S de qty=pedido (sem reconciliar a loc toda). A loc não é contada inline
      — apenas enfileirada em siso_inventario_localizacoes (status=pendente, motivo=solicitada_pick)
      na sessão operacional contínua do galpão. O saldo real da loc é desconhecido até a
      contagem futura ser realizada.
    fix: >
      Comportamento intencional (tradeoff): o pedido não fica bloqueado pela contagem.
      O operador deve realizar a contagem da loc futuramente via inventário. A loc
      estará na fila da sessão operacional contínua para ser contada.
    files:
      - src/lib/wms/contagem-inline.ts
      - src/app/api/wms/separacao/validar-oc-item/route.ts
      - src/app/wms/separacao/checklist/page.tsx
    tags: [oc, separacao, contagem, inventario]

