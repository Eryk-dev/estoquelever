- id: FILA-WORKER-FLOOD-VARREDURA
  date: 2026-06-12
  source: staging
  category: infrastructure
  message: "Pedidos auto-aprovados (OC) somem da separação: status=executando mas status_separacao=NULL; jobs lancar_estoque parados em 'pendente' com 0 tentativas por horas (pedidos #145528/#145529/#145530 + 5 outros)"
  cause: >
    Duas causas combinadas. (a) Snapshot inicial de inventário do CWB
    gerou 906 movs E (inventario_inicial) em ~30s; cada entrada
    enfileira backstop varredura_pos_entrada (dedup é por produto —
    906 produtos distintos = ~900 jobs). O claim do worker ordenava só
    por prioridade+criado_em (FIFO), então os lancar_estoque dos
    pedidos novos ficaram atrás de ~300 varreduras. (b) Não existia
    cron: kickWorker() só dispara em webhook, e o drain loop roda
    dentro da lambda do webhook, morta aos 5min (maxDuration=300).
    Fila andava em bursts de ~26 jobs/min por 5min, depois congelava
    16-34min até o próximo webhook. Flood de 906 jobs precisava de
    ~35min de CPU e levou 2,5h+ sem terminar.
  fix: >
    (a) Claim em duas fases no processQueue: jobs de pedido
    (lancar_estoque, lancar_estoque_pos_nf) sempre claimados antes dos
    de manutenção — flood de varredura nunca mais atrasa pedido.
    (b) Cron de kick a cada 5min chamando GET
    /api/wms/worker/processar, que kicka o drain loop (maxDuration=300
    na rota); auth por CRON_SECRET/WORKER_SECRET ou user-agent
    vercel-cron. Vercel Cron */5 foi rejeitado pelo plano (deploy
    travou; revertido em d718928) — o agendador real é pg_cron no
    Supabase staging (job 'wms-worker-kick', net.http_get com UA
    vercel-cron/pg_cron). Em prod, recriar o job apontando pro domínio
    de prod. Destrave imediato: UPDATE prioridade=true nos 8 jobs
    presos no staging.
  files:
    - src/lib/execution-worker.ts
    - src/app/api/wms/worker/processar/route.ts
    - vercel.json
  tags: [fila, worker, varredura_pos_entrada, lancar_estoque, cron, snapshot-inicial, separacao, validacao_oc]

- id: CONFERENCIA-SHOPEE-SO-DANFE
  date: 2026-06-14
  source: etiqueta-service
  category: business_logic
  message: >
    Na conferência de embalagem, bipar a etiqueta Shopee só casava pelo
    código da DANFE; o código de barras grande (rastreio BR...) e os QR
    não encontravam pedido nenhum.
  cause: >
    A etiqueta de envio da Shopee vinda do Tiny é UMA imagem raster
    (ZPL = ~DG bitmap + ^XG, zero campo de texto). Nem o rastreio, nem a
    DANFE, nem os QR estão como texto no ZPL — extrairBarcodesDoZpl
    (parser de comandos ^BC/^BQ, feito pro Mercado Livre) retornava [].
    O extra montarBarcodesEtiqueta usava exp.logistica.codigoRastreio,
    mas o Tiny devolve esse campo VAZIO pra Shopee (confirmado também em
    transportador.codigoRastreamento do pedido e da NF — todos ""). Logo
    etiqueta_barcodes ficava null e o único match possível era via
    chave_acesso_nf (a DANFE). O scanner físico lê os barras impressos no
    bitmap e devolve o valor, mas nada no banco batia com o rastreio.
  fix: >
    Novo módulo etiqueta-barcode-raster.ts: quando o ZPL é raster (~DG),
    expande o bitmap 1bpp (parse ~DG + inflate :Z64:) e lê os barcodes/QR
    com zxing-wasm — única fonte dos valores (rastreio BR... + chave
    DANFE; os 3 QR Shopee também codificam o rastreio). Integrado nos 2
    save sites (salvarEtiqueta em agrupamento-service, resolverZplFallback
    em etiqueta-service): doRaster mesclado nos extras de
    montarBarcodesEtiqueta. ML (ZPL de comandos, sem ~DG) não muda —
    extrairBarcodesDoRaster retorna [] na hora. Falha de decode degrada
    seguro ([], só warn). Backfill 1x via scripts/wms/backfill-barcodes-raster.ts.
    next.config: zxing-wasm em serverExternalPackages + .wasm no
    outputFileTracingIncludes (entra no trace do standalone).
  files:
    - src/lib/etiqueta-barcode-raster.ts
    - src/lib/agrupamento-service.ts
    - src/lib/etiqueta-service.ts
    - scripts/wms/backfill-barcodes-raster.ts
    - next.config.ts
  tags: [conferencia, embalagem, shopee, etiqueta, etiqueta_barcodes, raster, zpl, barcode, rastreio, zxing, mercado_livre]

  - id: ATUALIZACAO-PEDIDO-REGRIDE-AGUARDANDO-NF
    date: "2026-06-14"
    source: processor.wms
    category: business_logic
