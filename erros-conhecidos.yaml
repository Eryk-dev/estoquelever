  - id: wms-fix-final-b-t4-cancelar-movs-estornadas-truncate
    date: "2026-05-27"
    source: src/app/api/wms/separacao/cancelar/route.ts
    category: business_logic
    message: "JSONB movs_estornadas crescia sem limite ao cancelar pedidos com muitas movimentações"
    cause: >
      O campo movs_estornadas em siso_pedido_historico.detalhes era populado com
      todos os IDs de movimentações estornadas ao cancelar um pedido via
      POST /api/wms/separacao/cancelar. Pedidos com muitas movs (ex: múltiplos
      parciais + realocações + picking) podiam gerar arrays grandes sem nenhum
      truncamento, inflando o JSONB do registro histórico sem controle.
    fix: >
      Truncar array a 50 entradas (últimas por ordem de inserção no Set).
      Dois campos auxiliares adicionados ao JSONB:
        - movs_estornadas_total: number — contagem real sem truncamento.
        - movs_estornadas_truncado: boolean — true se total > 50.
      A lista completa continua disponível via query direta:
        SELECT id FROM siso_movimentacoes
        WHERE origem_id = :pedido_id AND tipo = 'E' AND estorno_de IS NOT NULL;
      Commit 903ce96.
    files:
      - src/app/api/wms/separacao/cancelar/route.ts
    commit: "903ce96"
    tags: [wms, separacao, cancelar, movs-estornadas, jsonb, truncate, fix-final-b, t4, b3]

  - id: wms-fix-final-b-t5-computar-divergencias-guard
    date: "2026-05-27"
    source: src/lib/wms/inventario.ts
    category: business_logic
    message: "computarDivergencias re-executava cleanup de locks em sessão já em revisao/aprovada/aplicada"
    cause: >
      A função computarDivergencias (src/lib/wms/inventario.ts) não tinha guard
      de re-execução. Quando chamada em sessão já no status revisao, aprovada ou
      aplicada, rodava novamente a limpeza de locks de localização, logando
      avisos falsos e potencialmente interferindo com operações concorrentes
      sobre a mesma sessão.
    fix: >
      Early-return guard adicionado ao início da função (linhas 653-673).
      Guard verifica session.status contra ['revisao', 'aprovada', 'aplicada'];
      se verdadeiro, loga logger.info com mensagem "computarDivergencias no-op
      — sessão já em <status>" e retorna void imediatamente sem tocar locks
      ou divergências. Commit 8a5c9bd.
    files:
      - src/lib/wms/inventario.ts
    commit: "8a5c9bd"
    tags: [wms, inventario, computar-divergencias, guard, idempotente, re-execucao, fix-final-b, t5, b4]

