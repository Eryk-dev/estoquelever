  - id: wms-fase1-overselling-marcar-item-nao-atomico
    date: "2026-05-28"
    source: src/app/api/wms/separacao/marcar-item/route.ts
    category: business_logic
    message: "Item marcado como pego sem baixa de estoque (overselling) — L+S não-atômico + engole-erro"
    cause: >
      marcar-item fazia liberarReservaPicking (L) e inserirMovimentacao (S) em
      sequência, NÃO-atômico. A loc de pick vinha do snapshot estale ou de
      buscarLocComMaiorSaldoNoGalpao (filtra disponivel>0), que retornava null
      quando a própria R já reservava o saldo → caía em DEFAULT-PICKING (saldo 0)
      → a S estourava "saldo insuficiente". O erro era ENGOLIDO (logger.warn
      "Mov WMS skipped") e o item marcado assim mesmo (separacao_marcado=true,
      mov_saida_id=NULL). Produto sai físico, sistema conta como disponível.
      Evidência: pedido 937979990; cenário 29 (reservado órfão=1).
    fix: >
      RPC plpgsql wms_pick_item_atomico (L+S numa transação; rollback total se a S
      falha). Loc de pick vem da R VIVA do pedido (buscarReservaPendentePorProduto),
      não de snapshot/heurística. Se a baixa falha, retorna 409 e NÃO marca o item
      (removido o engole-erro). pick-mov.ts (bipar-checklist) migrado pro mesmo R-loc.
    files:
      - supabase/migrations/20260528_wms_pick_item_atomico.sql
      - src/lib/wms/reservas-picking.ts
      - src/app/api/wms/separacao/marcar-item/route.ts
      - src/lib/wms/separacao/pick-mov.ts
    tags: [separacao, overselling, atomico, ledger, fase1, p0]

