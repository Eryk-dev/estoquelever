      importa @testing-library/react ausente).

  - id: wms-lista-sugestao-oc-stale-snapshot
    date: "2026-06-02"
    source: src/app/api/wms/pedidos/route.ts
    category: business_logic
    message: "Listagem de pedidos servia a sugestão OC congelada do webhook mesmo com estoque vivo cobrindo → operador via 'Comprar' e podia tentar OC indevida (pedido #50117 / ACD003)"
    cause: >
      GET /api/wms/pedidos (buildResponse) retornava siso_pedidos.sugestao — o
      snapshot calculado no webhook. O #50117 (EasyPeasy/CWB, id 938046201, SKU
      ACD003 qty 1) caiu OC porque no momento do webhook o ledger WMS não tinha
      saldo; depois CWB passou a ter 69 disponíveis, mas a listagem continuava
      sugerindo OC. O card (pedido-card-wms) inicializa a decisão default a partir
      desse `sugestao`, então o operador via/defaultava OC. O detalhe
      (/pedidos/[id]/detalhe) JÁ recomputava ao vivo via recomputarSugestaoBatch —
      a listagem ficou pra trás (divergência lista↔detalhe). A premissa anti-flicker
      [#P6-1.15 / Fix-D #1.3] mantinha a lista presa no snapshot.
    fix: >
      buildResponse passou a recomputar a sugestão pra pedidos em decisão
      (status pendente/erro com empresa_origem_id) via recomputarSugestaoBatch
      (1 chamada batch, 5 queries fixas independente de N) e a servir o valor VIVO
      na resposta, com o snapshot persistido só como fallback. Espelha o detalhe.
      Frontend inalterado (o valor vivo flui pelo prop `sugestao`; decisaoIsAvailable
      e o OC-block do backend já liam estoque vivo). siso_pedidos.sugestao segue
      congelado no DB (auditoria). Reverte conscientemente a premissa anti-flicker:
      a sugestão da lista agora reflete o estoque vivo (era o pedido explícito do user).
      O recompute é envolto em .catch → degrada pro snapshot persistido se falhar
      (timeout/DB), nunca derruba a listagem com 500.
    files:
      - src/app/api/wms/pedidos/route.ts
      - src/components/wms/vendas/pedido-card-wms.tsx
      - scripts/wms/cenarios/catalogo/72-lista-sugestao-recalcula-vivo.ts
    tags: [wms, pedidos, sugestao, oc, estoque-vivo, snapshot-estale, listagem, recomputarSugestaoBatch, p6, regressao]
    notes: >
      Verificado: (a) tsc --noEmit limpo nos arquivos alterados (único erro é
      pré-existente: teste que importa @testing-library/react ausente); (b) eslint
      limpo; (c) prova de dados NÃO-destrutiva em staging — replicando a regra de
      recomputarSugestaoBatch sobre o #50117 real dá `propria` (CWB é home da
      EasyPeasy e tem 69 ≥ 1, loc picking, sem lock ativo). Cenário 72 (regressão,
      OC→Própria na listagem) escrito e auto-descoberto pelo run-all, mas NÃO rodado
      aqui: o harness trunca tabelas operacionais de staging — deixado pra suite
      controlada. Revisão adversarial (4 lentes + verify) validou correção/segurança/
      ausência de regressão; única ação aplicada foi o .catch de degradação graciosa.
      Limitações PRÉ-EXISTENTES anotadas (fora de escopo, não introduzidas aqui):
      (1) recomputarSugestaoBatch não faz chunking do .in(produto_id) — ok pro
      working set real de pendentes/erro (pequeno), revisitar se a fila empilhar;
      (2) o OC-block de aprovar soma global entre galpões enquanto rotearPedido exige
      cobertura por-galpão — diverge só em pedido multi-item espalhado (split_galpoes),
      não no caso reportado (item único coberto no galpão casa).

  - id: oc-item-preso-em-esgotado-mesmo-com-estoque
    date: "2026-06-02"
    source: wms.separacao / wms.compras
    category: business_logic
    message: "Item aprovado como OC fica preso em Esgotado/aguardando_compra mesmo depois que o estoque chega — nunca volta ao picking"
    cause: >
      A decisão de roteamento OC era congelada (tomada uma vez no webhook, nunca
      reavaliada quando o estoque chega). A única reação a uma entrada de estoque era
      um banner cosmético `flag_saldo_apareceu` (e só em `validacao_oc`). O checklist
      de separação bucketiza por `compra_status`, ignorando saldo vivo — pedidos em
      `aguardando_compra` ficavam na aba "Esgotado" independente de haver saldo.
      Além disso havia DOIS caminhos de recebimento divergentes: `/api/wms/receber/oc/[id]`
      (`receberItensViaOC`) incrementava `compra_quantidade_recebida` mas NÃO setava
      `compra_status='recebido'` nem chamava `checkAndReleasePedidos`, deixando o pedido
      preso mesmo após recebimento físico completo (bug relacionado ao já registrado
      `compras-autofix-no-release`). O reconciliador event-driven não existia — a entrada
      de estoque (mov tipo E) não tinha gancho algum que atualizasse os pedidos OC
      bloqueados sobre aquele produto/galpão.
    fix: >
      Mecanismo 1 — `reconciliador-oc.ts`: reconciliador event-driven disparado
      fire-and-forget pelo gancho de mov tipo E em `ledger.ts` (toda entrada de estoque).
      Para o par (produto_id, galpao_id) recém-entrado, busca pedidos com
      `compra_status IN (oc_pendente, aguardando_compra)` e `status_separacao IN
      (validacao_oc, aguardando_compra)`, ordena FIFO por `criado_em` e, para cada
      pedido que o saldo livre (`disponivel` no ledger, respeitando reservas existentes)
      cobrir, cria reserva atômica via `wms_reservar_atomico`, desvincula a OC
      (`cancelOcIfEmpty`), e transiciona o pedido de volta para própria
      (`decisao_final='propria'`, `status_separacao='aguardando_nf'`, enfileira
      `lancar_estoque`) — espelhando exatamente a degradação OC→própria já feita pelo
      worker. Para na primeira vez que o saldo livre não cobrir (FIFO estrito).
      Mecanismo 2 — `receberItensViaOC` (`receber-oc.ts`): passa a setar
      `compra_status='recebido'` quando `compra_quantidade_recebida >= compra_quantidade_solicitada`
      (com lock otimista via `.select()` + checagem de linhas afetadas), e a chamar
      `checkAndReleasePedidos` logo após — unificando o comportamento com o endpoint
      `/api/wms/compras/receber`.
    files:
      - src/lib/wms/reconciliador-oc.ts
      - src/lib/wms/ledger.ts
      - src/lib/wms/receber-oc.ts
      - src/lib/historico-service.ts
    tags: [reconciliador, oc, esgotado, estoque, fifo, recebimento, release, wms]

  - id: parcial-wave-libera-reserva-residual
    date: "2026-06-02"
    source: wms/separacao/parcial
    category: business_logic
    message: "Parcial de wave consolidado destruía a reserva dos pedidos não atendidos (liberava 100% da R de TODOS os pedidos, sem recriar quando loc_zerou=false)."
    cause: >
      Loop 7a em parcial/route.ts liberava Number(r.quantidade) pra cada pedido_id do
      wave incondicionalmente; cascade que recria R só roda em loc_zerou=true, então o
      residual de loc_zerou=false ficava sem reserva (e o checklist voltava a pedir a
      qty cheia).
    fix: >
      Computar alocação FCFS por pedido antes da liberação; com loc_zerou=false, só
      liberar a R de pedidos com picked>0 e re-reservar o residual na mesma loc via
      criarReservaCascade. Frontend deriva linha PEGO (Σ quantidade_pega) + linha PEGAR
      (Σ restante).
    files:
      - src/app/api/wms/separacao/parcial/route.ts
      - src/app/wms/separacao/checklist/page.tsx
      - scripts/wms/cenarios/catalogo/70-parcial-wave-reserva.ts
    tags: [separacao, parcial, reserva, wave, checklist]

  - id: wms-fila-job-estagnado-nunca-reclamado
    date: "2026-06-05"
    source: wms.execution-worker
    category: infrastructure
    message: "job preso em status='executando' para sempre após crash do worker"
    cause: >
      processQueue só selecionava jobs 'pendente' e fazia claim atômico
      executando. Se o worker morria entre o claim e o update final, o job
      ficava 'executando' indefinidamente — nenhuma rotina o devolvia.
    fix: >
      Antes do SELECT de pendentes, processQueue reclama jobs 'executando'
      cujo atualizado_em (marca de início escrita no claim) é mais antigo que
      5min, devolvendo-os a 'pendente'. Reprocessar é seguro (idempotência por
      reserva e estoque_lancado).
    files:
      - src/lib/execution-worker.ts
    tags: [fila, worker, reclaim, timeout, idempotencia, P145]

  - id: wms-transferencia-cancel-ignora-lock-recebimento
    date: "2026-06-05"
    source: wms.transferencias.cancelar
    category: business_logic
    message: "caixa órfã / dupla-contagem ao cancelar transferência durante recebimento"
    cause: >
      receberTransferencia tinha claim via recebimento_em_andamento_por mas
      cancelarTransferencia não lia nem respeitava o lock. Cancel e receive
      rodavam concorrentes na mesma tripla (estorno leg S vs insert leg E),
      deixando estoque inconsistente. Faltava timestamp do lock pro timeout.
    fix: >
      Adicionada coluna recebimento_em_andamento_em. cancelarTransferencia
      seleciona o lock, bloqueia (409 TRANSFERENCIA_RECEBIMENTO_EM_ANDAMENTO)
      se outro operador recebe dentro de 30min, e faz claim atômico de
      cancelamento (mutex compartilhado) pro próprio recebedor ou lock stale.
    files:
      - supabase/migrations/20260605_transferencia_recebimento_em_andamento_em.sql
      - src/lib/wms/transferencias.ts
      - src/app/api/wms/transferencias/[id]/cancelar/route.ts
    tags: [transferencia, lock, recebimento, cancelamento, race, P062, P066, P068]

