- id: sisofetch-zombie-session-unauthorized
  date: 2026-05-11
  source: auth-context.sisoFetch
  category: auth
  message: "Tela mostra 'Erro: unauthorized' em todas as APIs apesar do usuario aparecer logado"
  cause: >
    Sessao do servidor (siso_sessoes.expira_em, TTL 12h) expirou enquanto a aba
    permanecia aberta, mas o localStorage continuou guardando siso_user com o
    sessionId morto. useAuth le o localStorage e renderiza o usuario como logado;
    sisoFetch envia X-Session-Id expirado; servidor retorna 401 {error:"unauthorized"};
    AppShell/WmsShell so redirecionam pro /login se user for null, e user nao era
    null. Resultado: UI "zumbi" em que cada query do TanStack renderiza linha de
    erro mas o usuario parece logado.
  fix: >
    sisoFetch agora detecta status 401 em qualquer endpoint diferente de
    /api/auth/login e dispara handleUnauthorized(): limpa siso_user + siso_active_galpao
    do localStorage e faz window.location.replace('/login?reason=session-expired').
    Flag module-level unauthorizedRedirectInFlight evita multiplos redirects quando
    varias queries falham em paralelo. Pagina /login le ?reason=session-expired e
    mostra toast.error('Sua sessao expirou. Faca login novamente.').
  files:
    - src/lib/auth-context.tsx
    - src/app/login/page.tsx
  tags: [auth, sessao, sisoFetch, localStorage, 401, ux, wms]

- id: wms-receber-lote-trocar-loc-fecha-na-digitacao
  date: 2026-05-12
  source: wms.receber.lote.ItemLoteRow
  category: business_logic
  message: "No tab Lote do /wms/receber, ao clicar 'Trocar loc' o combo abre mas fecha sozinho assim que o operador comeca a digitar — impossivel alocar outra localizacao."
  cause: >
    LocalizacaoCombo (modals.tsx) emite onChange("") enquanto o operador edita
    o input pra sinalizar "selecao anterior nao vale mais, ainda digitando".
    No TabLote do receber, o callback do combo rodava setTrocandoLoc(false)
    incondicionalmente — incluindo nesse sinal de edicao —, desmontando o
    combo na primeira tecla. Pior: o id "" salvo em locIdOverride fazia
    locIdAtual = item.locIdOverride ?? putaway?.localizacao_id ?? "" resolver
    pra "" (string vazia nao eh nullish), e o bloco JSX inteiro (incluindo
    o proprio botao "Trocar loc") sumia por causa de "&& locIdAtual" na
    condicional, deixando o operador travado sem acesso ao combo. O caso
    nunca apareceu no transferir/page.tsx porque la o combo fica sempre
    montado dentro do modal (sem toggle de visibilidade).
  fix: >
    No onChange do LocalizacaoCombo dentro de ItemLoteRow, ignorar sinais
    com id vazio (early return `if (!id) return;`). So fecha o combo
    (setTrocandoLoc(false)) e sobrescreve locIdOverride quando vem um id
    real de selecao confirmada.
  files:
    - src/app/wms/receber/page.tsx
  tags: [wms, receber, lote, localizacao, combo, autocomplete, putaway, ux]

- id: wms-receber-lote-codigo-loc-errado-apos-combo
  date: 2026-05-12
  source: wms.receber.lote.ItemLoteRow
  category: business_logic
  message: "Apos escolher uma loc pelo combo 'Trocar loc', a linha do item exibe o codigo da loc sugerida original em vez da loc selecionada (mas o Plano de guarda mostra a correta)."
  cause: >
    O callback do LocalizacaoCombo so salvava o id em locIdOverride e zerava
    locCodigoOverride. A linha do item resolvia o codigo via
    `item.locCodigoOverride ?? putaway?.codigo ?? ""`, caindo no codigo da
    sugestao do putaway. O Plano de guarda nao tinha o problema porque ja
    olhava o mapa locsById (catalogo de locs do galpao). Os chips de "Onde
    ja tem saldo" nao tinham o problema porque setavam codigo + id juntos.
    So o caminho do combo ficava inconsistente.
  fix: >
    Passa locsById como prop pro ItemLoteRow e resolve o codigo na ordem:
    override explicito (chips) > lookup em locsById pelo id atual (cobre
    selecoes via combo) > sugestao do putaway > vazio. Estado interno do
    item segue como antes (locCodigoOverride permanece null pra selecoes
    via combo); a resolucao acontece so no momento da renderizacao.
  files:
    - src/app/wms/receber/page.tsx
  tags: [wms, receber, lote, localizacao, combo, display, ux]

  - id: wms-guarda-rota-hook-apos-early-return
    date: "2026-05-13"
    source: wms.guarda.rota
    category: infrastructure
    message: "Application error: a client-side exception has occurred while loading"
    cause: >
      Em /wms/guarda/rota/page.tsx, useMemo do cálculo de minutosRota foi
      adicionado depois dos early returns (`if (isLoading) return ...` e
      `if (isError) return ...`). Isso viola as regras dos hooks: a ordem
      de chamada de hooks muda entre renders (quando a query sai de
      isLoading=true pro estado carregado, o useMemo passa a ser invocado).
      React detecta a violação e desmonta o componente com client-side error.
    fix: >
      Movi todos os derivados (tituloRota, tudoConcluido, guardadasFinais,
      unidadesGuardadas, minutosRota) pra antes dos early returns. minutosRota
      virou IIFE simples — cálculo barato, não precisa de useMemo.
    files:
      - src/app/wms/guarda/rota/page.tsx
    commit: 11fad16
    tags: [wms, guarda, rota, hooks, react, early-return, client-error]
  - id: separacao-parcial-reservado-excede-saldo
    date: "2026-05-18"
    source: separacao-parcial
    category: business_logic
    message: "Error: reservado (5) excederia saldo (3)"
    cause: >
      O /api/separacao/parcial chama wms_inserir_movimentacao com tipo=S
      origem_tipo=nf_venda direto, sem checar se a posicao tem reserva
      ativa de outro pedido. A RPC valida `reservado <= saldo_posterior`
      e rejeita. Em staging o problema apareceu por causa de uma reserva
      orfa do shadow-logging do Plano 3 (mov ff1df10f, pedido 91000092,
      qty=5) trazida via staging-refresh — saldo=5 totalmente reservado.
      Em prod o mesmo bug aparece em qualquer pedido que tente picking
      parcial numa loc com reserva ativa.
    fix: >
      Validacao explicita no endpoint antes de inserirMovimentacao: se
      `disponivel < quantidade_pega` retorna 409 com mensagem informativa
      (saldo, reservado, disponivel). Em staging tb estornei a reserva
      orfa via mov L referenciando ff1df10f. Migration prereq idempotente
      (CREATE OR REPLACE) garante que siso_consolidar_produtos_separacao
      exista em staging — gap separado de staging-refresh que copia dados
      mas nao funcoes.
    files:
      - src/app/api/separacao/parcial/route.ts
      - supabase/migrations/20260518_pick_multi_loc_prereq_consolidar.sql
    tags: [separacao, parcial, wms, reserva, ledger, staging, picking, plano-3]

- id: ERR-2026-05-18-001
  date: 2026-05-18
  source: wms.inventario.computar_divergencias
  category: business_logic
  message: "Inventário com operação concorrente gera divergências fake (saldo_esperado lê siso_estoque atual, não saldo no bipe)"
  cause: |
    computarDivergencias comparava qty_contada com siso_estoque.saldo atual no
    momento da aprovação. Se uma mov (picking/recebimento/etc) ocorresse entre
    o bipe e a aprovação, o saldo já havia mudado e a comparação ficava errada.
    O algoritmo temporal previsto na spec (saldo_esperado = saldo no momento do
    bipe, reconstruído via siso_movimentacoes.saldo_anterior da primeira mov
    após T_count) nunca foi implementado.
  fix: |
    - Nova função pura reconciliarTemporal em src/lib/wms/inventario-reconciliacao.ts
    - Refactor de computarDivergencias pra fazer snapshot cutoff_em=now() e delegar
    - Loc visitada-e-vazia (sem bipes) só gera divergência se saldo já existia antes
      de contagem_finalizada_em
    - Loc não visitada (contagem_finalizada_em IS NULL) é completamente ignorada
    - Movs estornadas (par original+estorno) são desconsideradas
    - Movs origem='inventario' da própria sessão são desconsideradas (idempotência)
  files:
    - src/lib/wms/inventario-reconciliacao.ts
    - src/lib/wms/inventario-reconciliacao.test.ts
    - src/lib/wms/inventario.ts
  tags: [inventario, reconciliacao-temporal, estoque-online, picking-concorrente, divergencia-fake]
  observacao: |
    Estoque fantasma criado pela sessão 6282e654 (1× SKU 001233 em A-01-3,
    mov 62bb5c59-323e-4308-b605-a2cb426bc791) NÃO foi estornado neste fix.
    Decisão do usuário em 2026-05-18 — tratar caso a caso via /wms/ajuste.

