  - id: parcial-pegar-checkbox-nao-conclui-sem-settle
    date: "2026-06-08"
    source: wms/separacao-checklist
    category: business_logic
    message: "No checklist de wave picking, completar a linha PEGAR de um parcial-em-progresso não refletia na UI — o checkbox parecia travado/não-clicável e o operador não conseguia concluir a separação, embora o backend desse a baixa correta."
    cause: >
      handleToggle (src/app/wms/separacao/checklist/page.tsx) só fazia
      queryClient.invalidateQueries no catch (erro), nunca no sucesso. O optimistic
      update apenas flipava separacao_marcado — invisível na linha PEGAR (done fixo
      em false) e sem colapsar o split PEGO/PEGAR, que deriva de
      quantidade_pega/quantidade_restante. useRealtimeSeparacao não escuta
      siso_pedido_itens e a query tem refetchOnWindowFocus=false / staleTime 30s /
      sem refetchInterval, então a baixa real (quantidade_pega->pedida,
      separacao_marcado->true) nunca era re-buscada. Pior: o 1o clique deixava
      all_marcado=true no cache, então um 2o clique na linha ainda-aparentemente-
      desmarcada mandava marcado:false -> wms_desmarcar_item_atomico revertia a baixa.
    fix: >
      (1) Settle sempre no handleToggle (finally com invalidateQueries no sucesso E
      no erro), espelhando handleParcialConfirm/handleMarcarRealocacao. (2) Optimistic
      robusto: além de separacao_marcado, seta quantidade_pega (= pedida ao marcar,
      null ao desmarcar) pra colapsar/expandir o split PEGO/PEGAR NA HORA, e preserva
      `...old` (não dropa `pedidos`, que alimenta o banner saldo-apareceu) — fecha a
      janela do "2o clique reverte". (3) useRealtimeSeparacao passou a assinar
      siso_pedido_itens (escopado ao checklist, escopa direto no payload.pedido_id,
      reusa o debounce de 500ms) pra reagir a mudanças de item de outros operadores /
      fluxos async. (4) Cosmético: linha concluída exibe a quantidade cheia, nunca "0"
      (qtyExibida: restante>0 ? restante : total). Coberto por toggle-settle.test.tsx
      (4 casos; todos falham sem os fixes).
    files:
      - src/app/wms/separacao/checklist/page.tsx
      - src/hooks/use-realtime-separacao.ts
      - src/app/wms/separacao/checklist/__tests__/toggle-settle.test.tsx
    tags: [separacao, parcial, checklist, react-query, optimistic, settle, realtime, ui]

- id: webhook-auto-oc-reentrega-23505
  date: 2026-06-08
  source: webhook-processor-wms
  category: business_logic
  message: "Re-entrega de webhook OC causaria 23505 (duplicate key) no índice uq_fila_release_pedido"
  cause: >
    OC não seta estoque_lancado=true (ao contrário de própria), então o early-return
    de duplicado em processWebhookWms (verifica estoque_lancado) não cobria re-entregas
    de pedidos OC. Sem guarda de dedup, o segundo webhook tentava inserir um segundo
    job lancar_estoque com decisao:oc para o mesmo pedido, violando o índice único.
  fix: >
    Adicionada guarda de dedup pré-insert na fila: antes de inserir o job, verifica se
    já existe um job lancar_estoque com status pendente/executando para o mesmo pedido.
    Se existir, o insert é pulado (idempotência). Espelha o padrão já usado no worker
    (execução-worker.ts linha 683-689).
  files:
    - src/lib/webhook-processor-wms.ts
  tags: [webhook, oc, idempotencia, fila, dedup]

- id: wms-misto-oc-nao-auto-transitava-para-compras
  date: "2026-06-08"
  source: separacao.validar-oc-item
  category: business_logic
  message: "Pedido misto OC (parte normal + parte compra) ficava em em_separacao mesmo após todos os normais pegos e OC esgotados"
  cause: >
    Em /api/wms/separacao/validar-oc-item, após marcar items 'esgotado', a lógica
    de auto-transição só cobria dois casos: (FR-9) todos os itens encontrados →
    decisao propria; (FR-8) 100% OC → aguardando_compra. O caso misto (parte
    compra, parte normal) não tinha branch — o comentário dizia "concluir/route.ts
    handles this". Porém o operador precisava clicar /concluir manualmente depois
    de já ter pego todos os itens normais, o que tornava o fluxo redundante e
    propenso a pedidos esquecidos na fila.
  fix: >
    Adicionada branch else-if após FR-8 que verifica se TODOS os itens normais
    (compra_status=null) têm separacao_marcado=true. Se sim, transiciona o pedido
    pra aguardando_compra imediatamente via validar-oc-item, sem necessitar /concluir.
    O select do loop de auto-transição passou a incluir separacao_marcado. A condição
    usa .every() com guard contra [].every() = true (unreachable pois FR-8 já cobre
    o caso normalItems.length===0). O UPDATE usa .in("status_separacao", ["validacao_oc",
    "em_separacao"]) para ser idempotente. O fallback em /concluir/route.ts permanece
    intacto para a ordem inversa (esgotado antes de bipar os normais).
  files:
    - src/app/api/wms/separacao/validar-oc-item/route.ts
    - scripts/wms/cenarios/catalogo/89-misto-oc-auto-compras.ts
    - scripts/wms/cenarios/catalogo/89b-misto-oc-ordem-inversa.ts
  tags: [oc, separacao, misto, compras, auto-transicao, validar-oc-item, aguardando_compra]

