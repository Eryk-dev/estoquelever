- id: SEPARACAO-ENCONTREI-SEM-PARCIAL-CONCLUIR-JOGA-OC-PRA-COMPRAS
  date: 2026-06-10
  source: separacao
  category: business_logic
  message: "'Encontrei' bloqueava contagem parcial (422 contagem_menor_que_pedido) e concluir jogava itens oc_pendente pra compras sem decisão"
  cause: >
    validar-oc-item exigia qty_contada >= quantidade_pedida por item — operador
    que achava 1 de 3 não tinha como liberar nada (e a reconciliação inline
    rodava POR item, re-inflando o saldo da loc a cada pick quando o grupo
    consolidado tinha mais de um item). No concluir, pedido com itens
    oc_pendente (sem ninguém clicar Encontrei/Esgotado) caía no bucket
    aguardando_compra por arrasto — 30 itens em validacao_oc iam todos pra
    compras se o operador separasse 1 ou 2 e concluísse.
  fix: >
    (1) Contagem parcial permitida: alocarContagem (lib/wms/separacao/
    alocacao-contagem.ts) distribui a contagem maximizando pedidos liberados
    inteiros (menor qty primeiro); sobra vira pick parcial
    (parcial_motivo='encontrei_parcial') e o restante descoberto vai
    automaticamente pra compras (enviarItemParaCompras, mesma semântica do
    esgotado, qty efetiva deduz pega+realocs). Reconciliação da loc roda UMA
    vez por chamada, antes dos picks. Resposta ganhou bloco `cobertura`.
    (2) concluir: pedido com oc_pendente volta pra validacao_oc (bucket
    `validacaoOc` na resposta), reset de operador, pick dos normais
    preservado — só esgotado explícito ou restante de parcial vai pra compras.
  files:
    - src/app/api/wms/separacao/validar-oc-item/route.ts
    - src/app/api/wms/separacao/concluir/route.ts
    - src/lib/wms/separacao/alocacao-contagem.ts
    - src/app/wms/separacao/checklist/page.tsx
  tags: [separacao, validacao-oc, encontrei, parcial, contagem, concluir, compras]

- id: COMPRAS-COMPRAR-SPLIT-OC-POR-GALPAO-DO-PEDIDO
  date: 2026-06-10
  source: compras
  category: business_logic
  message: "Compra de 5 un do mesmo fornecedor dividia em 2 OCs (3 CWB + 2 SP) sem o comprador escolher"
  cause: >
    POST /compras/comprar resolvia o galpão da OC pelo separacao_galpao_id de
    cada pedido vinculado (find-or-create por fornecedor+galpão). Pedidos do
    mesmo SKU roteados pra galpões diferentes fragmentavam a compra em N OCs,
    cada uma recebendo num galpão que o comprador não escolheu. Preço também
    não existia na compra — custo só era digitado no recebimento, sem
    referência do que foi negociado.
  fix: >
    Modal de confirmação em /wms/compras (aba Comprar): comprador define
    galpão destino (default = galpão sugerido do fornecedor) e preço unitário
    (obrigatório na UI) por item. Backend aceita galpao_id + preco_unitario
    por item: galpao_id manda no find-or-create da OC (consolida fornecedor+
    galpão numa OC só) e re-aponta siso_pedidos.separacao_galpao_id quando
    difere — sem isso o reconciliador-oc (match por separacao_galpao_id)
    nunca destravaria o pedido quando a entrada chega no galpão escolhido.
    preco_unitario vai pra coluna nova siso_pedido_itens.compra_preco_unitario
    (migration 20260610d) e pré-preenche o custo no recebimento da OC
    (GET /receber/oc/[id] → preco_compra). Payload antigo (sem os campos)
    segue funcionando — cenários E2E usam o fallback legado.
  files:
    - src/app/api/wms/compras/comprar/route.ts
    - src/app/wms/compras/page.tsx
    - src/app/api/wms/receber/oc/[id]/route.ts
    - src/app/wms/receber/oc/[id]/page.tsx
    - supabase/migrations/20260610d_compra_preco_unitario.sql
  tags: [compras, oc, galpao, preco, split, reconciliador-oc, recebimento]

- id: ETIQUETA-CHAVE-ACESSO-NF-WEBHOOK-PERDIDO
  date: 2026-06-10
  source: etiquetas
  category: external_api
  message: "Etiqueta nunca sai e retry-etiqueta sempre falha: pedido com nota_fiscal_id mas chave_acesso_nf NULL"
  cause: >
    chave_acesso_nf só era persistida via webhook nota_fiscal ou na geração da
    NF. Quando o webhook do Tiny se perde, o gate de NF completa
    (nota_fiscal_id + chave_acesso_nf) em criarAgrupamentoFase1 e
    preCriarAgrupamentosEmLote bloqueia o agrupamento para sempre — retry
    devolve falhas=1 eternamente. Fix já existia em prod (main, commits
    cc6519a + 365024f) mas nunca foi portado pro develop.
  fix: >
    Port do self-heal da main: recuperarChavesAcessoFaltantes() em
    agrupamento-service.ts refetcha a NF do Tiny (obterNotaFiscal) antes do
    gate, e se situacao 6/7 (Autorizada/Emitida Danfe) com chaveAcesso,
    persiste a chave (update guardado com IS NULL, idempotente com webhook).
    Roda em preCriarAgrupamentosEmLote (cobre retry-etiqueta) e em
    criarAgrupamentoFase1 (cobre fase 1). Basta rodar retry-etiqueta.
  files:
    - src/lib/agrupamento-service.ts
  tags: [etiquetas, tiny, nf, webhook, retry, agrupamento, self-heal]

