  - id: wms-marcar-item-desmarcar-nao-volta-reserva
    date: "2026-05-26"
    source: separacao-marcar-item
    category: business_logic
    message: 'Estorno WMS falhou: mov X já é um estorno (estorno_de=Y)'
    cause: >
      No desmarcar do checkbox, o loop iterava os mov_links (saida + liberacao_reserva)
      e chamava estornarMovimentacao em cada um. A L de liberação carrega
      estorno_de=R.id por convenção arquitetural (cutover do execution-worker
      filtra reservas "já convertidas" via EXISTS L WHERE estorno_de=R.id).
      Mas a guarda em ledger.estornarMovimentacao ("if original.estorno_de
      → throw já é um estorno") confunde isso com estorno contábil e rejeita
      o estorno da L. Resultado:
       - S é estornada (E counter) — saldo volta ✓
       - L NÃO é estornada — reservado fica em 0, R original viva mas
         marcada como "já liberada" via L que continua de pé
       - Re-marcação: buscarReservaPendente considera R "já liberada"
         (L está lá) e cria S sem L par — pareamento R↔L corrompido.
      Mesmo se a guarda fosse relaxada, o estornarMovimentacao genérico
      criaria a R nova com origem_tipo='estorno' — invisível pro
      buscarReservaPendente que filtra por origem_tipo='reserva_pedido'.
    fix: >
      Adicionado helper estornarLiberacaoReserva em src/lib/wms/reservas-picking.ts
      que bypassa o estornarMovimentacao genérico e chama inserirMovimentacao
      direto, criando uma R com origem_tipo='reserva_pedido', origem_id=pedido_id,
      estorno_de=L.id. Idempotente (se já estornada, retorna a R existente).
      marcar-item/route.ts desmarcar condiciona por tipo_link:
       - 'saida' → estornarMovimentacao (cria E)
       - 'liberacao_reserva' → estornarLiberacaoReserva (cria R nova)
      Re-marcação depois passa a achar a R ressuscitada via buscarReservaPendente.
      Pareamento R↔L↔S preservado em ciclos marca/desmarca arbitrários.
    files:
      - src/lib/wms/reservas-picking.ts
      - src/app/api/wms/separacao/marcar-item/route.ts
    tags: [wms, separacao, marcar-item, desmarcar, reserva, liberacao_reserva, estorno, ledger]
    notes: >
      Bug correlato fora de escopo: src/lib/separacao/reset-state.ts (usado
      por cancelar, desfazer-parcial, voltar-etapa, reiniciar) só estorna
      links tipo_link='saida' — ignora 'liberacao_reserva'. Mesma classe
      de bug em outros caminhos. Fix separado pendente.

  - id: wms-aprovar-idempotencia-r-liberada-pula-criacao
    date: "2026-05-26"
    source: aprovar.reservas
    category: business_logic
    message: 'Reservas já existentes — skip (porém todas R estavam liberadas)'
    cause: >
      Em src/app/api/wms/pedidos/aprovar/route.ts, a idempotência checava
      "qualquer R com origem_id=pedidoId" pra skipar criação. Ledger é
      imutável — uma R liberada (com L estorno_de=R.id) continua viva como
      linha. Resultado: após reset (ou qualquer fluxo que libere R por L
      e re-deixe o pedido em 'pendente'), a re-aprovação encontrava a R
      antiga e skipava criar nova. Pedido seguia pra separação SEM R.
      Marcar checkbox criava S (sem L par, sem R par) — saldo deduz, mas
      pareamento R↔L↔S inexistente. Apareceu logo após o reset dos 46
      pedidos ACD003: usuário re-aprovou 6 e nenhum gerou reserva.
    fix: >
      Idempotência agora filtra Rs ainda pendentes (sem L estorno apontando).
      Se TODAS Rs antigas estão liberadas, segue normalmente criando Rs novas.
      Padrão equivalente ao usado por buscarReservaPendente.
    files:
      - src/app/api/wms/pedidos/aprovar/route.ts
    tags: [wms, aprovar, idempotencia, reserva, ledger-imutavel, reset]

  - id: wms-estornar-liberacao-reserva-exige-expira-em
    date: "2026-05-26"
    source: separacao-marcar-item
    category: validation
    message: 'reserva (tipo R) exige expira_em (P0001 do wms_inserir_movimentacao)'
    cause: >
      O helper estornarLiberacaoReserva (commit 209253c) chamava inserirMovimentacao
      criando tipo='R' sem passar expira_em. O RPC wms_inserir_movimentacao tem
      CHECK constraint exigindo expira_em NOT NULL pra movs tipo R. Toda
      desmarcação falhava silenciosamente (try/catch externo logava warn
      mas continuava deletando os links + marcando o item como desmarcado).
      Sintoma: reservado não voltava ao desmarcar checkbox; UI só mostrava
      o E counter da saída.
      Erro de log adicional: PostgrestError não estende Error, e o catch
      antigo fazia String(err) que retornava "[object Object]" — escondendo
      a mensagem real ("reserva (tipo R) exige expira_em").
    fix: >
      estornarLiberacaoReserva passa expira_em = now() + 30 dias (alinhado
      com criarReservaCascade e webhook-processor-wms). Catch no marcar-item
      foi melhorado pra extrair .message de objetos com essa propriedade,
      evitando "[object Object]" em logs futuros.
    files:
      - src/lib/wms/reservas-picking.ts
      - src/app/api/wms/separacao/marcar-item/route.ts
    tags: [wms, separacao, marcar-item, desmarcar, reserva, expira_em, postgrest-error]

  # ─────────────────────────────────────────────────────────────────
  # P3 — Reverse Paritária + Idempotência (2026-05-27)
  # 22 findings da auditoria WMS. Catálogo completo de entries
  # representativas (4.1, 4.2, 4.3, 4.4, 4.5/4.6, 4.7, 5.1, 5.2,
  # 5.3/5.8, 6.3, 7.7, 7.13, 8.2, 8.3, 8.6, 8.8, 8.10, 2.7, 2.10, 3.20).
  # As demais (subcasos menores) seguem o mesmo padrão e podem ser
  # adicionadas sob demanda quando incidentes específicos forem registrados.
  # Plano: docs/superpowers/plans/2026-05-26-wms-fix-p3-reverse-idempotencia.md
  # ─────────────────────────────────────────────────────────────────

  - id: p3-fix-4.1-aplicar-inventario-nao-idempotente
    date: "2026-05-27"
    source: wms.inventario.aplicar
    category: business_logic
    message: 'aplicar inventário 2× em paralelo cria duplo conjunto de movs'
    cause: >
      `aplicarSessao()` selecionava divergências aprovadas e inseria 1 mov
      por divergência sem nenhuma proteção contra concorrência. Duas
      requisições paralelas pra mesmo sessao_id resultavam em 2× movs por
      divergência (saldo dobrado, custo médio recalculado errado).
    fix: >
      Migration `20260527_p3_movs_unique_inventario_divergencia.sql` cria
      UNIQUE partial INDEX `uniq_movs_inventario_divergencia` em
      `siso_movimentacoes(origem_id, origem_tipo)` WHERE origem_tipo IN
      ('inventario_perda','inventario_ganho'). 2ª chamada paralela bate
      em SQLSTATE 23505, traduzido como ConflictError
      `{ code:'DIVERGENCIA_JA_APLICADA' }` no caller — a divergência é
      pulada e o loop continua com as demais. Response agora retorna
      `{ movsGeradas, divsJaAplicadas }`.
    files:
      - supabase/migrations/20260527_p3_movs_unique_inventario_divergencia.sql
      - src/lib/wms/inventario.ts
    tags: [wms, inventario, aplicar, idempotencia, unique-constraint, p3]

  - id: p3-fix-4.2-sem-endpoint-estornar-sessao-aplicada
    date: "2026-05-27"
    source: wms.inventario.estornar
    category: business_logic
    message: 'não existia caminho oficial pra reverter sessão de inventário aplicada'
    cause: >
      Após `aplicarSessao` gerar movs no ledger, qualquer correção exigia SQL
      manual em produção pelo DBA. Não havia botão admin pra desfazer.
    fix: >
      Novo endpoint `POST /api/wms/inventario/[id]/estornar` (admin-only).
      Para cada divergência `aplicada` (mov_aplicada_id não-null) chama
      `estornarMovimentacao` e volta divergência pra `pendente`. Sessão
      volta pra `revisao`. Idempotente — repetir é no-op via guard
      `estorno_de IS NOT NULL`.
    files:
      - src/app/api/wms/inventario/[id]/estornar/route.ts
      - src/lib/wms/inventario.ts
      - src/app/wms/inventario/[id]/page.tsx
    tags: [wms, inventario, estornar, reverse, admin, p3]

  - id: p3-fix-4.3-contagem-sem-lock
    date: "2026-05-27"
    source: wms.inventario.contagens
    category: validation
    message: 'POST /contagens permitia bipar loc sem ter adquirido lock'
    cause: >
      `registrarContagem()` lia o lock pra logar mas não validava. Dois
      operadores podiam bipar a mesma loc em paralelo, ou um operador
      podia bipar uma loc que nunca claimou (gerando contagem fantasma
      que entrava em divergências).
    fix: >
      Endpoint agora valida que `siso_inventario_localizacoes.bloqueada_por
      = usuario_id` antes de gravar. Sem lock retorna 409 LOC_NAO_BLOQUEADA.
    files:
      - src/app/api/wms/inventario/[id]/contagens/route.ts
      - src/lib/wms/inventario.ts
    tags: [wms, inventario, contagens, lock, anti-race, p3]

  - id: p3-fix-4.4-delete-sessao-aplicada-permitia
    date: "2026-05-27"
    source: wms.inventario.delete
    category: business_logic
    message: 'DELETE /inventario/[id] cancelava sessão mesmo com status=aplicada'
    cause: >
      DELETE em sessão aplicada removia locks e mudava status pra cancelada,
      mas as movs já estavam no ledger. Estado inconsistente — caller perdia
      a referência pra estornar depois.
    fix: >
      DELETE agora retorna 409 se status='aplicada' com mensagem apontando
      pra POST /inventario/[id]/estornar como caminho correto. Outros
      status (planejada/em_andamento/revisao/aprovada) continuam canceláveis.
    files:
      - src/app/api/wms/inventario/[id]/route.ts
      - src/lib/wms/inventario.ts
    tags: [wms, inventario, delete, conflict, p3]

  - id: p3-fix-4.5-aprovar-com-operadores-ativos
    date: "2026-05-27"
    source: wms.inventario.aprovar
    category: business_logic
    message: 'aprovar/aprovar-sessao não avisava se há operadores ainda bipando'
    cause: >
      Supervisor podia aprovar uma sessão enquanto operadores estavam
      ativamente bipando, descartando contagens em andamento. Não havia
      sinal claro de "espera" — sessão simplesmente avançava silenciosamente.
      Operadores órfãos (com `finalizado_em` null indefinidamente) também
      mantinham locks de localização.
    fix: >
      `computarDivergencias` agora limpa operadores órfãos (finaliza quem
      ficou stale há >X min). Endpoints `/aprovar` e `/aprovar-sessao`
      retornam 409 OPERADORES_ATIVOS com lista dos operadores ainda ativos.
      Supervisor pode bypassar via body `{ force: true }`.
    files:
      - src/app/api/wms/inventario/[id]/aprovar/route.ts
      - src/app/api/wms/inventario/[id]/aprovar-sessao/route.ts
      - src/lib/wms/inventario.ts
    tags: [wms, inventario, aprovar, operadores-ativos, conflict, p3]

  - id: p3-fix-4.7-patch-modo-mid-flow
    date: "2026-05-27"
    source: wms.inventario.patch
    category: business_logic
    message: 'PATCH inventário permitia trocar modo_contagem (blind↔aberto) mid-flow'
    cause: >
      Operadores bipavam sob um modo (blind, p.ex.) e supervisor podia trocar
      pra aberto no meio da sessão. Comparação de contagens vs sistema ficava
      corrompida (parte das movs estava sob regras diferentes).
    fix: >
      PATCH agora bloqueia mudança de `modo_contagem` se status != 'planejada'.
      Retorna 409 MODO_LOCKED. Outros campos (nome, tolerancia_pct, etc.)
      continuam editáveis em qualquer status.
