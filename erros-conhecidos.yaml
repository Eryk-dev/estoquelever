  - id: wms-fix-final-b-t12-desfazer-guarda-parcial
    date: "2026-05-27"
    source: src/lib/wms/guarda.ts + src/app/api/wms/guarda/[id]/desfazer/route.ts
    category: business_logic
    message: "desfazerGuarda rejeitava qty != qty_guardada — guarda parcial não era desfazível"
    cause: >
      A função desfazerGuarda (src/lib/wms/guarda.ts) tinha guard de MVP que
      retornava erro ao receber qty diferente de qty_guardada:
        "MVP: desfazer parcial não suportado. Omita qty pra desfazer toda a guarda atual."
      Impedia operadores de reverter apenas parte de uma guarda já confirmada,
      forçando sempre desfazer tudo ou nada.
    fix: >
      Guard de MVP removido. Lógica de estorno substituída por par S+E direcional
      (S na loc destino → E em RECEBIMENTO), suportando qualquer qty ≤ qty_guardada.
      Backwards-compat: qty omitido = desfazer qty_guardada inteiro.
      Cenário 51 valida desfazer parcial e total ✅ (~214s). Commit 1407fae.

      Concern documentado (não corrigido): existe race condition entre as 2
      chamadas sequenciais a inserirMovimentacao (S + E). As 2 movs não são
      atômicas — se o processo morrer entre elas, o saldo fica inconsistente.
      O mesmo risco já existia antes desta task. Correção definitiva requer
      wrapper PL/pgSQL RPC que execute ambas as movs em 1 transação DB.
      Fora do escopo B10 / fix-final-b.
    files:
      - src/lib/wms/guarda.ts
      - src/app/api/wms/guarda/[id]/desfazer/route.ts
    commit: "1407fae"
    tags: [wms, guarda, desfazer, parcial, race-condition, atomicidade, fix-final-b, t12, b10]

