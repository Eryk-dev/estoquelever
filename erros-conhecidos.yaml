  - id: wms-fix-final-b-t11-devolucao-id-determinismo
    date: "2026-05-27"
    source: siso_movimentacoes + src/lib/wms/ledger.ts + src/lib/wms/devolucoes.ts
    category: database
    message: "desclassificarDevolucao usava heurística de janela temporal (±1min) pra encontrar movs — risco de falso positivo/negativo"
    cause: >
      A função desclassificarDevolucao (src/lib/wms/devolucoes.ts) identificava
      movimentações a estornar por correspondência aproximada: buscava movs
      cujo criado_em caía dentro de ±1 minuto em torno de devolucao.classificada_em.
      Essa heurística era frágil: outras movs não relacionadas no mesmo intervalo
      poderiam ser capturadas (falso positivo) ou a mov certa poderia ser perdida
      se o relógio do servidor variasse (falso negativo).
    fix: >
      Migration 20260528_movs_devolucao_id.sql adiciona coluna
      devolucao_id uuid REFERENCES siso_devolucoes_pendentes(id) ON DELETE SET NULL
      em siso_movimentacoes, com índice parcial WHERE devolucao_id IS NOT NULL.
      inserirMovimentacao aceita devolucao_id opcional via UPDATE-after-insert
      (RPC wms_inserir_movimentacao não foi alterada — compatibilidade mantida).
      classificarDevolucao passa devolucao_id ao inserir as movs.
      desclassificarDevolucao usa .eq('devolucao_id', id).is('estorno_de', null)
      em vez da janela temporal — determinístico. Cenário 52 valida o fluxo ✅.
      Commit 56b1f17.
