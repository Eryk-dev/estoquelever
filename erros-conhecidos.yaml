    reconciliador nunca mais selecionava o pedido → item congela em OC apesar do
    saldo. O clique SEPARAR não re-rotava nada.
  fix: >
    (1) STATUS_PEDIDO_OC inclui em_separacao — transicionarPedidoSeReconciliado já
    trata estado avançado (só marca decisao_final='propria', não regride status; a
