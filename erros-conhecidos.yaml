    (2) separacao/iniciar dispara reconciliarEntradaEstoque por (produto_uuid,
    galpão) dos itens OC, após o promote e antes do consolidar. Helper puro
    paresProdutoGalpao (sku→uuid; produto_id do item é tiny_produto_id).
    Saldo em loc de RECEBIMENTO (ainda não guardado) é Fase 2 (coordenar com
    put-away p/ não violar reservado<=saldo).
