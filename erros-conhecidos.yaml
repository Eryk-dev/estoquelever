      (https://estoquelever.vercel.app/api/wms/transferencias/cleanup). Padrão
      idêntico aos 4 crons já funcionando (insights/reservas/inventário/ABC/Tiny).
      Validado: trigger one-shot retornou HTTP 200 com {canceladas:1, erros:[]}.
