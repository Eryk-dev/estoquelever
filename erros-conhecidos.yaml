    cause: >
      Quando o cascade esgotava no galpão atual, o parcial chamava
      mandarItensParaCompras (commit e0d106a) → aguardando_compra. O encaminhar
      só aceita aguardando_separacao/em_separacao/pendente_realocacao → rejeitado
      → a S do parcial nunca era estornada → saldo origem fantasma.
      Evidência: cenário 05 (saldo CWB=0, esperado 2).
