  - id: wms-recompute-sugestao-ignora-reserva-propria
    date: "2026-06-15"
    source: src/lib/wms/sugestao-dinamica.ts
    category: business_logic
    message: "Recompute de sugestão contava a reserva do PRÓPRIO pedido como indisponível → transferência legítima virava 'oc' espúrio e sumia da aba Pendentes (home 'Aprovação' contava 8, lista mostrava 0; número piscava 0↔8)"
    cause: >
      recomputarSugestaoBatch lê siso_estoque.disponivel (GENERATED saldo-reservado).
      Todo pedido propria/transferencia cria uma R reserva_pedido no webhook sobre o
      galpão que cobre — essa R já desconta do disponivel. Ao recomputar a rota do
      próprio pedido, o galpão-cobertura aparecia com disponivel insuficiente (a
      própria reserva), rotearPedido não achava cobertura 100% e caía em 'oc'. A aba
      Pendentes de /wms/pedidos filtra status=pendente AND sugestao(VIVA)='transferencia'
      (page.tsx), então os pedidos sumiam. A home (dashboard-tarefas.ts) conta o
      SNAPSHOT siso_pedidos.sugestao='transferencia' (não recomputa) → divergência
      home=8 × lista=0. O recompute tem .catch que degrada pro snapshot (route.ts),
      então sob erro/timeout a lista voltava a mostrar os 8 — o número "piscava".
      Efeito colateral do fix wms-lista-sugestao-oc-stale-snapshot (2026-06-02), que
      introduziu o recompute vivo sem somar de volta a reserva própria.
    fix: >
      recomputarSugestaoBatch passou a somar de volta a reserva ATIVA do próprio
      pedido (net R−L de siso_movimentacoes por pedido+produto+galpão) ao disponivel
      em buscarLinha. 1 query batch extra (6 fixas no total, independente de N).
      Assinatura inalterada → callers (route.ts da lista + detalhe) não mudam.
      Validado por prova de dados NÃO-destrutiva em staging: 8 pedidos
      pendente+transferencia (snapshot) recomputavam 7 oc + 1 propria ANTES; com o
      addback recomputam 7 transferencia + 1 propria — a lista volta a mostrar os 7.
      O 1 (#1046297031) virou propria de verdade (CWB reabasteceu 11 un. de 024497)
      e segue preso em pendente porque nada re-roteia pendente quando estoque chega
      (gap separado — reconciliador-oc só trata OC).
    files:
      - src/lib/wms/sugestao-dinamica.ts
    tags: [wms, sugestao, recompute, reserva-propria, transferencia, oc, disponivel, aprovacao, dashboard, recomputarSugestaoBatch, listagem]
    notes: >
      Causa raiz da divergência home(8) × lista(0): home conta snapshot, lista conta
      sugestão viva — só batem 100% se o snapshot estiver fresco OU o pendente for
      re-roteado quando a rota viva muda. Relacionado:
      wms-lista-sugestao-oc-stale-snapshot (introduziu o recompute vivo).

  - id: separacao-pick-produto-nao-mapeado-sem-autoheal
    date: "2026-06-15"
    source: src/app/api/wms/separacao/validar-oc-item/route.ts
    category: business_logic
    message: "produto Tiny <id> (empresa <uuid>) não mapeado em siso_produto_empresas — pick (Encontrei/checkbox) dava 'Erro interno' 500 e o item ficava preso (ex.: pedido #4019, SKU 192275, 141AIR)"
    cause: >
      O auto-provisionamento do webhook (resolverItensWms → ensureProdutoFromTiny em
      webhook-processor-wms.ts) é best-effort: se a chamada ao Tiny falha no momento do
      pedido, ele só loga warn e deixa o item SEM vínculo Tiny↔WMS (siso_produto_empresas
      ausente + siso_produtos inexistente). Depois, no pick, resolverProdutoEfetivoDoItem
      joga "não mapeado" e o catch genérico do route vira 500. Não havia caminho de
      recuperação — o operador só via "Erro interno" com correlation id.
    fix: >
      Helper resolverProdutoEfetivoComAutoSync (sync-tiny.ts) — resolução SKU-first do
      produto físico: (1) substituto de troca; (2) siso_produtos.sku == item.sku
      (UNIQUE → 1:1, PRIMÁRIO — cobre produto_id=0 com SKU e ponte ausente numa consulta;
      premissa de domínio: SKU anúncio == SKU catálogo); (3) ponte tiny_id (fallback p/
      item sem SKU); (4) auto-provisão do Tiny (ensureProdutoFromTiny por tiny_id, ou
      buscarProdutoPorSku na empresa quando produto_id=0). Sem SKU e sem ponte → lança
      (resolução humana via definir-sku). NÃO re-roteia o pedido (diferente de definir-sku).
      Aplicado em validar-oc-item (Encontrei) e marcar-item (checkbox). Backstop manual:
      POST /produtos/sync-by-pedido-item + botão "Sincronizar do Tiny" no modal Encontrei.
      Cobre Caso A (#4019, tiny_id válido, ponte ausente) E Caso B (#952573331, produto_id=0,
      SKU 192160 já no catálogo). Evolução do fix inicial (era só auto-heal por tiny_id).
    files:
      - src/lib/wms/sync-tiny.ts
      - src/app/api/wms/separacao/validar-oc-item/route.ts
      - src/app/api/wms/separacao/marcar-item/route.ts
      - src/app/api/wms/produtos/sync-by-pedido-item/route.ts
      - src/app/wms/separacao/checklist/page.tsx
    tags: [wms, separacao, pick, encontrei, marcar-item, produto, tiny, siso_produto_empresas, nao-mapeado, auto-sync, sku-first, produto-id-zero, definir-sku, ensureProdutoFromTiny, buscarProdutoPorSku, vinculo, oc, 500]
    notes: >
      NÃO é "SKU sem dados no Tiny" — o Tiny TEM o produto; falta o vínculo no WMS. O
      estoque/ledger é por uuid de siso_produtos e sku é UNIQUE (1:1 com uuid), então o
      SKU resolve sozinho — tiny_id é só ponte de entrada (varia por empresa). Por isso a
      resolução virou SKU-first: produto_id=0 COM SKU agora resolve (ex. 192160, que já
      estava no catálogo mapeado só pra outra empresa). SÓ produto_id=0 SEM SKU (ou SKU
      inexistente no Tiny da empresa) exige humano (definir-sku, que além de vincular
      RE-ROTEIA o pedido). Correlation id #4019: 53f20bf6-ecf4-4797-a40e-0ca0fe25b55d.

  - id: kebab-compras-recortado-por-overflow-hidden
    date: "2026-06-17"
    source: wms.compras
    category: config
    message: >
      menu do kebab (⋮) de cada item na aba Compras aparecia "bugado" / numa
      camada debaixo — recortado e coberto pelo card seguinte, principalmente nos
      itens do fim da lista (perto do rodapé da viewport)
    cause: >
      o card do fornecedor (.wms-frc) tem `overflow: hidden` (clipa os cantos
      arredondados + a borda esquerda colorida). O dropdown era `position:absolute`
      DENTRO do card, então era recortado pelo overflow do ancestral — e z-index
      não escapa do clip de um ancestral com overflow:hidden, por mais alto que
      seja. Não era problema de valor de z-index.
    fix: >
      ItemKebab passou a renderizar o menu via createPortal(document.body) com
      `position: fixed`, ancorado no getBoundingClientRect() do botão (escapa do
      clip + do stacking context do card). Abre pra cima quando não há ~130px
      abaixo do botão (caso do rodapé da viewport). Fecha em scroll/resize (menu
      fixed ficaria deslocado do botão). z-index 950/951 (abaixo do Modal=999).
    files:
      - src/app/wms/compras/page.tsx
    tags: [wms, compras, kebab, dropdown, overflow-hidden, clip, z-index, portal, createPortal, position-fixed, wms-frc, camada-debaixo, ui]
    notes: >
      Mesmo sintoma do bug css-paper (dropdown "numa camada debaixo") mas causa
      diferente: lá era background transparente (token inexistente); aqui é clip
      por overflow:hidden do card. NÃO mexer no overflow:hidden do .wms-frc — é
      compartilhado (aba Receber usa wms-frc-row-doc) e clipa os cantos.

