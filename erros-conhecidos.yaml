  - id: pickmov-checklist-nao-atomico-double-tap
    date: 2026-06-22
    source: separacao-bipar-checklist
    category: business_logic
    message: >
      Double-tap no scanner (2 POST /bipar-checklist simultâneos pro mesmo item)
      ou falha da S após o L commitar gerava baixa DUPLA / L órfã (reservado
      reaparece como disponível = janela de overselling). bipar-checklist e
      validar-oc-item usavam pickMovPicking, que emitia L e S em 2 RPCs separadas
      (não-atômico) e sem lock na reserva — o guard `if(item.mov_saida_id)` lia
      snapshot pré-pick (TOCTOU).
    cause: >
      pickMovPicking chamava liberarReservaPicking (L) e inserirMovimentacao (S)
      como 2 transações independentes, sem FOR UPDATE na R nem checagem de
      "reserva já liberada". O caminho marcar-item (wms_pick_item_atomico) já era
      atômico/idempotente; o do scanner não foi migrado.
    fix: >
      pickMovPicking delega o par L+S à RPC atômica wms_pick_item_atomico (mesma
      do marcar-item): FOR UPDATE na R + guard 'reserva já liberada' serializam
      double-tap (2ª chamada lança → item não re-marcado, sem dupla baixa) e o
      par L+S vira uma única transação. A RPC também seta origem_id=pedido na S
      (ver bug saida-realocacao-sem-origem-id). Residual: ramo SEM reserva
      (OC "bipa onde achou") ainda não passa idempotency_key — double-tap sem R
      pode duplicar (raro).
    files:
      - src/lib/wms/separacao/pick-mov.ts
      - src/lib/wms/separacao/pick-mov.test.ts
    tags: [pick, bipar-checklist, scanner, double-tap, atomicidade, overselling, ledger, BUG-06, BUG-07]

  - id: saida-realocacao-sem-origem-id-reverter-cutover
    date: 2026-06-22
    source: separacao-marcar-realocacao
    category: business_logic
    message: >
      Retrocesso (desfazer-bip embalado→em_separacao) deixava a S de realocação
      (cascade) SEM estorno → saldo físico continuava deduzido (estoque fantasma
      a menos) e a R cascade nunca recriada.
    cause: >
      A S de realocação grava seu mov_saida_id em siso_pedido_item_realocacoes
      (não em siso_pedido_itens) e era inserida SEM origem_id. A RPC
      wms_reverter_cutover_atomico só acha a S por origem_id=pedido OU por
      mov_saida_id ∈ siso_pedido_itens — então perdia a S de realocação.
      desfazer-bip não roda reset-state (que já estorna via realoc.mov_saida_id),
      só a RPC.
    fix: >
      Passa origem_id=pedido na S de realocação single-pedido (marcar-realocacao)
      e no pick principal (pick-mov, agora via RPC que já seta origem_id) — a RPC
      de reverter acha a S pelo Caminho 1. NÃO aplicado à S consolidada de wave
      do /parcial (cobre N pedidos numa só S — tag de 1 pedido faria
      super-estorno; fica como limitação, liga ao bug s-consolidada-wave).
    files:
      - src/app/api/wms/separacao/marcar-realocacao/route.ts
      - src/lib/wms/separacao/pick-mov.ts
    tags: [realocacao, cascade, reverter-cutover, estorno, origem-id, estoque-fantasma, BUG-02]

