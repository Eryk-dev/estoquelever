      pedido_id da FK lógica, etc) continuam — proteção real contra bugs.
      Teste em ledger.test.ts:72 convertido de "throws com FOO" pra
      "NÃO valida origem_id como uuid" (regressão).
      Outros call sites adjacentes que ficavam quebrados pela mesma raiz
      (reservas.ts:77 liberar por NF, reservas-picking.ts:158 cascade
      parcial, execution-worker-wms.ts:129,142 cutover do concluir)
      passam a funcionar.
    files:
