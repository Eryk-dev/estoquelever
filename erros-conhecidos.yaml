  - id: desativar-ultimo-admin-lockout
    date: "2026-06-05"
    source: wms/admin/usuarios
    category: auth
    message: "Desativar (ativo=false) o último admin ativo travava o sistema — ninguém mais acessava Configurações/usuários (lockout)."
    cause: >
      PUT /api/wms/admin/usuarios aplicava ativo direto sem guard. A proteção anti-lockout
      existente só cobria REMOVER a role admin ([id]/roles), não DESATIVAR o usuário.
    fix: >
      Guard no PUT: quando rest.ativo===false e o alvo é admin (role codigo='admin'), checa
      se existe OUTRO usuário ativo com role admin; se não, 409 "Sistema precisa de pelo
      menos 1 admin ativo". Dispara só em ativo===false (não afeta updates de printnode/galpoes/cargos).
    files:
      - src/app/api/wms/admin/usuarios/route.ts
      - scripts/wms/cenarios/auth/21-ultimo-admin-desativar.ts
    tags: [auth, anti-lockout, admin, usuarios, P136]

  - id: estornar-pedido-deixa-job-vivo
    date: "2026-06-05"
    source: wms/pedidos/estornar
    category: business_logic
    message: "Estornar pedido deixava o job lancar_estoque vivo na fila; worker re-processava (potencial double-release de estoque)."
    cause: >
      /pedidos/[id]/estornar setava status_separacao='cancelado' (não status) e nunca
      tocava siso_fila_execucao. O guard do worker lê siso_pedidos.status — coluna
      diferente — então o job não era pulado. Adicionalmente, status_separacao='cancelado'
      violava o CHECK da coluna (não é valor permitido), então o update falhava silenciosamente.
    fix: >
      Estornar agora seta status='cancelado' (além de status_separacao=NULL — CHECK não
      admite 'cancelado' nessa coluna) e UPDATE siso_fila_execucao SET status='cancelado'
      WHERE pedido_id=... AND status IN ('pendente','executando','erro').
    files:
      - src/app/api/wms/pedidos/[id]/estornar/route.ts
      - scripts/wms/cenarios/catalogo/85-cancelar-job-fila-estorno.ts
    tags: [estorno, fila, worker, double-release, status, P008]

  - id: cancelamento-nao-libera-reserva-operador
    date: "2026-06-05"
    source: wms/pedidos/aprovar, wms/compras-utils, wms/compras/itens/cancelamento, wms/compras/pedidos/cancelar
    category: business_logic
    message: "Caminhos de cancelamento acionados pelo operador (Recusar pedido, cancelar item/pedido de compra) cancelavam o pedido sem liberar a reserva R viva — estoque ficava preso até TTL 30d ou cron 1h."
    cause: >
      Só os caminhos admin (/pedidos/[id]/estornar) e webhook (webhook/tiny) liberavam R.
      O bloco 'rejeitado' de /pedidos/aprovar, checkAndCancelPedidoIfAllTerminal e
      cancelamento/confirmar não chamavam estornarReservaIndividual/liberarReserva.
    fix: >
      'rejeitado' de aprovar e checkAndCancelPedidoIfAllTerminal e compras/pedidos/cancelar
      passam a estornar cada R viva via estornarReservaIndividual (idempotente por estorno_de).
      cancelamento/confirmar libera via liberarReserva (pedido-scoped) quando o pedido não foi
      cancelado pela função (caso multi-item) — mesma limitação aceita em equivalente/confirmar.
    files:
      - src/app/api/wms/pedidos/aprovar/route.ts
      - src/lib/compras-utils.ts
      - src/app/api/wms/compras/itens/[itemId]/cancelamento/confirmar/route.ts
      - src/app/api/wms/compras/pedidos/[pedidoId]/cancelar/route.ts
      - scripts/wms/cenarios/catalogo/34-recusar-pedido-libera-r.ts
      - scripts/wms/cenarios/catalogo/84-cancelar-item-libera-reserva.ts
    tags: [cancelamento, reserva, liberar, compras, recusar, P034, P038, P039]

  - id: cancelar-em-separacao-parcial-bloqueava-tudo
    date: "2026-06-05"
    source: wms/vendas-cancelamento, wms/separacao/cancelar
    category: business_logic
    message: "Cancelar pedido em separação parcial bloqueava 100% (venda manual: throw 'separação ativa') OU estornava tudo (marketplace: /separacao/cancelar) — não tratava pego×não-pego."
    cause: >
      cancelarVendaManual adotava a OPÇÃO 1 (bloquear) — contra a decisão D1 (OPÇÃO 2).
      /separacao/cancelar sempre fazia voltar-etapa (estornava todas as S).
    fix: >
      classificarItensParaCancelamento (pura) separa pego (mov_saida_id || quantidade_pega>0)
      de não-pego. cancelarVendaManual e /separacao/cancelar (modo cancelar_pedido:true) liberam
      só a R dos não-pegos, preservam a S dos pegos (auditoria), marcam pedido cancelado e
      retornam itens_para_devolver_manual. Estendido ao marketplace via /separacao/cancelar (D1).
    files:
      - src/lib/wms/cancelamento-parcial.ts
      - src/lib/wms/vendas-cancelamento.ts
      - src/app/api/wms/vendas/[id]/cancelar/route.ts
      - src/app/api/wms/separacao/cancelar/route.ts
      - scripts/wms/cenarios/catalogo/83-cancelar-pedido-em-separacao-parcial.ts
      - scripts/wms/cenarios/catalogo/83b-cancelar-marketplace-parcial.ts
    tags: [cancelamento, separacao, parcial, devolucao-manual, D1, P007]
  - id: webhook-reserva-parcial-e-dedup
    date: "2026-06-05"
    source: wms/webhook-processor, wms/reservas
    category: business_logic
    message: "Auto-aprovação no webhook engolia falha de reserva parcial (pedido seguia meio-aprovado) e reservarAtomico duplicava R em reprocessamento (reservado dobrado)."
    cause: >
      O loop de reserva em webhook-processor-wms.ts:597-604 só logava warn+continue e
      enfileirava lancar_estoque mesmo com item não-reservado. reservarAtomico só chamava a
      RPC (não idempotente) — 2 reprocessos rápidos criavam 2 R por (pedido,produto).
    fix: >
      criarReservasRotaAtomico: all-or-nothing — se qualquer item falha, estorna as criadas
      (rollback) e RE-LANÇA (webhook vira 'erro', Tiny retenta); só enfileira se 100% reservado.
      reservarAtomico passa a checar R viva por (pedido,produto,tripla) e retornar o id existente
      (dedup idempotente, sem advisory lock) — torna o retry seguro.
    files:
      - src/lib/webhook-processor-wms.ts
      - src/lib/wms/reservas.ts
      - test/integration/webhook-reserva-all-or-nothing.integration.test.ts
      - test/integration/reservas-idempotente.integration.test.ts
    tags: [webhook, reserva, all-or-nothing, idempotencia, dedup, P085, P003]
  - id: wms-inventario-bipe-sessao-fora-andamento
    date: "2026-06-05"
    source: wms.inventario.contagens
    category: business_logic
    message: "bipe aceito em sessão de inventário que já saiu de em_andamento (números somem no vazio)"
    cause: >
      registrarContagem só validava o status da LOC (contada/aprovada) e o lock
      do operador, nunca o status da SESSÃO. Sessão em revisao/aprovada/aplicada
      com loc de lock órfão (em_contagem) ainda aceitava bipe.
    fix: >
      Guard explícito no início de registrarContagem: lê siso_inventario_sessoes.status
      e lança erro se != 'em_andamento'. Rota mapeia o erro pra 409.
    files: [src/lib/wms/inventario.ts, src/app/api/wms/inventario/[id]/contagens/route.ts]
    tags: [inventario, guard, sessao, P058]
  - id: wms-inventario-janela-divergencia-fantasma
    date: "2026-06-05"
    source: wms.inventario.computarDivergencias
    category: business_logic
    message: "divergência de inventário falsa quando compra chega entre contagem e cutoff"
    cause: >
      computarDivergencias buscava movs a partir de min(contado_em). Uma mov E
      (compra) criada após a contagem mas com criado_em anterior a min(contado_em)
      de outra tripla escapava da janela, e a reconciliação temporal não enxergava
      o saldo_anterior real → divergência fantasma.
    fix: >
      dataLimiteInferior ampliado pro início do dia (UTC date_trunc('day')) de
      min(contado_em) via helper puro janelaInferiorReconciliacao. A função pura
      reconciliarTemporal já filtra por t_ref por tripla, então a janela maior só
      alimenta candidatos.
    files: [src/lib/wms/inventario.ts, src/lib/wms/inventario-reconciliacao.ts]
    tags: [inventario, reconciliacao, divergencia, P059]

  - id: wms-inventario-estorno-sessao-parcial
    date: "2026-06-05"
    source: wms.inventario.estornarSessaoInventario
    category: business_logic
    message: "estorno de sessão de inventário deixa estado parcial se um item falha (saldo negativo)"
    cause: >
      estornarSessaoInventario estornava cada divergência numa tx RPC independente.
      Se o N-ésimo estorno negativaria o saldo (alguém consumiu), os anteriores já
      tinham commitado e o supervisor recebia 500 sem saber qual item caiu.
    fix: >
      RPC plpgsql wms_estornar_sessao_inventario: preflight de saldo de TODAS as
      contra-movs antes de inserir qualquer uma; RAISE nomeando o produto que
      negativaria → rollback total. Rota mapeia pra 409.
    files: [supabase/migrations/20260605_rpc_estornar_sessao_inventario.sql, src/lib/wms/inventario.ts, src/app/api/wms/inventario/[id]/estornar/route.ts]
    tags: [inventario, estorno, atomico, P056, P061]

  - id: wms-inventario-estorno-so-sessao-inteira
    date: "2026-06-05"
    source: wms.inventario.estornar
    category: business_logic
    message: "estorno de inventário só desfaz a sessão inteira, forçando recontagem das corretas"
    cause: >
      Só existia estornarSessaoInventario (lote por sessão). Para corrigir 1
      prateleira errada o supervisor jogava fora as N contagens certas.
    fix: >
      Nova estornarDivergenciaInventario({divergencia_id}) estorna 1 mov,
      reseta só aquela divergência pra 'pendente', não mexe nas demais. Rota
      aceita divergencia_id no body.
    files: [src/lib/wms/inventario.ts, src/app/api/wms/inventario/[id]/estornar/route.ts]
    tags: [inventario, estorno, granular, P159]

  - id: wms-contagem-inline-nao-atomica
    date: "2026-06-05"
    source: wms.contagem-inline
    category: business_logic
    message: "acerto de prateleira no pick desacopla saldo e contagem em caso de falha"
    cause: >
      registrarContagemInline fazia a mov de reconciliação e os inserts de
      contagem/divergência em chamadas separadas (não-atômico v1 documentado).
      Falha após a mov deixava ganho/perda sem registro de contagem.
    fix: >
      RPC plpgsql wms_contagem_inline_atomica envolve saldo + contagem +
      divergência numa única transação BEGIN. registrarContagemInline vira
      wrapper fino.
    files: [supabase/migrations/20260605_rpc_contagem_inline_atomica.sql, src/lib/wms/contagem-inline.ts]
    tags: [inventario, contagem-inline, atomico, acerto, P057]

  - id: wms-devolucao-classificar-nao-atomica
    date: "2026-06-05"
    source: wms.devolucoes.classificarDevolucao
    category: business_logic
    message: "classificação de devolução deixa movs órfãs / dupla-contagem em falha parcial e concorrência"
    cause: >
      classificarDevolucao emitia até 3 movs em txs separadas e só depois fazia
      o UPDATE de status (TOCTOU). Falha no meio deixava saldo subido com status
      pendente (re-run duplicava). Avariado sem quarentena fazia ajuste_manual
      silencioso (item sumia).
    fix: >
      RPC wms_classificar_devolucao: FOR UPDATE na devolução (serializa) + N movs
      + UPDATE status na mesma tx. Idempotente (status != aguardando → no-op).
      Avariado sem quarentena: RAISE (bloqueia antes de mover). Back-fill de
      devolucao_id nas movs via origem_id compartilhado (preserva o lookup
      determinístico de desclassificarDevolucao, já que a assinatura nomeada de
      wms_inserir_movimentacao não tem p_devolucao_id).
    files: [supabase/migrations/20260605_rpc_classificar_devolucao.sql, src/lib/wms/devolucoes.ts, src/app/api/wms/devolucoes/[id]/classificar/route.ts]
    tags: [devolucao, classificar, atomico, quarentena, concorrencia, P049, P050, P051, P054]

  - id: wms-desfazer-recebimento-transf-nao-atomico
    date: "2026-06-05"
    source: wms.transferencias.desfazerRecebimentoTransferencia
    category: business_logic
    message: "undo de recebimento de transferência deixa header 'recebida' com estoque já devolvido"
    cause: >
      desfazerRecebimentoTransferencia estornava as legs E, depois fazia UPDATE
      separado de itens e header (3 statements sem tx). Falha no reset deixava
      estoque devolvido com header/itens ainda 'recebida'. E o undo falhava com
      erro cru sem dizer quanto dá pra devolver.
    fix: >
      Preflight 'desfazível X de Y' (409, sem mutar; force opcional) + RPC
      wms_desfazer_recebimento_transferencia (estorno legs E + reset itens +
      reset header numa tx tudo-ou-nada).
    files: [supabase/migrations/20260605_rpc_desfazer_recebimento_transferencia.sql, src/lib/wms/transferencias.ts, src/app/api/wms/transferencias/[id]/desfazer-recebimento/route.ts]
    tags: [transferencia, desfazer, atomico, preflight, P065, P067]

  - id: wms-estornar-parcial-mov-empresa-dona-morta
    date: "2026-06-05"
    source: wms_estornar_parcial_movimentacao
    category: database
    message: "wms_estornar_parcial_movimentacao lança 42703 (empresa_dona_id) em toda chamada desde o 3D"
    cause: >
      A RPC (20260518) chamava wms_inserir_movimentacao posicionalmente passando
      v_original.empresa_dona_id (coluna dropada no 3D) e na ordem antiga; a
      redefinição da assinatura em 20260520b (sem empresa_dona, retorna uuid)
      deixou a RPC quebrada — 42703 em toda chamada. Quebrava estorno parcial e
      separacao/desfazer-parcial em runtime.
    fix: >
      CREATE OR REPLACE: chamada por named params na assinatura atual (sem
      empresa_dona_id), captura o uuid retornado e dá SELECT da linha pra manter
      RETURNS siso_movimentacoes.
    files: [supabase/migrations/20260605_fix_rpc_estornar_parcial_movimentacao.sql]
    tags: [estorno-parcial, rpc, 3d, empresa_dona_id, P078]
