  - id: wms-fix-final-a-r5-siso-notas-fiscais
    date: "2026-05-27"
    source: supabase/migrations/20260527_siso_notas_fiscais.sql
    category: database
    message: "movs com origem NF tinham nota_fiscal_id NULL — rastreio fiscal quebrado"
    cause: >
      Não havia tabela canônica de NF. siso_movimentacoes.nota_fiscal_id
      era uuid nullable sem FK destino — devoluções, vendas e compras
      gravavam bigint Tiny via origem_detalhes (text) e deixavam o uuid
      NULL. Resultado: rastreio NF↔mov frágil; reconciliação fiscal
      manual; impossível seguir uma cadeia de devolução de volta à
      venda original.
    fix: >
      Cria siso_notas_fiscais (uuid PK, chave_acesso UNIQUE, tipo
      entrada/saida, raw_tiny JSONB). FK siso_movimentacoes.nota_fiscal_id
      → siso_notas_fiscais(id) ON DELETE SET NULL. Helper upsertNotaFiscal
      (nf-webhook-handler.ts) dedupa por chave_acesso ou tiny_id antes
      de inserir. classificarDevolucao (entrada) + executarEstoquePosNfWms
      (saída) populam nota_fiscal_id em todas as novas movs.
      inserirMovimentacao agora exige nota_fiscal_id quando origem_tipo é
      NF — vigia regressão. Backfill script criado (scripts/wms/
      backfill-notas-fiscais.ts) pra movs históricas com chave em
      origem_detalhes.
    files:
      - supabase/migrations/20260527_siso_notas_fiscais.sql
      - src/lib/nf-webhook-handler.ts
      - src/lib/wms/devolucoes.ts
      - src/lib/execution-worker-wms.ts
      - src/lib/wms/ledger.ts
      - scripts/wms/backfill-notas-fiscais.ts
    tags: [wms, ledger, nf, siso_notas_fiscais, fk, backfill, fix-final-a, r5]

