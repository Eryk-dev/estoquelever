  - id: p3-fix-7.7-vendas-idempotency-cancelado
    date: "2026-05-27"
    source: wms.vendas.criar
    category: business_logic
    message: 'idempotency_key reciclava pedido cancelado em vez de criar novo'
    cause: >
      `vendas/criar` filtrava por `idempotency_key` mas não excluía pedidos
      cancelados. Se vendedor cancelava venda e re-tentava com mesma key
      (cenário comum — UI gera key uma vez), recebia o pedido cancelado
      em vez de um novo.
    fix: >
      SELECT pre-insert agora filtra `status NOT IN ('cancelado')`.
      Cancelados não bloqueiam re-criação com mesma key — comportamento
      esperado pelo vendedor.
