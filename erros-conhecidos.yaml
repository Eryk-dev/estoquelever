      Fase 7). Migração exige decisão de design: (a) usar estado live de
      siso_estoque (mais simples mas muda semântica), ou (b) materializar
      snapshot de outra forma (campo extra em siso_pedido_itens, ou
      reservas+ledger). CLAUDE.md mantém entrada "Deprecated / To Remove"
      pra siso_pedido_item_estoques com nota de "defer reason".
