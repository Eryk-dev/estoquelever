  - id: wms-marcar-item-desmarcar-nao-volta-reserva
    date: "2026-05-26"
    source: separacao-marcar-item
    category: business_logic
    message: 'Estorno WMS falhou: mov X já é um estorno (estorno_de=Y)'
    cause: >
      No desmarcar do checkbox, o loop iterava os mov_links (saida + liberacao_reserva)
      e chamava estornarMovimentacao em cada um. A L de liberação carrega
      estorno_de=R.id por convenção arquitetural (cutover do execution-worker
      filtra reservas "já convertidas" via EXISTS L WHERE estorno_de=R.id).
      Mas a guarda em ledger.estornarMovimentacao ("if original.estorno_de
      → throw já é um estorno") confunde isso com estorno contábil e rejeita
      o estorno da L. Resultado:
       - S é estornada (E counter) — saldo volta ✓
       - L NÃO é estornada — reservado fica em 0, R original viva mas
         marcada como "já liberada" via L que continua de pé
       - Re-marcação: buscarReservaPendente considera R "já liberada"
         (L está lá) e cria S sem L par — pareamento R↔L corrompido.
      Mesmo se a guarda fosse relaxada, o estornarMovimentacao genérico
      criaria a R nova com origem_tipo='estorno' — invisível pro
      buscarReservaPendente que filtra por origem_tipo='reserva_pedido'.
    fix: >
      Adicionado helper estornarLiberacaoReserva em src/lib/wms/reservas-picking.ts
      que bypassa o estornarMovimentacao genérico e chama inserirMovimentacao
      direto, criando uma R com origem_tipo='reserva_pedido', origem_id=pedido_id,
      estorno_de=L.id. Idempotente (se já estornada, retorna a R existente).
      marcar-item/route.ts desmarcar condiciona por tipo_link:
       - 'saida' → estornarMovimentacao (cria E)
       - 'liberacao_reserva' → estornarLiberacaoReserva (cria R nova)
      Re-marcação depois passa a achar a R ressuscitada via buscarReservaPendente.
      Pareamento R↔L↔S preservado em ciclos marca/desmarca arbitrários.
    files:
      - src/lib/wms/reservas-picking.ts
      - src/app/api/wms/separacao/marcar-item/route.ts
    tags: [wms, separacao, marcar-item, desmarcar, reserva, liberacao_reserva, estorno, ledger]
    notes: >
      Bug correlato fora de escopo: src/lib/separacao/reset-state.ts (usado
      por cancelar, desfazer-parcial, voltar-etapa, reiniciar) só estorna
      links tipo_link='saida' — ignora 'liberacao_reserva'. Mesma classe
      de bug em outros caminhos. Fix separado pendente.

  - id: wms-aprovar-idempotencia-r-liberada-pula-criacao
    date: "2026-05-26"
    source: aprovar.reservas
    category: business_logic
    message: 'Reservas já existentes — skip (porém todas R estavam liberadas)'
    cause: >
      Em src/app/api/wms/pedidos/aprovar/route.ts, a idempotência checava
      "qualquer R com origem_id=pedidoId" pra skipar criação. Ledger é
      imutável — uma R liberada (com L estorno_de=R.id) continua viva como
      linha. Resultado: após reset (ou qualquer fluxo que libere R por L
      e re-deixe o pedido em 'pendente'), a re-aprovação encontrava a R
      antiga e skipava criar nova. Pedido seguia pra separação SEM R.
      Marcar checkbox criava S (sem L par, sem R par) — saldo deduz, mas
      pareamento R↔L↔S inexistente. Apareceu logo após o reset dos 46
      pedidos ACD003: usuário re-aprovou 6 e nenhum gerou reserva.
    fix: >
      Idempotência agora filtra Rs ainda pendentes (sem L estorno apontando).
      Se TODAS Rs antigas estão liberadas, segue normalmente criando Rs novas.
      Padrão equivalente ao usado por buscarReservaPendente.
    files:
      - src/app/api/wms/pedidos/aprovar/route.ts
    tags: [wms, aprovar, idempotencia, reserva, ledger-imutavel, reset]

  - id: wms-estornar-liberacao-reserva-exige-expira-em
    date: "2026-05-26"
    source: separacao-marcar-item
    category: validation
    message: 'reserva (tipo R) exige expira_em (P0001 do wms_inserir_movimentacao)'
    cause: >
      O helper estornarLiberacaoReserva (commit 209253c) chamava inserirMovimentacao
      criando tipo='R' sem passar expira_em. O RPC wms_inserir_movimentacao tem
      CHECK constraint exigindo expira_em NOT NULL pra movs tipo R. Toda
      desmarcação falhava silenciosamente (try/catch externo logava warn
      mas continuava deletando os links + marcando o item como desmarcado).
      Sintoma: reservado não voltava ao desmarcar checkbox; UI só mostrava
      o E counter da saída.
      Erro de log adicional: PostgrestError não estende Error, e o catch
      antigo fazia String(err) que retornava "[object Object]" — escondendo
      a mensagem real ("reserva (tipo R) exige expira_em").
    fix: >
      estornarLiberacaoReserva passa expira_em = now() + 30 dias (alinhado
      com criarReservaCascade e webhook-processor-wms). Catch no marcar-item
      foi melhorado pra extrair .message de objetos com essa propriedade,
      evitando "[object Object]" em logs futuros.
    files:
      - src/lib/wms/reservas-picking.ts
      - src/app/api/wms/separacao/marcar-item/route.ts
    tags: [wms, separacao, marcar-item, desmarcar, reserva, expira_em, postgrest-error]
