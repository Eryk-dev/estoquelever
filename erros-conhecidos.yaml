  - id: wms-fix-final-b-t11-devolucao-id-determinismo
    date: "2026-05-27"
    source: siso_movimentacoes + src/lib/wms/ledger.ts + src/lib/wms/devolucoes.ts
    category: database
    message: "desclassificarDevolucao usava heurística de janela temporal (±1min) pra encontrar movs — risco de falso positivo/negativo"
    cause: >
      A função desclassificarDevolucao (src/lib/wms/devolucoes.ts) identificava
      movimentações a estornar por correspondência aproximada: buscava movs
      cujo criado_em caía dentro de ±1 minuto em torno de devolucao.classificada_em.
      Essa heurística era frágil: outras movs não relacionadas no mesmo intervalo
      poderiam ser capturadas (falso positivo) ou a mov certa poderia ser perdida
      se o relógio do servidor variasse (falso negativo).
    fix: >
      Migration 20260528_movs_devolucao_id.sql adiciona coluna
      devolucao_id uuid REFERENCES siso_devolucoes_pendentes(id) ON DELETE SET NULL
      em siso_movimentacoes, com índice parcial WHERE devolucao_id IS NOT NULL.
      inserirMovimentacao aceita devolucao_id opcional via UPDATE-after-insert
      (RPC wms_inserir_movimentacao não foi alterada — compatibilidade mantida).
      classificarDevolucao passa devolucao_id ao inserir as movs.
      desclassificarDevolucao usa .eq('devolucao_id', id).is('estorno_de', null)
      em vez da janela temporal — determinístico. Cenário 52 valida o fluxo ✅.
      Commit 56b1f17.
    files:
      - supabase/migrations/20260528_movs_devolucao_id.sql
      - src/lib/wms/ledger.ts
      - src/lib/wms/devolucoes.ts
    commit: "56b1f17"
    tags: [wms, devolucoes, ledger, devolucao-id, determinismo, heuristica, falso-positivo, fix-final-b, t11, b9]

  - id: wms-fix-final-b-t12-desfazer-guarda-parcial
    date: "2026-05-27"
    source: src/lib/wms/guarda.ts + src/app/api/wms/guarda/[id]/desfazer/route.ts
    category: business_logic
    message: "desfazerGuarda rejeitava qty != qty_guardada — guarda parcial não era desfazível"
    cause: >
      A função desfazerGuarda (src/lib/wms/guarda.ts) tinha guard de MVP que
      retornava erro ao receber qty diferente de qty_guardada:
        "MVP: desfazer parcial não suportado. Omita qty pra desfazer toda a guarda atual."
      Impedia operadores de reverter apenas parte de uma guarda já confirmada,
      forçando sempre desfazer tudo ou nada.
    fix: >
      Guard de MVP removido. Lógica de estorno substituída por par S+E direcional
      (S na loc destino → E em RECEBIMENTO), suportando qualquer qty ≤ qty_guardada.
      Backwards-compat: qty omitido = desfazer qty_guardada inteiro.
      Cenário 51 valida desfazer parcial e total ✅ (~214s). Commit 1407fae.

      Concern documentado (não corrigido): existe race condition entre as 2
      chamadas sequenciais a inserirMovimentacao (S + E). As 2 movs não são
      atômicas — se o processo morrer entre elas, o saldo fica inconsistente.
      O mesmo risco já existia antes desta task. Correção definitiva requer
      wrapper PL/pgSQL RPC que execute ambas as movs em 1 transação DB.
      Fora do escopo B10 / fix-final-b.
    files:
      - src/lib/wms/guarda.ts
      - src/app/api/wms/guarda/[id]/desfazer/route.ts
    commit: "1407fae"
    tags: [wms, guarda, desfazer, parcial, race-condition, atomicidade, fix-final-b, t12, b10]

