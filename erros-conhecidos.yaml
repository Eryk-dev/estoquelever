  - id: inventario-feed-eventos-fora-de-escopo-2026-05-18
    date: "2026-05-18"
    source: src/app/api/wms/inventario/[id]/eventos/route.ts
    category: business_logic
    message: "Feed ao vivo do supervisor mostrava movs que não tinham relação com o inventário"
    cause: >
      O endpoint filtrava as movimentações apenas por galpao_id + criado_em >= iniciada_em,
      sem restringir ao pool de localizações da sessão (siso_inventario_localizacoes).
      Resultado: pickings de pedido, recebimentos, replenishments e transferências em locs
      fora da sessão apareciam no feed e caíam no fallback de classificação como "amarelo —
      mov em loc ainda não contada", semanticamente errado (a loc nem fazia parte da contagem).
      O bug nasceu no próprio plano (docs/superpowers/plans/2026-05-18-estoque-online.md
      linhas 1477-1484) e foi copiado literal pro código.
    fix: >
      Carregar os localizacao_id da sessão a partir do query de classificação que já
      acontecia e adicionar .in("localizacao_id", locIds) na query de movs. Quando a
      sessão não tem locs, retornar {eventos:[]} sem rodar a query principal.
    files:
      - src/app/api/wms/inventario/[id]/eventos/route.ts
      - docs/api-reference-complete.md
    tags: [wms, inventario, feed-eventos, supervisor, escopo, filtro-loc]

  - id: wms-recebimento-mov-orfa-sem-pendencia-2026-05-19
    date: "2026-05-19"
    source: wms.receber / src/lib/wms/movimentacoes.ts + src/lib/wms/putaway.ts
    category: business_logic
    message: "loc destino não pode ser igual à loc de recebimento (mov fica órfã, sem pendência de guarda)"
    cause: >
      Combinação de 2 bugs:
      (1) sugerirLocalizacaoPutaway tinha fallback que retornava a própria
          loc tipo='recebimento' como destino sugerido quando o SKU era novo
          no galpão. O frontend pré-preenchia destino=RECEBIMENTO e enviava
          ao POST /api/wms/receber.
      (2) receberEstoque chamava inserirMovimentacao (entrada em RECEBIMENTO)
          e só DEPOIS chamava criarPendencia, que então validava
          destino != origem. Sem transação. Quando a validação falhava, a
          mov de entrada já estava gravada, ficando órfã (saldo em
          RECEBIMENTO sem pendência associada na fila /wms/guarda).
      Caso real: SKU 000001 NetAir/CWB, mov dfe144a3 (10 unidades) ficou
      órfã em 2026-05-19 11:55:35.
    fix: >
      (1) sugerirLocalizacaoPutaway: filtra locs tipo='recebimento' dos
          candidatos, remove o fallback que sugeria RECEBIMENTO, e retorna
          null quando não há sugestão (frontend deixa vazio e operador
          decide no tablet).
      (2) receberEstoque: pré-valida localizacao_destino_id != loc RECEBIMENTO
          via função pura validarItensRecebimento ANTES de gravar qualquer
          mov; e envolve a criação da pendência num try/catch que estorna
          a mov automaticamente se a pendência falhar (defesa em profundidade).
      Dado: criada pendência retroativa f571fc4d pra mov dfe144a3.
    files:
      - src/lib/wms/putaway.ts
      - src/lib/wms/movimentacoes.ts
      - src/app/api/wms/receber/route.ts
      - src/app/api/wms/guarda/[id]/route.ts
      - src/lib/wms/putaway.test.ts
      - src/lib/wms/movimentacoes.test.ts
    tags: [wms, receber, guarda, putaway, mov-orfa, pendencia, atomicidade, defense-in-depth]

  - id: 2026-05-20-empresa-dona-dropada
    date: "2026-05-20"
    source: arquitetura
    category: business_logic
    message: "empresa_dona deixou de ser coordenada física"
    cause: >
      Modelo 4D (produto × dona × galpão × loc) não refletia a realidade
      operacional — peças idênticas de empresas diferentes são indistinguíveis
      no físico, mas o schema forçava separação. Resultava em fragmentação
      artificial do estoque, mini-swap necessário antes de cada wave, e
      empréstimo/swap N×N como mecanismos de "conserto" do problema que o
      próprio schema criava. Custo médio quadruplicado (1 por quádrupla) era
      contábilmente errado — auditoria pede 1 custo médio global por SKU.
    fix: >
      Migration 20260520_ledger_simplificado (+ 8 follow-ups a-i) dropou
      empresa_dona_id de siso_estoque e siso_movimentacoes; adicionou
      empresa_compradora_id, empresa_vendedora_id, empresa_referencia_id e
      fornecedor_id como TAGS em movs (apuração contábil via report). Criou
      siso_custo_medio (PK produto_id) como cache global. Dropou tabelas
      siso_emprestimo_regras + siso_wms_mini_swap_config + RPCs
      wms_executar_mini_swap/swap/saldos_devedores. Reescreveu
      wms_inserir_movimentacao (lock por tripla + recalcula custo médio),
      wms_reservar_atomico, wms_inventario_proxima_loc/sugerir,
      wms_detectar_divergencias_estoque, wms_rebuild_linha_estoque. Recriou
      MVs siso_curva_abc + siso_cobertura_estoque em 3D. Frontend:
      QuadruplaPicker → TriplaPicker, deletou /wms/emprestimos +
      /wms/configuracoes/otimizacoes, adicionou /wms/relatorios/* (3
      endpoints + páginas: movs-por-empresa, historico-custo,
      saldos-por-empresa). Lib: 6 arquivos movidos pra _archive/
      (emprestimos.ts, mini-swap.ts, mini-swap-types.ts, etc), types
