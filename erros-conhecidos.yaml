    cause: >
      Operador bipa loc errada → guarda confirmada (par S+E grava saldo
      na loc errada). Não havia botão "desfazer última guarda". Caminho
      anterior era abrir ticket pra DBA.
    fix: >
      Novo endpoint `POST /api/wms/guarda/[id]/desfazer`. Estorna o par
      S+E mais recente da pendência, decrementa `qty_guardada`, restaura
      status (`em_guarda` ou `pendente`).
      Limitação MVP: só estorna a guarda mais recente. Pra desfazer
      intermediárias, chamar repetidamente.
