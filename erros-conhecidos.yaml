  - id: wms-fase3-2-reserva-parcial-quebra-pick
    date: "2026-05-29"
    source: src/app/api/wms/pedidos/aprovar/route.ts
    category: business_logic
    message: "Reserva PARCIAL na entrada (aprovar OC reserva o coberto + compra faltante) quebra o pick downstream — REVERTIDA"
    cause: >
      A feature 'parcial na entrada' (reservar coberto por-unidade + OC do faltante)
      cria uma R parcial/multi-loc (ex.: R=2 num item de qty=5). Mas TODO o pick
      downstream assume R == qty cheia do item, em UMA loc, fonte ÚNICA:
      - marcar-item/wms_pick_item_atomico libera a qty cheia (5) contra a R(2) →
        wms_inserir_movimentacao estoura 'liberação excede reservado: 2−5<0' → 409
        → item impossível de pickar, R órfã.
      - validar-oc-item/bipar-checklist (pickMovPicking→liberarReservaPicking) ENGOLE
        o overflow (warn + movSaidaId=null) → item marcado SEM S → saída faltando +
        R órfã + under-ship silencioso (viola a regra de ouro 2×).
      - cross-galpão: R órfã no galpão A é cutoverada enquanto o pick já saiu do
        galpão B → DUPLA saída S (coberto deduzido 2×).
      - itens de OC recebidos caem em RECEBIMENTO (sem putaway no resume) → estoque
        do item fica fragmentado (coberto loc A + recebido loc X), e o pick é
        single-loc → falha mesmo sem reserva.
      9 findings confirmados empiricamente em staging por review adversarial.
    fix: >
      REVERTIDA (git checkout HEAD nos 2 arquivos + delete do cenário 70). O estado
      pré-feature (OC sem reserva; faltante via disponível-vivo; pick S-only live)
      funciona pro caso comum. O fix CORRETO exige reescrever o pick pra suportar:
      (a) R parcial (cap do L em reservado), (b) R multi-loc (consumir N reservas),
      (c) pick multi-fonte (loc-reservada-coberta + loc-OC-recebida), (d) coordenação
      cross-galpão, (e) cutover/cleanup de reservas parciais. É um projeto na trilha
      crítica de invariante — fazer com design dedicado + suite completa, não inline.
    files:
      - src/app/api/wms/pedidos/aprovar/route.ts
      - src/lib/execution-worker.ts
      - src/lib/wms/separacao/pick-mov.ts
      - src/lib/wms/reservas-picking.ts
      - src/app/api/wms/separacao/validar-oc-item/route.ts
    tags: [oc, reserva-parcial, pick, invariante, fase3-2, multi-fonte, revertido, diagnosticado-nao-corrigido]

  - id: webhook-wms-itens-nao-gravados-colunas-legadas-dropadas
    date: "2026-05-29"
    source: webhook-processor-wms (deploy defasado)
    category: database
    message: "column \"estoque_cwb_saldo\" of relation \"siso_pedido_itens\" does not exist (42703) — engolido no upsert de item"
    cause: >
      70 pedidos da EasyPeasy salvaram SEM itens (apareciam "sem produto" na UI) e
      caíram todos em OC ("Sem cobertura de estoque"). Duas causas somadas:
      (1) O deploy do Vercel estava preso num commit antigo (~71d5370, 28/05) porque
          o build da develop quebrou desde 93dea14 (import órfão
          @/lib/wms/galpoes-com-saldo nunca commitado). O código publicado ainda
          escrevia as colunas legadas estoque_cwb_*/sp_*, cwb_atende, sp_atende,
          localizacao_cwb/sp no upsert de item — colunas já DROPADAS do schema
          (Fix-D T10). Cada insert falhava com 42703.
      (2) O loop do passo 6 (siso_pedido_itens upsert) NÃO checava o erro do
          .upsert() (diferente do upsert do pedido), então o 42703 era engolido:
          cabeçalho do pedido salvava, itens sumiam, processamento seguia "concluído".
      Sem itens → itensPraRotear vazio → rota=oc. (Independentemente, o ledger WMS
      está ~vazio, então mesmo com itens a sugestão seria OC.)
    fix: >
      (a) commit af5a578 — commita o arquivo órfão galpoes-com-saldo.ts (destrava o
          build → o deploy passa a publicar o código atual, que não escreve colunas
          legadas).
      (b) commit c75d81e — passo 6 captura `{ error: itemErr }` e dá throw (espelha o
          pedidoErr). Pedido sem item nunca mais é persistido em silêncio; o webhook
          falha (status=erro, retry).
      (c) backfill SQL dos 70 pedidos pendentes: re-derivou itens do payload_original
