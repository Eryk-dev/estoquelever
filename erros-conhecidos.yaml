  - id: p3-fix-8.6-reconciliar-retroativo-uuid
    date: "2026-05-27"
    source: wms.lancamento-retroativo.reconciliar
    category: validation
    message: 'reconciliar aceitava UUIDs inválidos/inexistentes e RPC levantava 23502/23503'
    cause: >
      Endpoint chamava a RPC direto com `[id]` (do path) e `compra_mov_id`
      (do body) sem validar formato UUID nem existência das movs. Erros
      do Postgres (23502 NOT NULL violation, 23503 FK violation) vinham
