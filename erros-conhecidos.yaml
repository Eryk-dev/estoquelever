      Fix-Final-B T7 (B6) planejou corrigir mensagens de erro que pudessem
      apontar pra uma rota de UI inexistente (ex: "use /desfazer-parcial pra reverter").
      O plano indicou que o exemplo era hipotético, não confirmado.
    fix: >
      Verificação independente completa. grep -rn em src/ para
      "desfazer-parcial|desfazer.parcial", "error:.*desfazer",
      "use.*/desfazer", "abra.*desfazer", "desfazer-parcial.*pra" e
      leitura de todos os arquivos relevantes confirmaram:

      1. src/app/api/wms/separacao/desfazer-parcial/route.ts — existe e funciona.
         Rota real em POST /api/wms/separacao/desfazer-parcial. Mensagens de erro
         descrevem estado ("item não está em estado parcial", "não pode desfazer —
         alguma realocação já foi picada") — corretas, sem URL recomendada.

      2. src/app/api/wms/separacao/cancelar/route.ts:149 — comentário de código
         para DEVs: "/api/wms/separacao/desfazer-parcial (fluxo explícito)".
         Correto (rota existe) e é comentário interno, não mensagem de usuário.

      3. src/app/api/wms/separacao/marcar-item/route.ts:197 — comentário:
         "desfazer-parcial / cancelar usam essas linhas pra estornar tudo".
         Correto, comentário interno.

      4. src/app/api/wms/separacao/parcial/route.ts:614 — comentário referenciando
         a rota. Correto, interno.

      5. src/components/wms/separacao/parcial-modal.tsx — zero referências a
         "desfazer" ou qualquer rota. Componente apenas gerencia qty + locZerou.

      6. src/lib/wms/guarda.ts:565 — "MVP: desfazer parcial não suportado. Omita qty
         pra desfazer toda a guarda atual." Contexto diferente (put-away undo),
         sem referência a URL. Não é do módulo de separação.

      7. src/lib/wms/reservas-picking.ts:171 — comentário técnico sobre o
         desfazer-parcial. Correto, interno.

      Conclusão: nenhuma mensagem user-facing incorreta. Nenhuma ação necessária.
