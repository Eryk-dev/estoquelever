  - id: wms-fix-final-a-2.15-gating-concluir-oc
    date: "2026-05-27"
    source: src/app/api/wms/separacao/concluir-oc/route.ts
    category: business_logic
    message: "dupla baixa OC — worker legado + cutover ledger geram 2 saídas pro mesmo pedido"
    cause: >
      O gating original (!wmsAsSource() em volta do enqueue lancar_estoque) foi
      revertido em c349ead porque achava-se que quebrava NF. Sem o gate, em
      WMS_AS_SOURCE rodavam: (a) worker legado escrevendo em
      siso_pedido_item_estoques (deprecated), (b) dispararCutoverSePronto
      escrevendo no ledger 3D. Resultado: saldo decrementado 2x.
    fix: >
      Re-aplica !wmsAsSource() gate em volta do enqueue lancar_estoque. A
      preocupação com NF não procede: dispararCutoverSePronto retorna
      motivo='sem_nf' quando a NF ainda não chegou; nf-webhook-handler chama
      o helper de novo quando NF aparece, completando o cutover sem buracos.
    files:
      - src/app/api/wms/separacao/concluir-oc/route.ts
    tags: [wms, concluir-oc, dupla-baixa, cutover, nf, fix-final-a]

  - id: wms-fix-final-a-2.6-desfazer-encontrei
    date: "2026-05-27"
    source: src/app/api/wms/separacao/validar-oc-item/route.ts
    category: business_logic
    message: "desfazer_encontrei deixa saldo decrementado — não estorna mov S"
    cause: >
      O fix #2.6 fez "encontrei" emitir mov S nf_venda e persistir
      mov_saida_id no item. Mas o branch desfazer_encontrei só restaurava
      compra_status='oc_pendente' sem reverter a mov S — saldo ficava
      permanentemente decrementado. Mitigação anterior: o cancelar/
      desfazer-parcial estornava via mov_saida_id se o pedido fosse
      cancelado depois. Sem cancelamento, residual ficava no ledger.
    fix: >
      Branch desfazer_encontrei agora chama estornarMovimentacao(mov_saida_id)
      ANTES de limpar campos, e reseta mov_saida_id/quantidade_pega/
      separacao_parcial/parcial_motivo no UPDATE. Se mov_saida_id=null (modo
      legacy ou WMS_AS_SOURCE off no momento do encontrei), apenas limpa
      campos (estorno não-aplicável).
    files:
      - src/app/api/wms/separacao/validar-oc-item/route.ts
    tags: [wms, separacao, validar-oc-item, desfazer-encontrei, estorno, fix-final-a]

  - id: wms-fix-final-a-2.7-localizacao-com-reservas
    date: "2026-05-27"
    source: src/app/api/wms/separacao/localizacao/route.ts
    category: business_logic
    message: "transferencia_localizacao falha quando reservado>0 (validarCoerencia)"
    cause: >
      POST /api/wms/separacao/localizacao tenta mover saldo de uma loc origem
      via mov S+E. Quando a loc origem tem Rs ativas (reservado>0), a S
      decrementa saldo pra 0 mas reservado fica > 0 → validarCoerencia
      rejeita (reservado_posterior > saldo_posterior). Catch silencioso
      absorvia + logava warn; movimento perdia transferência (TODO #2.7-followup).
    fix: >
      Refator do handler em 4 etapas: (1) filtra Rs ativas não-estornadas
      e não-expiradas na loc origem; (2) estorna via estornarReservaIndividual
      (motivo='localizacao_move') preservando TTL e pedido_id; (3) faz par
      S+E como antes; (4) reemite Rs no destino via reservarAtomico com
      TTL recalculado. EstornarReservaInput ganhou motivo 'localizacao_move'.
    files:
      - src/app/api/wms/separacao/localizacao/route.ts
      - src/lib/wms/reservas.ts
    tags: [wms, separacao, localizacao, reservas, transferencia_localizacao, fix-final-a]

  - id: wms-fix-final-a-a4-marcar-item-transferencia
    date: "2026-05-27"
    source: scripts/wms/cenarios/catalogo/02-pedido-transferencia.ts
    category: business_logic
    message: "patch SQL workaround nos cenários 02/03 — marcar-item resolvia loc errada em transferência"
    cause: >
      No fluxo transferência, pedido nasce em NetAir (empresa origem) mas é
      separado em SP (separacao_galpao_id=SP). marcar-item filtrava
      siso_pedido_item_estoques por empresa_id=NetAir, que tinha
      localizacao=null (saldo zero em CWB no momento do webhook). Fallback
      antigo caía em DEFAULT-PICKING e falhava (DEFAULT-PICKING não existia
      em SP). Cenários 02/03 patchavam manualmente a linha do snapshot.
    fix: >
      Hoje DEFAULT-PICKING existe em CWB+SP (seed P6). Fallback
      buscarLocComMaiorSaldoNoGalpao(separacao_galpao_id, produtoWmsId)
      encontra a loc real. Helper resolveSeparacaoGalpao (T4) formaliza
      o contrato pra uso futuro. Patches SQL removidos dos cenários 02/03 —
      vão re-rodar em T31 sem o workaround.
    files:
      - scripts/wms/cenarios/catalogo/02-pedido-transferencia.ts
      - scripts/wms/cenarios/catalogo/03-pedido-oc-completo.ts
      - src/lib/separacao/wms-mapping.ts
    tags: [wms, separacao, transferencia, marcar-item, default-picking, fix-final-a]

  - id: wms-fix-final-a-a5-endpoint-estornar
    date: "2026-05-27"
    source: src/app/api/wms/pedidos/[id]/estornar/route.ts
    category: business_logic
    message: "Banner D10 'Estornar agora' não tinha endpoint — admin não conseguia estornar pedido"
    cause: >
      A UI já mostrava Banner D10 com botão 'Estornar agora' pra admin,
      mas o onClick chamava toast.error('não implementado'). Não havia
      endpoint pra estornar todas as movs (S+R) de um pedido em massa.
    fix: >
      Cria POST /api/wms/pedidos/[id]/estornar (admin-only via perm
      pedidos.estornar). Lista todas movs S/R ativas do pedido, estorna
      cada uma (estornarMovimentacao pra S, estornarReservaIndividual
      pra R), marca status_separacao='cancelado', registra evento
      estorno_manual_admin. Botão D10 chama mutation real.
