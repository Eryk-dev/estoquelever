      auto-manda pra Compras: deixa em_separacao e retorna tem_em_outro_galpao +
      galpoes_alternativos (encaminhar-first, backend da Mudança 1). Só vai direto
      pra Compras quando não há saldo em galpão nenhum (cenário 61). Helper novo
      galpoesComSaldo (estoque vivo).
