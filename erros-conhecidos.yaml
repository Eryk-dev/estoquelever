      Pura calcularNecessidadeSkuPorGalpao (src/lib/compras-sourcing.ts): neta
      demanda/livre/trânsito POR GALPÃO (cada galpão clampado em ≥0) e SOMA. Excesso
      num galpão não compensa falta em outro. carregarContextoNecessidade passou a
      acumular por galpão (siso_pedidos.separacao_galpao_id + siso_estoque.galpao_id);
      fetchComprar chama a pura por SKU. Coberto por compras-sourcing.test.ts.
