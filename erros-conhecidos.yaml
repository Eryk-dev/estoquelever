  - id: p3-fix-2.7-marcar-item-desmarcar-ordem
    date: "2026-05-27"
    source: wms.separacao.marcar-item
    category: business_logic
    message: 'desmarcar item violava invariante I2 (saldo_anterior+delta=saldo_posterior)'
    cause: >
      Desmarcar item estornava na ordem (1) leg L (estorno de
      liberação_reserva → recria R) e (2) leg S (estorno de nf_venda).
      Mas a leg L recriava R no saldo que a S ainda ocupava — saldo
      momentaneamente reservava mais do que disponível.
    fix: >
      Inverte ordem: estorna leg S primeiro (sai do estoque), depois leg L
      (recria R agora com saldo livre). Sequência paritária e invariante-safe.
