      saldo 0; busca/bipe não achavam pelo SKU do substituto (EW004.309).
    cause: >
      A separação resolvia loc/saldo e o match do bipe pelo SKU VENDIDO do item
      (item.sku, intocado por D3). Só o caminho de ESCRITA (marcar-item/
      bipar-checklist pick) resolvia o produto efetivo via produto_wms_substituto_id;
      o caminho de EXIBIÇÃO (checklist-items) e o MATCH do bipe não. GE5307 não
      tem estoque (foi pra OC), então o picker via "sem loc, saldo 0" e não sabia
      pegar EW004.309. Afeta TODO pedido com troca que chega na separação (auto,
      roteamento, compras) — não estava na lista de "callers que resolvem produto
      efetivo" do plano cross-troca (faltou o caminho de display/match).
    fix: >
      checklist-items passa a EXIBIR o substituto COMO o item — sobrescreve
      sku/gtin/descricao/imagem_url/localizacao/saldo pelos do substituto
