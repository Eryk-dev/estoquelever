      - src/lib/compras-sourcing.test.ts
      - src/app/api/wms/compras/route.ts
    tags: [wms, compras, necessidade, em-transito, por-galpao, G3, calcularNecessidadeSkuPorGalpao, fetchComprar]
    notes: >
      A quantidade resultante é só SUGESTÃO — o comprador edita na tela quantas
      unidades vai comprar (sem MOQ/caixa/múltiplo, decisão 2026-06-18).

