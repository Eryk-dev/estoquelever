# ============================================================
# SISO — Erros Conhecidos e Corrigidos
#
# Este arquivo serve como base de conhecimento para diagnostico
# rapido de erros recorrentes. Sempre que um erro for corrigido,
# adicione uma entrada aqui seguindo o formato abaixo.
#
# Para consultar: grep por message, source, category ou tags.
# ============================================================

# Formato de cada entrada:
# - id: identificador curto e unico (kebab-case)
#   date: YYYY-MM-DD da correcao
#   source: modulo que gerou o erro (webhook, processor, worker, etiqueta-service, oauth, etc)
#   category: validation | database | external_api | auth | config | business_logic | infrastructure
#   message: mensagem do erro (como aparece nos logs)
#   cause: causa raiz identificada
#   fix: o que foi feito para corrigir
#   files: lista de arquivos alterados
#   commit: hash do commit (opcional)
#   tags: palavras-chave para busca rapida
#   notes: observacoes adicionais (opcional)

erros:
  - id: wms-inventario-aprovar-nao-libera-locks
    date: "2026-05-11"
    source: wms.inventario.aprovar
    category: business_logic
    message: "uq_loc_lock_ativo violation ao iniciar nova sessão de inventário"
    cause: >
      aprovarSessao() em src/lib/wms/inventario.ts só mudava o status pra
      'aprovada' — não tocava em siso_localizacao_locks. Locks eram criados
      em iniciarSessao() e só liberados em aplicarSessao(). Resultado:
      sessões com status='aprovada' mas 'não aplicada' (cenário comum em
      review/aprovação manual de divergências) bloqueavam novas sessões
      nas mesmas localizações via UNIQUE(localizacao_id) WHERE finalizado_em IS NULL.
    fix: >
      aprovarSessao() agora libera os locks externos. Aplicação (gerar movs)
      passou a ser só ato contábil, não precisa segurar lock. aplicarSessao()
      mantém a liberação (idempotente: WHERE finalizado_em IS NULL).
      Locks órfãos da sessão 6a027ed3 foram liberados manualmente no banco
      via UPDATE.
    files:
      - src/lib/wms/inventario.ts
    tags: [wms, inventario, locks, uq_loc_lock_ativo, aprovar, aplicar, anti-colisao]

  - id: wms-api-errors-object-object-on-postgrest
    date: "2026-05-11"
    source: wms.api-errors
    category: business_logic
    message: "Toasts WMS mostram '[object Object]' em vez da mensagem de erro real"
    cause: >
      wmsErrorResponse() em src/lib/wms/api-errors.ts extraía mensagem com
      `opts.error instanceof Error ? opts.error.message : String(opts.error)`.
      PostgrestError do Supabase é um plain object com .message — NÃO é Error
      instance. Caia em String(obj) que vira "[object Object]". O client
      recebia { error: "[object Object]" }, useMutation.onError mostrava o
      texto literal em vez da mensagem (ex: "duplicate key value violates
      unique constraint ...").
    fix: >
      Adicionado helper extractErrorMessage(e) que detecta Error, depois
      objeto com .message: string (PostgrestError, response.error do Supabase,
      etc), e por último String(). Mensagens reais agora chegam no client.
    files:
      - src/lib/wms/api-errors.ts
    tags: [wms, error-handling, postgrest, supabase, toast, object-object, logger]
    notes: >
      Mesmo padrão pode aparecer em outros helpers de erro (não WMS) que usam
      instanceof Error como única extração. Auditar futuramente.

  - id: wms-galpoes-dropdown-vazio-shape-mismatch
    date: "2026-05-11"
    source: wms.galpoes-fetch
    category: business_logic
    message: "Dropdowns de galpão/empresa vazios em /wms/inventario, /wms/localizacoes, /wms/replenishment, /wms/emprestimos e QuadruplaPicker — bloqueia criar inventário, escolher localização etc."
    cause: >
      Bug duplo de shape entre /api/admin/galpoes (servidor) e consumidores WMS (cliente).
      (1) API retorna array de galpões direto (NextResponse.json(result)) mas 5 componentes
      WMS tipavam como wmsApi<{ galpoes?: GalpaoRow[] }> e acessavam data?.galpoes — sempre
      undefined. (2) Mesmo se acessasse o array, os componentes que precisam de empresas
      esperavam g.empresas mas a API retorna g.siso_empresas (mantido pra compat com
      /configuracoes que usa siso_empresas direto). Só src/components/wms/ui/modals.tsx
      consumia corretamente porque tinha mapeamento explícito siso_empresas → empresas.
    fix: >
      Todos os 5 consumidores agora tipam wmsApi<GalpaoRow[]> (array direto). Os 3 que
      precisam de empresas (replenishment, emprestimos, quadrupla-picker) fazem mapeamento
      inline na queryFn (siso_empresas → empresas, filtrando empresas inativas) — mesma
      transformação que useGalpoes() em modals.tsx já fazia. inventario e localizacoes só
      precisam de id/nome do galpão, então não fazem mapeamento.
    files:
      - src/app/wms/inventario/page.tsx
      - src/app/wms/localizacoes/page.tsx
      - src/app/wms/replenishment/page.tsx
      - src/app/wms/emprestimos/page.tsx
      - src/components/wms/quadrupla-picker.tsx
    tags: [wms, galpoes, empresas, dropdown, shape-mismatch, postgrest, siso_empresas, inventario, replenishment, emprestimos, quadrupla-picker]
    notes: >
      Refactor futuro: extrair useGalpoes() de modals.tsx pra um arquivo de hooks
      compartilhado (ex: src/lib/wms/hooks.ts) e usar nos 5 consumidores. Eliminaria
      duplicação do mapeamento siso_empresas → empresas. Não feito agora pra manter
      escopo do fix mínimo.

  - id: wms-estoque-drawer-not-opens-from-cmdk
    date: "2026-05-11"
    source: wms.estoque.page
    category: business_logic
    message: "Drawer do produto não abre ao clicar em produto no Cmd+K quando já estamos em /wms/estoque"
    cause: >
      EstoquePage inicializava drawerProdutoId via useState(initialProduto), onde
      initialProduto = searchParams?.get("produto"). useState só usa o valor na PRIMEIRA
      render. Quando o usuário já está em /wms/estoque e clica num produto no Cmd+K,
      router.push muda a URL pra ?produto=X mas o componente não remonta — initialProduto
      recalcula pra X mas useState ignora, drawerProdutoId continua null. Funcionava
      quando o usuário vinha de outra página (fresh mount).
    fix: >
      Trocou state mirror por derived state: drawerProdutoId = initialProduto ?? localProdutoId.
      URL tem precedência (Cmd+K e links externos), state local lida com cliques em linhas
      da tabela (que não mudam URL). No close, limpa state local e router.replace se veio
      de query. Padrão correto em React — não espelhar prop/url em state.
    files:
      - src/app/wms/estoque/page.tsx
    tags: [wms, estoque, drawer, cmd-k, useState, useSearchParams, derived-state, react-hooks]
    notes: >
      Regra do ESLint react-hooks/set-state-in-effect (Next 16) bloqueia a alternativa
      ingênua de usar useEffect pra sincronizar. Derived state é a abordagem correta.

  - id: wms-ledger-empresa-fk-ambiguity
    date: "2026-05-11"
    source: wms.ledger
    category: database
    message: "Could not embed because more than one relationship was found for 'siso_movimentacoes' and 'siso_empresas'"
    cause: >
      Plano 3 (roteamento) adicionou a coluna emprestimo_devedora_id em siso_movimentacoes
      referenciando siso_empresas, criando ambiguidade — siso_movimentacoes passou a ter
      DUAS FKs pra siso_empresas (empresa_dona_id + emprestimo_devedora_id). As queries
      PostgREST que faziam embed implícito (empresa:siso_empresas(nome)) começaram a
      retornar 400 porque o PostgREST não sabe qual FK usar. Movimentações continuavam
      sendo gravadas no DB normalmente, mas a tela /wms/ledger ficava vazia e
      listarRetroativosPendentes() falhava.
    fix: >
      Qualificar explicitamente a coluna FK na sintaxe embedded do PostgREST:
      siso_empresas!empresa_dona_id(nome). Aplicado em /api/wms/ledger e em
      listarRetroativosPendentes (lib/wms/movimentacoes.ts).
    files:
      - src/app/api/wms/ledger/route.ts
      - src/lib/wms/movimentacoes.ts
    tags: [wms, ledger, postgrest, embed, fk-ambiguity, siso_movimentacoes, siso_empresas, emprestimo_devedora_id, plano-3]
    notes: >
      Quando adicionar uma nova coluna FK pra siso_empresas em outras tabelas WMS,
      conferir todos os .select() que fazem embed dessa tabela e qualificar a FK.
      Verificado em 2026-05-11: apenas siso_movimentacoes tem múltiplas FKs pra siso_empresas.

  - id: embalagem-hidden-items-block-completion
    date: "2026-03-18"
    source: confirmar-item-embalagem
    category: business_logic
    message: "Pedido never reaches pedido_completo=true despite all visible items completed"
    cause: >
      The pending items count in confirmar-item-embalagem counted ALL items
      (including indisponivel/cancelado), but checklist-items hides those from
      the UI. User completes all visible items but backend still sees pending
      items, so pedido_completo stays false, no label prints, no toast shown.
      Same issue in siso_processar_bip_embalagem RPC (excluded cancelado but
      not indisponivel). Also separacao route total_itens included indisponivel
      items, showing wrong progress (e.g. 3/4 when only 3 items visible).
    fix: >
      Added NOT IN ('indisponivel','cancelado') filter to pending count in
      confirmar-item-embalagem. Updated siso_processar_bip_embalagem RPC to
      exclude indisponivel in both item search and pending count. Fixed
      separacao route to skip indisponivel items in item stats.
    files:
      - src/app/api/separacao/confirmar-item-embalagem/route.ts
      - src/app/api/separacao/route.ts
      - supabase/migrations/20260318_fix_embalagem_hidden_items_count.sql
    tags: [embalagem, etiqueta, indisponivel, cancelado, pedido_completo, hidden-items, compra_status]

