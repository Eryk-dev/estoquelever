  - id: embalagem-card-foco-some-ao-completar
    date: "2026-06-22"
    source: src/app/wms/separacao/embalagem/page.tsx
    category: business_logic
    message: >
      No checklist de embalagem, ao bipar e completar o pedido (ex.: pedido de
      1 item, completa no 1º bipe) o card-foco subia ao topo e logo sumia da
      lista, sem permanecer aberto nem permitir reimprimir a etiqueta.
    cause: >
      O card-foco e a seção "Embalados" derivam de pedidosOrdenados, que vem da
      query /api/wms/separacao?status_separacao=separado. Ao completar, o pedido
      vira "embalado" no banco; a query refaz e dropa o pedido, então focoPedido
      fica undefined e some. O completedIdsRef (que deveria manter visível)
      filtrava de pedidosOrdenados — dado que já tinha saído.
    fix: >
      Snapshot client-side por id (pedidosVistosRef): captura todo pedido visto
      na query e, ao completar, carimba "embalado"; pedidosOrdenados usa o
      snapshot quando o GET (status=separado) para de retornar o pedido. NÃO
      alargar a query pra incluir embalado — 1ª tentativa fez isso e quebrou a
      tela (ver embalagem-incluir-embalado-estoura-limite). Bip que completa não
      entra no Set expanded (card-foco abre via prop; desce fechado no próximo
      bipe). Card concluído: borda-esquerda verde; botão Reimprimir: ícone
      download→printer.
    files:
      - src/app/wms/separacao/embalagem/page.tsx
    tags: [separacao, embalagem, ui, realtime]

  - id: embalagem-incluir-embalado-estoura-limite
