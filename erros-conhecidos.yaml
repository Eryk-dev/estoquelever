    message: "Cron quebrava 100% das execuções com ERROR: Out of memory"
    cause: >
      Migration 20260527_cron_transferencias_em_transito_cleanup usava
      current_setting('app.base_url', true) e current_setting('app.worker_secret', true).
      Supabase staging bloqueia ALTER DATABASE/ROLE pra GUCs custom, então essas
      chamadas retornam NULL. concat(NULL, ...) propaga NULL → net.http_get(NULL,...)
