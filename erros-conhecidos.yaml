  - id: p3-fix-5.2-iniciar-guarda-race
    date: "2026-05-27"
    source: wms.guarda.iniciar
    category: business_logic
    message: '2 operadores conseguiam iniciar a mesma pendência → guarda dupla'
    cause: >
      `iniciarGuarda` fazia SELECT (status='pendente'?) + UPDATE. Dois
      operadores chegando juntos passavam ambos no SELECT. Resultado:
      dupla guarda do mesmo SKU/qty.
    fix: >
      Agora usa UPDATE condicional `WHERE status='pendente'`. Apenas a 1ª
      requisição muda 1 linha; a 2ª recebe 0 linhas → 409
      PENDENCIA_OUTRA_GUARDA. Idempotente se o caller já é o iniciada_por.
    files:
      - src/app/api/wms/guarda/[id]/iniciar/route.ts
      - src/lib/wms/guarda.ts
    tags: [wms, guarda, iniciar, anti-race, conflict, p3]

  - id: p3-fix-5.3-5.8-confirmar-guarda-nao-atomico
    date: "2026-05-27"
    source: wms.guarda.confirmar
    category: infrastructure
    message: 'confirmar guarda era TS multi-step (mov + UPDATE) — crash deixava estado fantasma'
    cause: >
      `confirmarGuarda` fazia (1) `replenishmentIntraGalpao` (que insere par
      S+E) e (2) UPDATE da pendência (qty_guardada+=qty, status final).
      Crash entre 1 e 2 deixava saldo movido mas pendência intacta —
      operador reentrava na mesma pendência e duplicava a guarda.
    fix: >
      Nova RPC SQL `wms_confirmar_guarda_atomico` faz mov par S+E
      (via 2 chamadas a `wms_inserir_movimentacao`) + UPDATE da pendência
      numa transação única. Endpoint passa a invocar a RPC. Tudo ou nada.
    files:
      - supabase/migrations/20260527_p3_rpc_wms_confirmar_guarda_atomico.sql
      - src/lib/wms/guarda.ts
    tags: [wms, guarda, confirmar, atomico, rpc, p3]

