- id: ENCONTREI-OC-PRE-BIPA-EMBALAGEM
  date: 2026-06-12
  source: validar-oc-item / cancelar
  category: business_logic
  message: "Pedido cai na aba Separados já 'Bipado'; bip da embalagem retorna 'já bipado' e a etiqueta nunca sai — operador precisa reiniciar embalagem e re-bipar (pedido #51261)"
  cause: >
    Duas fontes do bip fantasma: (a) validar-oc-item ação "encontrei"
    (desde eddf2e1) setava bipado_completo=true +
