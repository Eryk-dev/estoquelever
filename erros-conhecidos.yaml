    Item OC continua no balde "Itens OC — validar" mesmo com saldo livre que
    cobre o pedido. Ex: ACD003, loc A-01-2 (picking) disponível 17, mas 4 pedidos
    seguem compra_status='oc_pendente' / decisao_final='oc'.
