  - id: wms-fix-final-c-t17-desfazer-guarda-atomico-rpc
    date: "2026-05-27"
    source: supabase/migrations/20260530_p3_rpc_wms_desfazer_guarda_atomico.sql + src/lib/wms/guarda.ts
    category: business_logic
    message: "Race em desfazerGuarda fechada via RPC atômico — Concern A do Fix-B audit"
    cause: >
      desfazerGuarda em src/lib/wms/guarda.ts (introduzido em Fix-B T12)
      lia pendência → loop chamando inserirMovimentacao 2x por par S+E →
      UPDATE pendência. Sem FOR UPDATE no row da pendência, 2 calls
      concorrentes de desfazer (ou um confirmar+desfazer simultâneo) liam
      o mesmo qty_guardada, ambas decrementavam, e o UPDATE final ficava
      com o valor da última a escrever — over-decremento. Mesmo concern
      já documentado na entrada wms-fix-final-b-t12-desfazer-guarda-parcial.
    fix: >
      Migration cria wms_desfazer_guarda_atomico RPC espelhando estrutura
      de wms_confirmar_guarda_atomico (P3): SELECT FOR UPDATE no row da
      pendência → validações dentro do RPC → loop PERFORM
      wms_inserir_movimentacao 2x → UPDATE final no mesmo lock.
      desfazerGuarda em TS vira shim que chama o RPC e mapeia resposta.
      Imports órfãos randomUUID + inserirMovimentacao removidos.
    files:
      - supabase/migrations/20260530_p3_rpc_wms_desfazer_guarda_atomico.sql
      - src/lib/wms/guarda.ts
    commit: "8eb445d"
    tags: [wms, guarda, desfazer, atomic, rpc, race-condition, lock, fix-final-c, t17, concern-a, fix-b-audit]

