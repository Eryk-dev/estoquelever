# =====================================================# SISO — Erros Conhecidos e Corrigidos
#
# Este arquivo serve como base de conhecimento para diagnostico
# rapido de erros recorrentes. Sempre que um erro for corrigido,
# adicione uma entrada aqui seguindo o formato abaixo.
#
# Para consultar: grep por message, source, category ou tags.
# ==============================================
# Formato de cada entrada:
# - id: identificador curto e unico (kebab-case)
#   date: YYYY-MM-DD da correcao
#   source: modulo que gerou o erro (webhook, processor, worker, etiqueta-service, oauth, etc)
#   category: validation | database | external_api | auth | config | business_logic | infrastructure
#   message: mensagem do erro (como aparece nos logs)
#   cause: causa raiz identificada
#   fix: o que foi feito para corrigir
#   files: lista de arquivos alterados
#   commit: hash do commit (opcional)
#   tags: palavras-chave para busca rapida
#   notes: observacoes adicionais (opcional)

erros:
  - id: nf-rejeitada-empurra-pedido-pra-separacao
    date: "2026-06-15"
    source: worker / nf-webhook-handler
    category: business_logic
    message: >
      pedidos com NF NÃO autorizada (rejeitada, situacao=5) apareciam pra
      separar — "robô" de NFs empurrava pedido OC pra frente sem NF autorizada
      (ex: Josiani Bortoli / Luiz Crippa, NFs EasyPeasy situacao=5)
    cause: >
      enriquecerDadosNf (execution-worker.ts) calculava
      `autorizada = situacao∈{6,7}` mas NUNCA usava a variável: salvava
      chave_acesso_nf só checando `if (nfData.chaveAcesso)`. A chave de acesso é
      calculada na EMISSÃO (existe até numa NF rejeitada/pendente), então o
      pedido ficava com nota_fiscal_id + chave_acesso_nf preenchidos e PARECIA
      ter NF autorizada — entrava em validacao_oc/aguardando_separacao e era
      puxado pra wave de picking. handleNfWebhook também nunca checava a situacao
      da NF antes de transicionar aguardando_nf → aguardando_separacao.
    fix: >
      (1) enriquecerDadosNf: só persiste chave_acesso_nf quando `autorizada`
      (usa a variável que era dead code). (2) handleNfWebhook: gate Step 4.5 —
      só salva chave + transiciona se a NF estiver autorizada (situacao 6/7),
      buscando a situacao também no fast-path; não-autorizada vira log
      'aguardando_autorizacao' (sem processado_em, retryable). (3)
      pollNotasAutorizadas re-entrega logs 'aguardando_autorizacao' (além de
      'aguardando_pedido') pra quando a NF autorizar depois. Cleanup: pedidos
      separáveis com NF não-autorizada revertidos pra aguardando_nf +
      chave_acesso_nf limpa.
    files:
      - src/lib/execution-worker.ts
      - src/lib/nf-webhook-handler.ts
      - src/lib/tiny-polling.ts
    tags: [nf, nota-fiscal, situacao, autorizada, rejeitada, chave_acesso_nf, separacao, validacao_oc, oc, enriquecerDadosNf, handleNfWebhook, polling, sefaz]
    notes: >
      Códigos situacao NF Tiny (GET /notas/{id}, BaseNotaFiscalModel): 1=Pendente
      2=Emitida 3=Cancelada 4=Enviada Aguardando Recibo 5=Rejeitada 6=Autorizada
      7=Emitida Danfe 8=Registrada 9=Enviada Aguardando Protocolo 10=Denegada.
      Tiny retorna situacao como STRING ("5") — usar Number() ao comparar.

  - id: trocar-sku-sem-guard-de-estado
    date: "2026-06-12"
    source: wms.compras
    category: business_logic
    message: >
      troca de SKU permitida em item já separado/com NF — reserva R órfã
      apontando pro produto antigo + NF com produto fantasma
    cause: >
      POST /api/wms/compras/trocar-sku atualizava siso_pedido_itens.produto_id
      sem validar estado: item com picking (quantidade_pega>0/separacao_parcial),
      pedido com estoque_lancado=true ou status_separacao avançado
      (separado/embalado/conferido/expedido) podiam ser trocados, desacoplando
      as movimentações R/L/S (produto antigo) do item (produto novo)
    fix: >
      guard motivoBloqueioEstado() no trocar-sku — item nessas condições entra
      em itens_nao_trocados com motivo claro em vez de ser trocado
    files:
      - src/app/api/wms/compras/trocar-sku/route.ts
    tags: [trocar-sku, compras, reserva-orfa, guard, troca-equivalencia]
    notes: >
      Encontrado durante a implementação da Troca de Equivalência
      (docs/superpowers/plans/2026-06-12-cross-troca-equivalencia.md).
      Pra trocar a PEÇA FÍSICA de um pedido (mantendo NF), usar o fluxo novo
      de trocas (/api/wms/trocas) — produto_wms_substituto_id no item.

  - id: cross-rpc-cluster-skus-ausente-staging
    date: "2026-06-10"
    source: wms.cross
    category: database
    message: >
      módulo cross não funcionava no staging (equivalentes-rápidos, has-cross e
      busca por cluster retornavam vazio/erro) — funcionava na versão de prod
    cause: >
      a RPC siso_cross_cluster_skus (expande cluster de SKUs equivalentes via
      OEM compartilhado + links manuais, recursiva) existia só no banco de PROD
      (wrbrbhuhsaaupqsimkqz); o staging (ehbxpbeijofxtsbezwxd) nunca recebeu a
      function — não havia migration dela no repo. Tabelas e índices do catálogo
      eram idênticos; só a RPC faltava. De quebra, o staging tinha drift de dados:
      5.000 linhas de siso_produto_veiculos (cauda do import bulk de 2026-05-07,
      ids 96948-97948, 111952-113971, 114975-115974, 120985-121987) e 1 linha de
      siso_produto_oems (id 92944) faltando.
    fix: >
      criada migration 20260610e_rpc_siso_cross_cluster_skus.sql portando a
      definição de prod (pg_get_functiondef) e aplicada no staging. Dados
      faltantes copiados de prod via Management API (insert por range de id com
      on conflict do nothing; adicionado_por anulado quando o usuário não existe
      no staging) + setval das sequences. Contagens conferidas: 118.833 veiculos
      e 46.385 oems nos dois bancos.
    files:
      - supabase/migrations/20260610e_rpc_siso_cross_cluster_skus.sql
    tags: [cross, rpc, staging, drift, siso_cross_cluster_skus, catalogo]
    notes: >
      sintoma clássico de "funciona em prod, quebra em staging" = artefato de
      banco criado à mão em prod sem migration. Ao portar módulo que depende de
      RPC, conferir pg_proc nos dois projetos.

