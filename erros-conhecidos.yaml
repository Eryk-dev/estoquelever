  - id: parcial-replay-double-s-idempotencia
    date: "2026-06-23"
    source: separacao-parcial
    category: business_logic
    message: >
      Reenvio do MESMO request de /parcial (timeout+retry / entrega dupla de
      rede) no ramo residual (loc_zerou=false, item fica ABERTO:
      separacao_marcado=false, separacao_parcial=false) passava o guard de
      re-entrada (que só rejeita marcado||parcial) e emitia 2ª saída S (baixa
      dobrada) + inflava quantidade_pega (wms_acumular_qty_pega é UPDATE com
      soma, não-idempotente). loc_zerou=true dobrava o write-off do ajuste.
    cause: >
      Nenhuma deduplicação de request. A S não carregava token de idempotência
      e o acúmulo de quantidade_pega rodava incondicionalmente.
    fix: >
      idempotency_key (uuid v4) client-gerada por clique, enviada no body.
      wms_pick_parcial_atomico +p_idempotency_key: top-check retorna
      ja_aplicado=true se a key já existe; a S (ou o ajuste quando qty_pega=0)
      carrega a key e wms_inserir_movimentacao faz no-op via UNIQUE parcial. O
      route guarda a key no topo (item+realoc) ANTES de liberar R/emitir
      S/acumular; backstop ja_aplicado fecha a janela de concorrência. Como o
      top-check da RPC é um read não-locking, um pg_advisory_xact_lock por key no
      início da RPC SERIALIZA requests com a mesma key — sem ele, sob entrega
      concorrente, o perdedor passava (ja_aplicado=false), a S deduplicava lá
      dentro (no-op), mas o route acumulava quantidade_pega 2x no ramo residual
      (loc_zerou=false pula o Pass A → sem rollback). O caminho
      realocação passou a usar a MESMA RPC (antes 2 inserirMovimentacao diretos)
      pra ganhar o ja_aplicado e evitar cross-contaminação no racePerdida (S
      compartilhada). submittingActionRef + botão disabled já barravam o
      duplo-clique na UI. Validado ao vivo (dado TEST- isolado, rollback): replay
      mesma key = 1 S + saldo debitado 1x; key nova aplica de novo.
    files:
      - supabase/migrations/20260623_pick_parcial_idempotency.sql
      - src/app/api/wms/separacao/parcial/route.ts
      - src/app/wms/separacao/checklist/page.tsx
      - src/app/api/wms/separacao/parcial/idempotency-guard.test.ts
    tags: [parcial, idempotencia, replay, double-s, quantidade-pega, ledger, BUG-09]

  - id: troca-aplicada-beco-sem-saida-desfazer
    date: "2026-06-23"
    source: trocas-equivalencia
    category: business_logic
    message: >
      Após reabrir (voltar-etapa) um pedido com troca de equivalência APLICADA
      (item com produto_wms_substituto_id), o operador não conseguia trocar pra
      um 3º SKU nem voltar ao original: solicitarTroca dava TROCA_JA_APLICADA,
      trocarSubstituto/rejeitar davam TROCA_NAO_PENDENTE. reset-state (de
      propósito) NÃO limpa produto_wms_substituto_id/troca_equivalencia_id — o
      caso normal quer MANTER o substituto pra re-picar a mesma peça.
    cause: >
      Não existia ação pra DESFAZER uma troca já aprovada; todos os caminhos de
      troca exigiam status 'pendente' ou ausência de substituto.
    fix: >
      Ação explícita "desfazer troca aplicada" (só com item reaberto e
      NÃO-picado). RPC wms_desfazer_troca_aplicada_atomico: libera a R
      reserva_pedido viva do substituto LIMITADA à qty do item (quantidade_pedida,
      não-picado), preferindo R(s) que carreguem o troca_id deste item — a R é
      chaveada por (pedido, produto, loc) e a ressuscitada por reset-state perde o
      troca_id, então sem o teto de qty a desfazer de UM item invadiria a R de um
      irmão do mesmo pedido no mesmo produto físico (overselling). Libera a R
      (L liberacao_reserva), limpa os 2 campos
      do item (volta a resolver pro original) e fecha a troca status='desfeita'
      (+CHECK), tudo-ou-nada. Endpoint POST /api/wms/trocas/[id]/desfazer gated
      vendas.aprovar_troca. NÃO recria R no original (item fica sem R; re-roteia
      ou solicita nova troca; o guard de solicitarTroca volta a passar). NÃO mexe
      no reset-state nem no caso comum (item nunca-trocado). Validado ao vivo
      (rollback): happy + guards ITEM_JA_PICADO/PEDIDO_ESTADO_INVALIDO/
      TROCA_NAO_APLICADA.
    files:
      - supabase/migrations/20260623b_desfazer_troca_aplicada.sql
      - src/lib/wms/trocas-equivalencia.ts
      - src/lib/wms/trocas-api.ts
      - src/lib/historico-service.ts
      - src/app/api/wms/trocas/[id]/desfazer/route.ts
      - src/lib/wms/desfazer-troca.test.ts
    tags: [troca-equivalencia, desfazer, beco-sem-saida, substituto, reabertura, BUG-A]

  - id: troca-bloqueada-status-concluido-separacao
    date: "2026-06-23"
    source: trocas-equivalencia
    category: business_logic
    message: >
      "Usar equivalente" no checklist de separação falhava com toast
      "pedido em status 'concluido' não aceita troca". O guard de solicitarTroca
      só aceitava pedido.status em ['pendente','executando'], mas 'concluido' é o
      estado NORMAL de um pedido em separação.
    cause: >
      O job lancar_estoque (marcadores/NF — inclusive OC via
      executarMarcadoresOnly) flipa pedido.status executando→concluido ANTES da
      separação física (worker loop em execution-worker.ts:240-252). A separação
      é rastreada por status_separacao, ORTOGONAL a status. Logo, quando o
      operador chega no checklist, status já é 'concluido' (ex.: item OC em
      validacao_oc/aguardando_compra, ou item própria em aguardando_separacao).
      O guard checava a dimensão errada (status do pedido em vez do estágio de
      separação), bloqueando praticamente toda troca feita do checklist.
    fix: >
      Inverter o guard pra denylist: rejeitar só status 'cancelado'/'erro'. O
      estágio de pick já é gateado logo abaixo por status_separacao (bloqueia
      separado/embalado/conferido/expedido) + qtyResidual (item já separado =
      nada a trocar), que são as dimensões corretas. Nenhuma mudança em RPC —
      aprovarTroca/wms_aprovar_troca_atomico não olham pedido.status.
    files:
      - src/lib/wms/trocas-equivalencia.ts
    tags: [troca-equivalencia, separacao, status-pedido, concluido, oc, checklist, guard]

  - id: conferencia-bip-qr-ml-nao-encontrado
    date: "2026-06-23"
    source: conferencia
    category: business_logic
    message: >
      Bipar o QR da etiqueta ML na Conferência (kiosk) dava "Nenhum pedido
      encontrado pra esse código" — o Code128 funcionava, o QR não.
    cause: >
      O payload do QR ML é um JSON ({"id":"<shipmentId>","t":"lm"}), guardado em
      siso_pedidos.etiqueta_barcodes ao lado do mesmo shipment id como Code128
      cru. resolverPedidoPorBarcode só fazia match EXATO do valor cru
      (contains([codigo])). O JSON do QR não casava por 2 motivos: (1) num
      teclado ABNT2 o leitor em keyboard-wedge garbleia chaves/aspas/`:` (dígitos
      sobrevivem); (2) mesmo limpo, o contains do PostgREST não encoda um
      elemento de array com `{`/`,`/`"`. O Code128 (só dígitos) nunca teve esse
      problema, por isso funcionava.
    fix: >
      derivarCandidatos(codigo) extrai candidatos do valor cru: valor original,
      sem prefixo AIM (]Q1…), id do JSON e runs de 8+ dígitos. O step 1 passou a
      casar por overlap (etiqueta_barcodes && {candidatos seguros}) — o shipment
      id (run de dígitos) casa o Code128 guardado, contornando garble e encode.
      Steps 2/3/4 também consomem os candidatos (chave 44-díg, id_pedido_ecommerce
      via .in, ZPL ILIKE por run de dígitos). Mantém match exato do cru como
      fallback pro QR JSON limpo. Formato real confirmado no staging
      (pedido 1046453837).
    files:
      - src/lib/wms/conferencia.ts
      - src/lib/wms/conferencia.test.ts
    tags: [conferencia, bip, qr, mercado-livre, etiqueta-barcodes, abnt2, postgrest, overlap]

  - id: conferencia-bip-flex-ml-pedido-errado
    date: "2026-06-23"
    source: conferencia
    category: business_logic
    message: >
      Bipar a etiqueta ML Flex na Conferência abria o PEDIDO ERRADO (outro pedido
      do mesmo vendedor) — não "não encontrado". Confirmado no staging: bipar o
      shipment 47362787565 (pedido 52074) abria o 52040.
    cause: >
      O QR do Flex é um JSON mais rico que o ML simples ({"id":"<ship>","t":"lm"}):
      {"id":<ship>,"sender_id":<vendedor>,"hash_code":"…","security_digit":"0"}.
      Dois efeitos combinados: (1) derivarCandidatos extraía TODO run de 8+ dígitos
      (extrairRunsDigitos) → pegava também o sender_id, que é o id da CONTA do
      vendedor (constante entre todos os pedidos do mesmo vendedor); um pedido
      anterior já tinha esse sender_id guardado standalone (via self-heal), então o
      overlap casava esse pedido errado. (2) a etiqueta Flex é QR-only (só ^BQ, sem
      ^BC Code128), então o shipment id só existe DENTRO do JSON em etiqueta_barcodes
      e o overlap (igualdade de elemento do array) nunca casa o pedido certo por ele.
      Resultado: id certo não casa, sender_id casa o pedido errado.
    fix: >
      (a) conferencia.ts derivarCandidatos ancora no campo `id` (regex limpa p/ id
      alfanumérico + regex garble-tolerant /id[^0-9]{0,6}(\d{8,})/i, .exec pega só a
      1ª ocorrência = shipment id) e NÃO emite runs cegos quando achou o id → o
      sender_id deixa de ser candidato. (b) etiqueta-barcode.ts extrairBarcodesDoZpl
      passa a guardar o `id` do JSON do QR standalone → Flex (QR-only) casa por
      overlap direto. (c) step 4 (ZPL self-heal) e alvosZpl usam candidatos
      seguros/derivados em vez de runs cegos → não re-guardam nem buscam pelo
      sender_id (evita re-poison + falso "ambíguo"). Validado no staging: bip do
      47362787565 resolve o pedido certo 52074 (era 52040 via sender_id 735198837).
    files:
      - src/lib/wms/conferencia.ts
      - src/lib/etiqueta-barcode.ts
      - src/lib/wms/conferencia.test.ts
      - src/lib/etiqueta-barcode.test.ts
    tags: [conferencia, bip, qr, mercado-livre, flex, sender_id, etiqueta-barcodes, overlap, abnt2]

  - id: inventario-bipe-loc-2x-soma-no-primeiro-produto
    date: "2026-06-23"
    source: wms.inventario.contar
    category: business_logic
    message: >
      no bipe do inventário, bipar a etiqueta da localização 2x somava estoque
      no "primeiro produto"; e o campo de bipar/digitar resolvia produto por
      nome aproximado.
    cause: >
      registrarContagemPorSku (contar/page.tsx) resolvia o SKU não-esperado via
      GET /api/wms/produtos?q=<v>&limit=1. listarProdutos faz busca FUZZY:
      descricao.ilike.%term% (nome aproximado) + pré-resolve localizacao.codigo
      ilike pra IDs de produto com saldo naquela loc. Ao bipar o código da loc
      (depois de já confirmada, em etapa 'counting'), o `q` casava produtos com
      saldo naquela loc/nome parecido e com limit=1 retornava o 1º (sku_asc),
      somando +1 nele. Mesma busca fuzzy fazia o campo "puxar pelo nome".
    fix: >
      (1) Novo resolverProdutoPorCodigo(codigo) em produtos.ts: match EXATO por
      SKU (ilike sem wildcard = case-insensitive) e fallback GTIN exato, sem
      descricao/loc. Rota GET /api/wms/produtos ganhou branch ?codigo= que usa
      esse resolver; a busca fuzzy ?q= das outras telas ficou intocada. O
      fallback do bipe passou a chamar ?codigo=<v>. (2) Guard em handleScan: na
      etapa 'counting', se o valor bipado == locAtual.codigo (re-bipe da
      etiqueta da loc), ignora com toast em vez de tratar como produto.
    files:
      - src/lib/wms/produtos.ts
      - src/app/api/wms/produtos/route.ts
      - src/app/wms/inventario/[id]/contar/page.tsx
    tags: [inventario, bip, contagem, sku, gtin, localizacao, fuzzy, produtos, double-bip]

  - id: separacao-trocar-loc-nao-reflete-e-reordena
    date: "2026-06-23"
    source: api.wms.separacao.checklist-items
    category: business_logic
    message: >
      No checklist da separação, "pegar daqui" em outra localização (flechinha
      do endereço) movia a reserva no back mas o endereço exibido NÃO mudava — e
      quando mudava, a linha pulava de lugar na lista ordenada por localização,
      fazendo o operador perder o item numa lista de centenas.
    cause: >
      (1) checklist-items derivava a loc exibida de escolherLocCobrindo (heurística
      de maior-saldo sobre siso_estoque), desacoplada da reserva R. O pick real
      (marcar-item/parcial) baixa da loc da R (origem_tipo='reserva_pedido'). A
      Troca de Localização move a R (wms_trocar_reserva_localizacao_atomico: L na
      antiga + R no destino), mas o display recomputava a heurística e ignorava a
      R — pior, mover a R baixa o disponível do destino, então a heurística
      mostrava o destino MENOS. (2) ordenar() ordenava pela loc exibida; ao trocar,
      a linha re-sortava pra posição da nova loc.
    fix: >
      (1) checklist-items agora resolve a loc da R viva por (pedido, sku) — R
      'reserva_pedido' sem L pareado, maior qty no cascade — e exibe ela,
      caindo na heurística só sem reserva (OC/já picado). Display passa a bater
      com onde o pick sai. (2) pinSortLocRef no page: handleTrocarLoc congela a
      loc PRÉ-troca como sort key do produto (por produto.key), então a linha
      mantém a posição; ordenar() usa o pin quando presente. Display vira o novo
      endereço, a posição na lista não.
    files:
      - src/app/api/wms/separacao/checklist-items/route.ts
      - src/app/wms/separacao/checklist/page.tsx
      - src/app/wms/separacao/checklist/__tests__/parcial-redirecionado.test.tsx
    tags: [separacao, checklist, localizacao, reserva, troca-localizacao, ordenacao, pin, picking]

  - id: separacao-parcial-loc-zerou-qty-zero-marca-completo
    date: "2026-06-23"
    source: app.wms.separacao.checklist
    category: business_logic
    message: >
      No parcial, clicar "não peguei nada" (qty=0) + "a localização zerou" buscava
      outra loc (cria realocação) mas deixava o item da lista principal marcado
      como COMPLETO/✓ — mentindo que foi separado quando nada foi pego.
    cause: >
      Em /separacao/parcial, com loc_zerou=true o claim atômico (Pass A) marca
      separacao_marcado=true em TODOS os itens (itemsParaMarcar = qty_residual===0
      OU loc_zerou), mesmo qty_pega=0. A UI deriva done=all_marcado → renderiza a
      linha como completa. concluir JÁ bloqueia o pedido via realocação pendente
      (não confia só no separacao_marcado), então o marcar serve só de proteção
      anti-re-pick na loc morta — mas visualmente vira "feito".
    fix: >
      Conserto de exibição (não mexe no back — concluir já trava): novo
      itemRedirecionadoSemPick (separacao_parcial && quantidade_pega===0 &&
      realocação aguardando_picking) filtra o item da lista principal antes do
      consolidar. A linha da Realocação (seção própria) já indica onde pegar. O
      item reaparece — agora de fato done — quando a realocação é picada
      (quantidade_pega passa a >0). Parcial-em-progresso (qty_pega>0) intocado
      (segue como split PEGO/PEGAR).
    files:
      - src/app/wms/separacao/checklist/page.tsx
      - src/app/wms/separacao/checklist/__tests__/parcial-redirecionado.test.tsx
    tags: [separacao, parcial, loc-zerou, realocacao, checklist, marcado, picking, ui]
