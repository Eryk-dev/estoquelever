  - id: non-marketplace-order-ingested
    date: "2026-03-25"
    source: reconciliacao
    category: business_logic
    message: "Internal/manual Tiny order entered SISO — pedido #132533 'FULL SEPARADO EM CURITIBA' with no ecommerce"
    cause: >
      Neither the webhook processor nor the reconciliation service filtered
      orders by marketplace origin. Any approved order in Tiny (including
      internal, manual, or wholesale orders) was ingested into SISO. Order
      #132533 was picked up by Phase 2 of reconciliation (missing orders
      polling) because it was an approved order without a webhook_log entry.
    fix: >
      Added marketplace filter in webhook-processor.ts after fetching order
      from Tiny (step 4a). If pedido has no nomeEcommerce AND no
      idPedidoEcommerce, skip processing and mark webhook_log as 'ignorado'.
      Deleted order #132533 and all related data from DB.
    files:
      - src/lib/webhook-processor.ts
    tags: [marketplace, ecommerce, reconciliacao, filtro, full, manual-order, webhook-processor]

  - id: ghost-reservation-transferencia
    date: "2026-03-30"
    source: worker
    category: business_logic
    message: "Reservas fantasma acumulam na empresa origem em pedidos transferencia"
    cause: >
      Quando um pedido era atendido por outra empresa (transferencia), o
      execution-worker gerava NF na origem mas NAO fazia lancarEstoqueNota.
      Isso deixava a reserva do Tiny ativa na empresa origem permanentemente.
      O campo 'disponivel' (saldo - reservado) ficava cada vez mais baixo
      por acumular reservas de pedidos ja atendidos por outras unidades.
      Afetava tanto transferencias diretas quanto OCs recebidos em outro galpao
      (via compras-release.ts que reclassifica como transferencia).
    fix: >
      Adicionado lancarEstoqueNota na empresa origem para pedidos transferencia.
      Isso limpa a reserva e abaixa o saldo. Em seguida, para cada item,
      movimentarEstoque(E) na origem compensa o saldo (net zero na origem).
      A saida fisica continua sendo movimentarEstoque(S) na empresa suporte.
      Tambem adicionado estoque_lancado=true e transicao aguardando_nf→aguardando_separacao.
    files:
      - src/lib/execution-worker.ts
    tags: [reserva, estoque, transferencia, fantasma, disponivel, saldo, tiny, worker, oc, compras]

  - id: compras-autofix-no-release
    date: "2026-03-30"
    source: compras-api
    category: business_logic
    message: "Pedidos ficam travados em aguardando_compra apesar de todos os itens estarem recebidos"
    cause: >
      Dois caminhos marcavam itens como recebido sem chamar checkAndReleasePedidos:
      1) O auto-fix no GET /api/compras (fetchReceber) detecta itens com
         compra_quantidade_recebida >= solicitada mas compra_status != recebido,
         e corrige o status. Porem nao dispara a logica de release.
      2) O POST /api/compras/receber tinha uma funcao duplicada findAndReleasePedidos
         com logica divergente da canonica (usava status=concluido em vez de executando,
         resolvia galpao do pedido em vez do galpao da OC, nao chamava checkAndReleasePedidos).
      9 pedidos SP ficaram travados. Logs confirmam: auto-fix marcou itens em
      2026-03-30 09:56 e 18:37, sem nenhum log de release para esses pedidos.
    fix: >
      1) Auto-fix no GET /api/compras agora chama checkAndReleasePedidos apos marcar itens.
      2) POST /api/compras/receber agora usa checkAndReleasePedidos (de compras-release.ts)
         em vez da funcao duplicada findAndReleasePedidos que foi removida.
    files:
      - src/app/api/compras/route.ts
      - src/app/api/compras/receber/route.ts
    tags: [compras, release, aguardando_compra, recebido, auto-fix, stuck, receber, checkAndReleasePedidos]

  - id: marcar-item-rejeita-aguardando-compra
    date: "2026-03-31"
    source: separacao-marcar-item
    category: business_logic
    message: "Erro ao salvar marcacao"
    cause: >
      marcar-item so aceitava pedidos com status_separacao em_separacao ou
      aguardando_separacao. Porem a rota iniciar mantém pedidos com itens OC
      pendentes em aguardando_compra (blindagem intencional). Ao clicar no
      checkbox do checklist, o backend rejeitava com 400 porque aguardando_compra
      nao estava na lista de status permitidos. bipar-checklist nao tinha essa
      validacao, entao barcode scan funcionava normalmente. No fluxo normal de
      separacao, o mesmo erro ocorria quando um pedido tinha mix de itens OC e
      nao-OC: o pedido ficava em aguardando_compra por causa dos itens OC, e os
      itens nao-OC tambem falhavam ao marcar.
    fix: >
      Adicionado aguardando_compra ao ALLOWED_STATUSES em marcar-item/route.ts.
      Seguro porque iniciar ja aceita esse status e checklist-items ja exibe os
      itens correspondentes.
    files:
      - src/app/api/separacao/marcar-item/route.ts
    tags: [separacao, marcar-item, aguardando_compra, pick-oc, checkbox, checklist]

  - id: nf-ja-expedida-encaminhar-limpa-etiqueta
    date: "2026-04-02"
    source: encaminhar
    category: business_logic
    message: "Nota fiscal com id 'X' já foi expedida"
    cause: >
      Quando um pedido era encaminhado para outro galpao, o encaminhar limpava
      agrupamento_expedicao_id, expedicao_id, etiqueta_url e etiqueta_zpl. Na
      re-aprovacao, o sistema tentava criar novo agrupamento com a mesma NF e
      o Tiny rejeitava (400: NF ja expedida). A etiqueta ficava bloqueada.
    fix: >
      Encaminhar agora preserva os campos de agrupamento/etiqueta (estao vinculados
      a NF, nao ao galpao). Apenas etiqueta_status e resetado para permitir
      reimprimir no novo destino. Isso evita o erro no Tiny e permite fast path
      na embalagem.
    files:
      - src/app/api/separacao/encaminhar/route.ts
    tags: [etiqueta, agrupamento, expedicao, nf-ja-expedida, encaminhar, forward, zpl]

- id: fila-check-constraint-blocks-pos-nf
  date: 2026-04-07
  source: nf-webhook / worker
  category: database
  message: "Job lancar_estoque_pos_nf enfileirado (mas nunca criado)"
  cause: >
    Commit 6b371be deferiu lancamento de estoque de transferencia para pos-NF,
    criando tipo "lancar_estoque_pos_nf". Porem o CHECK constraint chk_fila_tipo
    na tabela siso_fila_execucao so aceitava "lancar_estoque". O insert falhava
    silenciosamente porque nf-webhook-handler nao verificava o resultado.
    Resultado: 173 pedidos de transferencia sem estoque lancado no Tiny.
  fix: >
    1. Migration: ALTER constraint para aceitar ambos os tipos.
    2. nf-webhook-handler: captura e loga erro do insert.
    3. Re-enfileirados 134 jobs pendentes (1 cancelado por encaminhamento).
  files:
    - supabase/migrations/20260407_fix_fila_tipo_constraint.sql
    - src/lib/nf-webhook-handler.ts
  tags: [estoque, transferencia, fila, constraint, pos-nf, lancamento, worker]

- id: encaminhar-galpao-errado
  date: 2026-04-07
  source: encaminhar
  category: business_logic
  message: "Pedido encaminhado de SP para SP (deveria ser CWB para SP)"
  cause: >
    encaminhar/route.ts usava pedido.filial_origem (origem marketplace, fixa)
    em vez do galpao que estava executando o pedido. Adicionalmente,
    sugestao era sempre "transferencia", o que fazia o filtro de pendentes
    esconder o pedido do galpao destino quando destino == filial_origem.
  fix: >
    1. Nova funcao resolveGalpaoAtual: resolve via separacao_galpao_id ou fila_execucao.
    2. encaminhado_de agora usa o galpao real.
    3. sugestao dinamica: "propria" se destino == filial_origem, "transferencia" caso contrario.
    4. Correcao manual do pedido 949622631 no banco.
  files:
    - src/app/api/separacao/encaminhar/route.ts
  tags: [encaminhar, galpao, filtro, visibilidade, sugestao, transferencia]

- id: wms-reservar-atomico-origem-detalhes-null
  date: 2026-05-08
  source: wms.reservas
  category: database
  message: "RPC wms_reservar_atomico violava NOT NULL em siso_movimentacoes.origem_detalhes"
  cause: >
    A RPC wms_reservar_atomico (Plano 3) chamava wms_inserir_movimentacao
    passando NULL no parametro p_origem_detalhes. A coluna origem_detalhes
    na tabela siso_movimentacoes (Plano 1) tem NOT NULL DEFAULT '{}'::jsonb,
    mas o INSERT explicito passa o valor (NULL) que sobreescreve o DEFAULT
    e dispara a violacao da constraint.
  fix: >
    Atualizar wms_reservar_atomico para passar '{}'::jsonb em vez de NULL
    no terceiro argumento de wms_inserir_movimentacao. Migration original
    20260522_wms_roteamento.sql ajustada + CREATE OR REPLACE aplicado em
    staging.
  files:
    - supabase/migrations/20260522_wms_roteamento.sql
  tags: [wms, reservas, rpc, jsonb, not-null, plano3]

- id: sisofetch-zombie-session-unauthorized
  date: 2026-05-11
  source: auth-context.sisoFetch
  category: auth
  message: "Tela mostra 'Erro: unauthorized' em todas as APIs apesar do usuario aparecer logado"
  cause: >
    Sessao do servidor (siso_sessoes.expira_em, TTL 12h) expirou enquanto a aba
    permanecia aberta, mas o localStorage continuou guardando siso_user com o
    sessionId morto. useAuth le o localStorage e renderiza o usuario como logado;
    sisoFetch envia X-Session-Id expirado; servidor retorna 401 {error:"unauthorized"};
    AppShell/WmsShell so redirecionam pro /login se user for null, e user nao era
    null. Resultado: UI "zumbi" em que cada query do TanStack renderiza linha de
    erro mas o usuario parece logado.
  fix: >
    sisoFetch agora detecta status 401 em qualquer endpoint diferente de
    /api/auth/login e dispara handleUnauthorized(): limpa siso_user + siso_active_galpao
    do localStorage e faz window.location.replace('/login?reason=session-expired').
    Flag module-level unauthorizedRedirectInFlight evita multiplos redirects quando
    varias queries falham em paralelo. Pagina /login le ?reason=session-expired e
    mostra toast.error('Sua sessao expirou. Faca login novamente.').
  files:
    - src/lib/auth-context.tsx
    - src/app/login/page.tsx
  tags: [auth, sessao, sisoFetch, localStorage, 401, ux, wms]
